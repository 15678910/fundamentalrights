<svg viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="네모는 회장이 키 큰 사람만 나가는 거라고 말하고 동그라미는 시무룩해하는 장면">
  <title>네모는 회장이 키 큰 사람만 나가는 거라고 말하고 동그라미는 시무룩해하는 장면</title>
  <rect width="320" height="260" fill="#ffffff"/>
  <rect y="200" width="320" height="60" fill="#eef2f7"/>

  <!-- 패널 번호 -->
  <circle cx="22" cy="22" r="13" fill="#e11d2a"/>
  <text x="22" y="27" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">2</text>

  <!-- 동그라미 (시무룩) -->
  <g transform="translate(100,206)">
    <ellipse cx="0" cy="2" rx="24" ry="5" fill="#1f2937" opacity="0.08"/>
    <line x1="-10" y1="-32" x2="-11" y2="-3" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="-32" x2="11" y2="-3" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-11" cy="-2" rx="6" ry="3" fill="#1f2937"/>
    <ellipse cx="11" cy="-2" rx="6" ry="3" fill="#1f2937"/>
    <circle cx="0" cy="-55" r="28" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
    <path d="M -3,-83 Q 4,-94 -2,-99 Q -7,-103 -1,-107" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M -26,-56 Q -30,-46 -26,-38" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 26,-56 Q 30,-46 26,-38" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="-19" cy="-54" r="3" fill="#e11d2a" opacity="0.3"/>
    <circle cx="19" cy="-54" r="3" fill="#e11d2a" opacity="0.3"/>
    <circle cx="-9" cy="-58" r="2.5" fill="#1f2937"/>
    <circle cx="9" cy="-58" r="2.5" fill="#1f2937"/>
    <line x1="-6" y1="-67" x2="-13" y2="-63" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <line x1="13" y1="-63" x2="6" y2="-67" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <path d="M -6,-45 Q 0,-49 6,-45" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 네모 (허리에 손, 잘난 척) -->
  <g transform="translate(220,206)">
    <ellipse cx="0" cy="2" rx="26" ry="5" fill="#1f2937" opacity="0.08"/>
    <line x1="-10" y1="-30" x2="-11" y2="-3" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="-30" x2="11" y2="-3" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <rect x="-16" y="-6" width="10" height="6" rx="2" fill="#e11d2a"/>
    <rect x="6" y="-6" width="10" height="6" rx="2" fill="#e11d2a"/>
    <rect x="-28" y="-85" width="56" height="56" rx="10" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/>
    <polyline points="-24,-85 -17,-97 -9,-85 0,-98 9,-85 17,-97 24,-85" fill="none" stroke="#e11d2a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M -26,-65 Q -30,-55 -20,-50" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <rect x="-26" y="-52" width="8" height="8" rx="3" fill="#e11d2a"/>
    <path d="M 26,-65 Q 30,-55 20,-50" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <rect x="18" y="-52" width="8" height="8" rx="3" fill="#e11d2a"/>
    <circle cx="-10" cy="-62" r="3.2" fill="#1f2937"/>
    <circle cx="10" cy="-62" r="3.2" fill="#1f2937"/>
    <line x1="-15" y1="-71" x2="-5" y2="-68" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <line x1="5" y1="-68" x2="15" y2="-71" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <path d="M -8,-48 Q 0,-44 8,-48" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 말풍선: 동그라미 -->
  <rect x="6" y="12" width="140" height="48" rx="14" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <polygon points="78,60 94,60 100,90" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <rect x="78" y="58" width="16" height="4" fill="#ffffff"/>
  <text x="76" y="41" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="15" fill="#1f2937">나도 나가 볼까…</text>

  <!-- 말풍선: 네모 (2줄) -->
  <rect x="156" y="4" width="156" height="66" rx="14" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <polygon points="212,70 220,100 228,70" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <rect x="212" y="68" width="16" height="4" fill="#ffffff"/>
  <text x="234" y="29" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="15" fill="#1f2937">
    <tspan x="234" dy="0">회장은 키 큰</tspan>
    <tspan x="234" dy="22">사람만 하는 거야!</tspan>
  </text>
</svg>
