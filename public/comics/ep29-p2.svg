<svg viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="그넷줄이 끊어져 동그라미가 엉덩방아를 찧는 장면">
  <title>그넷줄이 끊어져 동그라미가 엉덩방아를 찧는 장면</title>
  <rect width="320" height="260" fill="#ffffff"/>
  <rect y="200" width="320" height="60" fill="#eef2f7"/>

  <!-- 패널 번호 -->
  <circle cx="22" cy="22" r="13" fill="#e11d2a"/>
  <text x="22" y="27" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">2</text>

  <!-- 그네 (줄 끊어짐) -->
  <line x1="180" y1="204" x2="210" y2="38" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/>
  <line x1="240" y1="204" x2="210" y2="38" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/>
  <line x1="188" y1="188" x2="232" y2="188" stroke="#1f2937" stroke-width="2"/>
  <line x1="202" y1="45" x2="198" y2="150" stroke="#1f2937" stroke-width="2"/>
  <path d="M 218,45 L 214,62 L 220,68 L 215,76 L 219,82" stroke="#1f2937" stroke-width="2" fill="none" stroke-linecap="round"/>
  <g transform="translate(180,158) rotate(-24)">
    <rect x="-18" y="-5" width="36" height="10" rx="3" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/>
  </g>

  <!-- 충격 표시 -->
  <path d="M 52,132 L 56,140 M 48,138 L 60,134" stroke="#e11d2a" stroke-width="2" stroke-linecap="round"/>
  <path d="M 76,118 L 80,126 M 72,124 L 84,120" stroke="#e11d2a" stroke-width="2" stroke-linecap="round"/>

  <!-- 동그라미 (엉덩방아) -->
  <g transform="translate(105,206)">
    <ellipse cx="0" cy="4" rx="32" ry="6" fill="#1f2937" opacity="0.08"/>
    <line x1="-4" y1="-6" x2="-34" y2="6" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="4" y1="-6" x2="32" y2="8" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-35" cy="7" rx="6" ry="3" fill="#1f2937"/>
    <ellipse cx="33" cy="9" rx="6" ry="3" fill="#1f2937"/>
    <circle cx="2" cy="-48" r="28" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
    <path d="M -1,-76 Q 6,-87 0,-92 Q -5,-96 1,-100" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M -24,-52 Q -34,-38 -30,-18" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 28,-52 Q 38,-38 34,-18" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="-17" cy="-47" r="3" fill="#e11d2a" opacity="0.3"/>
    <circle cx="21" cy="-47" r="3" fill="#e11d2a" opacity="0.3"/>
    <circle cx="-7" cy="-52" r="3" fill="#1f2937"/>
    <circle cx="11" cy="-52" r="3" fill="#1f2937"/>
    <path d="M -12,-60 Q -8,-63 -3,-60" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 6,-60 Q 11,-63 15,-60" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
    <ellipse cx="2" cy="-40" rx="3" ry="4" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  </g>

  <!-- 네모 (깜짝 놀람) -->
  <g transform="translate(270,206)">
    <ellipse cx="0" cy="2" rx="26" ry="5" fill="#1f2937" opacity="0.08"/>
    <line x1="-10" y1="-30" x2="-13" y2="-3" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="-30" x2="14" y2="-3" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <rect x="-19" y="-6" width="10" height="6" rx="2" fill="#e11d2a"/>
    <rect x="9" y="-6" width="10" height="6" rx="2" fill="#e11d2a"/>
    <rect x="-28" y="-85" width="56" height="56" rx="10" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/>
    <polyline points="-24,-85 -17,-97 -9,-85 0,-98 9,-85 17,-97 24,-85" fill="none" stroke="#e11d2a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M -26,-64 Q -36,-56 -38,-44" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <rect x="-44" y="-48" width="8" height="8" rx="3" fill="#e11d2a"/>
    <path d="M 26,-64 Q 36,-56 38,-44" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <rect x="36" y="-48" width="8" height="8" rx="3" fill="#e11d2a"/>
    <circle cx="-10" cy="-62" r="3.4" fill="#1f2937"/>
    <circle cx="10" cy="-62" r="3.4" fill="#1f2937"/>
    <path d="M -15,-72 Q -10,-75 -5,-72" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 5,-72 Q 10,-75 15,-72" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
    <ellipse cx="0" cy="-49" rx="3" ry="4" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  </g>

  <!-- 말풍선: 동그라미 -->
  <rect x="18" y="12" width="76" height="42" rx="14" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <polygon points="46,54 66,54 68,86" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <rect x="47" y="52" width="18" height="4" fill="#ffffff"/>
  <text x="56" y="35" text-anchor="middle" dominant-baseline="middle" font-family="'Pretendard', sans-serif" font-size="16" fill="#1f2937">아야!</text>
</svg>
