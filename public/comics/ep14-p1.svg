<svg viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="동그라미가 이삿짐 상자 옆에서 설렘과 걱정이 섞인 표정으로 서 있는 장면">
  <title>동그라미가 이삿짐 상자 옆에서 설렘과 걱정이 섞인 표정으로 서 있는 장면</title>
  <rect width="320" height="260" fill="#ffffff"/>
  <rect y="200" width="320" height="60" fill="#eef2f7"/>

  <!-- 창문 (배경) -->
  <rect x="16" y="18" width="60" height="48" rx="4" fill="#eaf4ff" stroke="#1f2937" stroke-width="2"/>
  <line x1="46" y1="18" x2="46" y2="66" stroke="#1f2937" stroke-width="2"/>
  <line x1="16" y1="42" x2="76" y2="42" stroke="#1f2937" stroke-width="2"/>

  <!-- 패널 번호 -->
  <circle cx="298" cy="22" r="13" fill="#e11d2a"/>
  <text x="298" y="27" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">1</text>

  <!-- 이삿짐 상자들 -->
  <g>
    <rect x="150" y="150" width="42" height="42" rx="2" fill="#e9d5b8" stroke="#1f2937" stroke-width="2.5"/>
    <line x1="150" y1="171" x2="192" y2="171" stroke="#c9a878" stroke-width="2"/>
    <line x1="171" y1="150" x2="171" y2="192" stroke="#c9a878" stroke-width="2"/>
    <rect x="188" y="130" width="36" height="36" rx="2" fill="#f0dfc4" stroke="#1f2937" stroke-width="2.5"/>
    <line x1="188" y1="148" x2="224" y2="148" stroke="#c9a878" stroke-width="2"/>
    <line x1="206" y1="130" x2="206" y2="166" stroke="#c9a878" stroke-width="2"/>
  </g>

  <!-- 동그라미 (설렘 반, 걱정 반) -->
  <g transform="translate(85,206)">
    <ellipse cx="0" cy="2" rx="24" ry="5" fill="#1f2937" opacity="0.08"/>
    <line x1="-10" y1="-32" x2="-11" y2="-3" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="-32" x2="11" y2="-3" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-11" cy="-2" rx="6" ry="3" fill="#1f2937"/>
    <ellipse cx="11" cy="-2" rx="6" ry="3" fill="#1f2937"/>
    <circle cx="0" cy="-57" r="28" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
    <path d="M -3,-85 Q 4,-96 -2,-101 Q -7,-105 -1,-109" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M -26,-60 Q -32,-50 -30,-38" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 26,-60 Q 32,-50 30,-38" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="-19" cy="-56" r="3" fill="#e11d2a" opacity="0.3"/>
    <circle cx="19" cy="-56" r="3" fill="#e11d2a" opacity="0.3"/>
    <circle cx="-9" cy="-61" r="2.5" fill="#1f2937"/>
    <circle cx="9" cy="-61" r="2.5" fill="#1f2937"/>
    <path d="M -14,-68 Q -9,-71 -4,-68" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
    <line x1="4" y1="-67" x2="14" y2="-70" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <path d="M -6,-49 Q -1,-52 4,-49 Q 7,-47 9,-50" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 말풍선: 동그라미 -->
  <path d="M 88,10 H 250 A14,14 0 0 1 264,24 V 62 A14,14 0 0 1 250,76 H 106 L 97,110 L 88,76 A14,14 0 0 1 74,62 V 24 A14,14 0 0 1 88,10 Z" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="169" y="45" text-anchor="middle" dominant-baseline="middle" font-family="'Pretendard', sans-serif" font-size="15" fill="#1f2937">
    <tspan x="169" dy="-11">새 동네는 어떤</tspan>
    <tspan x="169" dy="22">곳일까?</tspan>
  </text>

  <!-- 캡션 없음: 상황 제시 컷 -->
</svg>
