<svg viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="네모가 저금통을 돌려주며 빌려 달라고 말하겠다고 하고 동그라미가 동전 하나를 선물하는 장면">
  <title>네모가 저금통을 돌려주며 빌려 달라고 말하겠다고 하고 동그라미가 동전 하나를 선물하는 장면</title>
  <rect width="320" height="260" fill="#ffffff"/>
  <rect y="200" width="320" height="60" fill="#eef2f7"/>

  <!-- 패널 번호 -->
  <circle cx="298" cy="140" r="13" fill="#e11d2a"/>
  <text x="298" y="145" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">4</text>

  <!-- 돼지저금통 (돌려주는 중, 둘 사이) -->
  <g transform="translate(163,182) scale(0.6)">
    <ellipse cx="0" cy="-38" rx="34" ry="26" fill="#e11d2a" stroke="#1f2937" stroke-width="3"/>
    <path d="M -22,-58 L -30,-70 L -14,-64 Z" fill="#e11d2a" stroke="#1f2937" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 22,-58 L 30,-70 L 14,-64 Z" fill="#e11d2a" stroke="#1f2937" stroke-width="3" stroke-linejoin="round"/>
    <ellipse cx="0" cy="-32" rx="10" ry="7" fill="#ffffff" stroke="#1f2937" stroke-width="2.5"/>
    <circle cx="-4" cy="-32" r="1.6" fill="#1f2937"/>
    <circle cx="4" cy="-32" r="1.6" fill="#1f2937"/>
    <circle cx="-14" cy="-42" r="2.5" fill="#1f2937"/>
    <circle cx="14" cy="-42" r="2.5" fill="#1f2937"/>
    <rect x="-8" y="-64" width="16" height="4" rx="2" fill="#1f2937"/>
  </g>

  <!-- 네모 (돌려주며 웃음) -->
  <g transform="translate(90,206)">
    <ellipse cx="0" cy="2" rx="26" ry="5" fill="#1f2937" opacity="0.08"/>
    <line x1="-10" y1="-30" x2="-11" y2="-3" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="-30" x2="11" y2="-3" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <rect x="-16" y="-6" width="10" height="6" rx="2" fill="#e11d2a"/>
    <rect x="6" y="-6" width="10" height="6" rx="2" fill="#e11d2a"/>
    <rect x="-28" y="-85" width="56" height="56" rx="10" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/>
    <path d="M -20,-85 q6 -12 12 -4 q6 -12 12 -4 q6 -10 12 -2" fill="none" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <path d="M -26,-65 Q -30,-55 -20,-50" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 26,-65 Q 50,-70 64,-64" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <g fill="none" stroke="#1f2937" stroke-width="2"><circle cx="-10" cy="-62" r="7"/><circle cx="10" cy="-62" r="7"/><path d="M -3,-62 h6"/></g>
    <circle cx="-10" cy="-62" r="3.2" fill="#1f2937"/>
    <circle cx="10" cy="-62" r="3.2" fill="#1f2937"/>
    <line x1="-15" y1="-70" x2="-6" y2="-72" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="-72" x2="15" y2="-70" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <path d="M -8,-49 Q 0,-42 8,-49" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 동그라미 (동전 선물) -->
  <g transform="translate(230,206)">
    <ellipse cx="0" cy="2" rx="24" ry="5" fill="#1f2937" opacity="0.08"/>
    <line x1="-10" y1="-32" x2="-11" y2="-3" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="-32" x2="11" y2="-3" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-11" cy="-2" rx="6" ry="3" fill="#1f2937"/>
    <ellipse cx="11" cy="-2" rx="6" ry="3" fill="#1f2937"/>
    <circle cx="0" cy="-57" r="28" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
    <path d="M -3,-85 Q 4,-96 -2,-101 Q -7,-105 -1,-109" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M -26,-60 Q -46,-64 -60,-58" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="-66" cy="-58" r="8" fill="#f4c430" stroke="#1f2937" stroke-width="2"/>
    <line x1="-72" y1="-58" x2="-60" y2="-58" stroke="#1f2937" stroke-width="1.5"/>
    <path d="M 26,-60 Q 20,-48 13,-44" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/><circle cx="13" cy="-44" r="4" fill="#1f2937"/>
    <circle cx="-19" cy="-56" r="3" fill="#e11d2a" opacity="0.3"/>
    <circle cx="19" cy="-56" r="3" fill="#e11d2a" opacity="0.3"/>
    <g fill="none" stroke="#1f2937" stroke-width="2"><circle cx="-9" cy="-61" r="7"/><circle cx="9" cy="-61" r="7"/><path d="M -2,-61 h4"/></g>
    <circle cx="-9" cy="-61" r="2.5" fill="#1f2937"/>
    <circle cx="9" cy="-61" r="2.5" fill="#1f2937"/>
    <line x1="-13" y1="-68" x2="-6" y2="-66" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="-66" x2="13" y2="-68" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <path d="M -8,-51 Q 0,-45 8,-51" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 말풍선: 네모 (2줄, 좌측 · 네모 머리 위) -->
  <path d="M 32,8 H 138 A12,12 0 0 1 150,20 V 52 A12,12 0 0 1 138,64 H 100 L 84,92 L 80,64 H 32 A12,12 0 0 1 20,52 V 20 A12,12 0 0 1 32,8 Z" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="85" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="15" fill="#1f2937">
    <tspan x="85" y="30">빌려 달라고</tspan>
    <tspan x="85" y="53">말할게</tspan>
  </text>

  <!-- 말풍선: 동그라미 (우측, 좌측 풍선과 12px 간격) -->
  <path d="M 174,12 H 302 A12,12 0 0 1 314,24 V 46 A12,12 0 0 1 302,58 H 239 L 230,100 L 221,58 H 174 A12,12 0 0 1 162,46 V 24 A12,12 0 0 1 174,12 Z" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="238" y="35" text-anchor="middle" dominant-baseline="middle" font-family="'Pretendard', sans-serif" font-size="16" fill="#1f2937">이거 선물!</text>

  <!-- 캡션 -->
  <text x="160" y="250" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="12" fill="#64748b">제23조 재산권</text>
</svg>
