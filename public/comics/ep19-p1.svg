  <path d="M 28,10 H 174 A13,13 0 0 1 187,23 V 47 A13,13 0 0 1 174,60 H 104 L 95,100 L 86,60 H 28 A13,13 0 0 1 15,47 V 23 A13,13 0 0 1 28,10 Z" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
