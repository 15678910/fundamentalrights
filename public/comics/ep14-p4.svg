<svg viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="네모가 편지를 약속하며 동그라미를 웃으며 배웅하고 둘 사이에 하트가 떠 있는 장면">
  <title>네모가 편지를 약속하며 동그라미를 웃으며 배웅하고 둘 사이에 하트가 떠 있는 장면</title>
  <rect width="320" height="260" fill="#ffffff"/>
  <rect y="200" width="320" height="60" fill="#eef2f7"/>

  <!-- 하트 -->
  <path d="M 160,58 C 154,50 142,52 142,62 C 142,71 160,84 160,84 C 160,84 178,71 178,62 C 178,52 166,50 160,58 Z" fill="#e11d2a" opacity="0.85"/>

  <!-- 반짝임 -->
  <path d="M 250,26 L 252,31 L 257,33 L 252,35 L 250,40 L 248,35 L 243,33 L 248,31 Z" fill="#e11d2a" opacity="0.4"/>
  <path d="M 68,20 L 70,25 L 75,27 L 70,29 L 68,34 L 66,29 L 61,27 L 66,25 Z" fill="#e11d2a" opacity="0.35"/>

  <!-- 패널 번호 -->
  <circle cx="298" cy="22" r="13" fill="#e11d2a"/>
  <text x="298" y="27" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">4</text>

  <!-- 동그라미 (손 흔들며 떠남, 상자 들고) -->
  <g transform="translate(90,206)">
    <ellipse cx="0" cy="2" rx="24" ry="5" fill="#1f2937" opacity="0.08"/>
    <line x1="-10" y1="-32" x2="-11" y2="-3" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="-32" x2="11" y2="-3" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-11" cy="-2" rx="6" ry="3" fill="#1f2937"/>
    <ellipse cx="11" cy="-2" rx="6" ry="3" fill="#1f2937"/>
    <circle cx="0" cy="-57" r="28" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
    <path d="M -3,-85 Q 4,-96 -2,-101 Q -7,-105 -1,-109" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M -26,-60 Q -20,-48 -13,-44" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 26,-60 Q 34,-72 34,-86" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <line x1="34" y1="-86" x2="34" y2="-96" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-19" cy="-56" r="3" fill="#e11d2a" opacity="0.3"/>
    <circle cx="19" cy="-56" r="3" fill="#e11d2a" opacity="0.3"/>
    <path d="M -12,-63 Q -9,-60 -6,-63" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 6,-63 Q 9,-60 12,-63" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
    <line x1="-14" y1="-70" x2="-5" y2="-68" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <line x1="5" y1="-68" x2="14" y2="-70" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <path d="M -7,-49 Q -1,-45 7,-49" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 네모 (웃으며 손 흔들어 배웅) -->
  <g transform="translate(230,206)">
    <ellipse cx="0" cy="2" rx="26" ry="5" fill="#1f2937" opacity="0.08"/>
    <line x1="-10" y1="-30" x2="-11" y2="-3" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="-30" x2="11" y2="-3" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <rect x="-16" y="-6" width="10" height="6" rx="2" fill="#e11d2a"/>
    <rect x="6" y="-6" width="10" height="6" rx="2" fill="#e11d2a"/>
    <rect x="-28" y="-85" width="56" height="56" rx="10" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/>
    <polyline points="-24,-85 -17,-97 -9,-85 0,-98 9,-85 17,-97 24,-85" fill="none" stroke="#e11d2a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- 손 흔드는 팔 -->
    <path d="M -26,-68 Q -40,-80 -38,-96" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M -38,-96 L -46,-100 M -38,-96 L -44,-90 M -38,-96 L -30,-100" stroke="#e11d2a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 26,-65 Q 30,-55 20,-50" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <rect x="16" y="-53" width="8" height="8" rx="3" fill="#e11d2a"/>
    <!-- 손에 편지 -->
    <rect x="10" y="-56" width="18" height="13" rx="1.5" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
    <path d="M 10,-56 L 19,-49 L 28,-56" stroke="#1f2937" stroke-width="1.2" fill="none"/>
    <circle cx="-10" cy="-62" r="3.2" fill="#1f2937"/>
    <circle cx="10" cy="-62" r="3.2" fill="#1f2937"/>
    <path d="M -15,-68 Q -10,-71 -5,-68" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 5,-68 Q 10,-71 15,-68" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M -8,-46 Q 0,-40 8,-46" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 말풍선: 네모 -->
  <path d="M 150,4 H 300 A12,12 0 0 1 312,16 V 40 A12,12 0 0 1 300,52 H 245 L 236,80 L 227,52 H 150 A12,12 0 0 1 138,40 V 16 A12,12 0 0 1 150,4 Z" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="225" y="28" text-anchor="middle" dominant-baseline="middle" font-family="'Pretendard', sans-serif" font-size="15" fill="#1f2937">편지 꼭 쓸게!</text>

  <!-- 캡션 -->
  <text x="160" y="250" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="12" fill="#64748b">제14조 거주·이전의 자유</text>
</svg>
