<svg viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="네모는 어제 복도 뛴 것도 벌점이라 하고, 동그라미는 어제는 규칙이 없었다며 항의하는 장면">
  <title>네모는 어제 복도 뛴 것도 벌점이라 하고, 동그라미는 어제는 규칙이 없었다며 항의하는 장면</title>
  <rect width="320" height="260" fill="#ffffff"/>
  <rect y="200" width="320" height="60" fill="#eef2f7"/>

  <!-- 동그라미 (억울, 팔 벌림) -->
  <g transform="translate(100,206)">
    <ellipse cx="0" cy="2" rx="24" ry="5" fill="#1f2937" opacity="0.08"/>
    <line x1="-10" y1="-32" x2="-11" y2="-3" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="-32" x2="11" y2="-3" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-11" cy="-2" rx="6" ry="3" fill="#1f2937"/>
    <ellipse cx="11" cy="-2" rx="6" ry="3" fill="#1f2937"/>
    <circle cx="0" cy="-57" r="28" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
    <path d="M -3,-85 Q 4,-96 -2,-101 Q -7,-105 -1,-109" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M -27.84,-60 Q -38,-56 -46,-44" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/><circle cx="-46" cy="-44" r="4" fill="#1f2937"/>
    <path d="M 27.84,-60 Q 38,-56 46,-44" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/><circle cx="46" cy="-44" r="4" fill="#1f2937"/>
    <circle cx="-19" cy="-56" r="3" fill="#e11d2a" opacity="0.3"/>
    <circle cx="19" cy="-56" r="3" fill="#e11d2a" opacity="0.3"/>
    <g fill="none" stroke="#1f2937" stroke-width="2"><circle cx="-9" cy="-61" r="7"/><circle cx="9" cy="-61" r="7"/><path d="M -2,-61 h4"/></g>
    <path d="M -12,-63 Q -9,-60 -6,-63" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 6,-63 Q 9,-60 12,-63" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
    <line x1="-16" y1="-70" x2="-6" y2="-68" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="-68" x2="16" y2="-70" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <path d="M -7,-48 Q -1,-44 7,-49" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 네모 (단호, 종이 들고 손가락) -->
  <g transform="translate(220,206)">
    <ellipse cx="0" cy="2" rx="26" ry="5" fill="#1f2937" opacity="0.08"/>
    <line x1="-10" y1="-30" x2="-11" y2="-3" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="-30" x2="11" y2="-3" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <rect x="-16" y="-6" width="10" height="6" rx="2" fill="#e11d2a"/>
    <rect x="6" y="-6" width="10" height="6" rx="2" fill="#e11d2a"/>
    <rect x="-28" y="-85" width="56" height="56" rx="10" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/>
    <path d="M -20,-85 q6 -12 12 -4 q6 -12 12 -4 q6 -10 12 -2" fill="none" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <circle cx="14" cy="-64" r="7" fill="#e11d2a"/>
    <text x="14" y="-61" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="8" font-weight="bold" fill="#ffffff">반</text>
    <path d="M -28,-65 Q -38,-58 -50,-56" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <rect x="-56" y="-59" width="8" height="8" rx="3" fill="#e11d2a"/>
    <path d="M 28,-65 Q 34,-53 30,-42" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <g fill="none" stroke="#1f2937" stroke-width="2"><circle cx="-10" cy="-62" r="7"/><circle cx="10" cy="-62" r="7"/><path d="M -3,-62 h6"/></g>
    <line x1="-13" y1="-62" x2="-7" y2="-62" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="7" y1="-62" x2="13" y2="-62" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="-15" y1="-70" x2="-6" y2="-64" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="-64" x2="15" y2="-70" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <line x1="-7" y1="-49" x2="7" y2="-49" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <!-- 규칙 종이 -->
    <rect x="-70" y="-52" width="26" height="34" rx="3" fill="#ffffff" stroke="#1f2937" stroke-width="2" transform="rotate(-8 -57 -35)"/>
    <line x1="-66" y1="-42" x2="-48" y2="-43" stroke="#94a3b8" stroke-width="1" transform="rotate(-8 -57 -35)"/>
    <line x1="-66" y1="-36" x2="-48" y2="-37" stroke="#94a3b8" stroke-width="1" transform="rotate(-8 -57 -35)"/>
  </g>

  <!-- 말풍선: 동그라미 -->
  <path d="M 28,8 H 118 A14,14 0 0 1 132,22 V 56 A14,14 0 0 1 118,70 H 100 L 91,100 L 82,70 H 28 A14,14 0 0 1 14,56 V 22 A14,14 0 0 1 28,8 Z" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="73" y="39" text-anchor="middle" dominant-baseline="middle" font-family="'Pretendard', sans-serif" font-size="15" fill="#1f2937">
    <tspan x="73" dy="-11">어제는 규칙</tspan>
    <tspan x="73" dy="22">없었잖아!</tspan>
  </text>

  <!-- 말풍선: 네모 -->
  <path d="M 194,8 H 296 A14,14 0 0 1 310,22 V 56 A14,14 0 0 1 296,70 H 231 L 222,100 L 213,70 H 194 A14,14 0 0 1 180,56 V 22 A14,14 0 0 1 194,8 Z" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="245" y="39" text-anchor="middle" dominant-baseline="middle" font-family="'Pretendard', sans-serif" font-size="15" fill="#1f2937">
    <tspan x="245" dy="-11">어제 뛴 것도</tspan>
    <tspan x="245" dy="22">벌점이야!</tspan>
  </text>
</svg>
