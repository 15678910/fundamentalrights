    <circle cx="-10" cy="-62" r="7" fill="#ffffff" fill-opacity="0.5" stroke="#1f2937" stroke-width="2"/>
    <circle cx="10" cy="-62" r="7" fill="#ffffff" fill-opacity="0.5" stroke="#1f2937" stroke-width="2"/>
    <line x1="-3" y1="-62" x2="3" y2="-62" stroke="#1f2937" stroke-width="2"/>
    <circle cx="-10" cy="-62" r="3.2" fill="#1f2937"/>
