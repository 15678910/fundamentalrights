    <path d="M 5,-71 Q 9,-73 13,-71" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M -6,-48 Q 0,-44 6,-48" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
