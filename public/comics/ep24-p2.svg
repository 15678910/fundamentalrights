    <rect x="24" y="-112" width="16" height="22" rx="2" fill="#ffffff" stroke="#1f2937" stroke-width="2" transform="rotate(-8 32 -101)"/>
    <rect x="33" y="-105" width="16" height="22" rx="2" fill="#ffffff" stroke="#1f2937" stroke-width="2" transform="rotate(10 41 -94)"/>
    <line x1="28" y1="-104" x2="36" y2="-104" stroke="#94a3b8" stroke-width="1"/>
    <line x1="37" y1="-97" x2="45" y2="-97" stroke="#94a3b8" stroke-width="1"/>
    <g fill="none" stroke="#1f2937" stroke-width="2"><circle cx="-10" cy="-62" r="7"/><circle cx="10" cy="-62" r="7"/><path d="M -3,-62 h6"/></g>
    <circle cx="-10" cy="-62" r="3.2" fill="#1f2937"/>
    <circle cx="10" cy="-62" r="3.2" fill="#1f2937"/>
    <line x1="-15" y1="-72" x2="-6" y2="-70" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <line x1="4" y1="-72" x2="14" y2="-76" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <path d="M -8,-49 Q -1,-44 9,-51" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 말풍선: 동그라미 -->
  <path d="M 45,2 H 115 A10,10 0 0 1 125,12 V 30 A10,10 0 0 1 115,40 H 89 L 80,70 L 71,40 H 45 A10,10 0 0 1 35,30 V 12 A10,10 0 0 1 45,2 Z" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="80" y="22" text-anchor="middle" dominant-baseline="middle" font-family="'Pretendard', sans-serif" font-size="14" fill="#1f2937">엥?!</text>

  <!-- 말풍선: 네모 -->
  <rect x="135" y="10" width="170" height="60" rx="14" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <polygon points="195,70 215,70 205,98" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <rect x="196" y="68" width="18" height="4" fill="#ffffff"/>
  <text x="220" y="40" text-anchor="middle" dominant-baseline="middle" font-family="'Pretendard', sans-serif" font-size="15" fill="#1f2937">
    <tspan x="220" dy="-11">난 목소리 크니까</tspan>
    <tspan x="220" dy="22">두 표!</tspan>
  </text>
