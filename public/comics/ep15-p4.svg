<svg viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="네모가 네 요리 먼저 먹어볼래 라고 웃으며 말하고 동그라미도 냄비를 들고 함께 웃는 장면">
  <title>네모가 네 요리 먼저 먹어볼래 라고 웃으며 말하고 동그라미도 냄비를 들고 함께 웃는 장면</title>
  <rect width="320" height="260" fill="#ffffff"/>
