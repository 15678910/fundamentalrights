    <path d="M -27.84,-60 Q -34,-70 -32,-84" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/><circle cx="-32" cy="-84" r="4" fill="#1f2937"/>
    <path d="M 27.84,-60 Q 20,-48 13,-44" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/><circle cx="13" cy="-44" r="4" fill="#1f2937"/>
    <circle cx="-19" cy="-56" r="3" fill="#e11d2a" opacity="0.3"/>
    <circle cx="19" cy="-56" r="3" fill="#e11d2a" opacity="0.3"/>
    <g fill="none" stroke="#1f2937" stroke-width="2"><circle cx="-9" cy="-61" r="7"/><circle cx="9" cy="-61" r="7"/><path d="M -2,-61 h4"/></g>
    <path d="M -12,-59 Q -9,-62 -6,-59" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 6,-59 Q 9,-62 12,-59" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M -14,-70 Q -9,-73 -4,-70" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 4,-70 Q 9,-73 14,-70" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M -8,-49 Q -1,-44 8,-49" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
    <g transform="translate(-38,-90)">
