  <!-- 말풍선: 네모 (2줄) -->
  <path d="M 150,8 H 300 A14,14 0 0 1 314,22 V 56 A14,14 0 0 1 300,70 H 245 L 236,104 L 227,70 H 150 A14,14 0 0 1 136,56 V 22 A14,14 0 0 1 150,8 Z" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
