  <!-- 말풍선: 동그라미 -->
  <path d="M 35,10 H 145 A12,12 0 0 1 157,22 V 44 A12,12 0 0 1 145,56 H 100 L 90,90 L 80,56 H 35 A12,12 0 0 1 23,44 V 22 A12,12 0 0 1 35,10 Z" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="90" y="33" text-anchor="middle" dominant-baseline="middle" font-family="'Pretendard', sans-serif" font-size="16" fill="#1f2937">들어와~</text>

  <!-- 캡션 -->
  <text x="160" y="250" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="12" fill="#64748b">제16조 주거의 자유</text>
