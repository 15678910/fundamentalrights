    <ellipse cx="10" cy="-2" rx="5.5" ry="3" fill="#1f2937"/>
    <circle cx="0" cy="-55" r="26" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
    <path d="M -3,-81 Q 4,-92 -2,-97 Q -7,-101 -1,-105" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M -25.8,-58.1 Q -29,-46 -27,-34" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="-27" cy="-34" r="4" fill="#1f2937"/>
    <path d="M 25.8,-58.1 Q 34,-60 40,-70" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="40" cy="-70" r="4" fill="#1f2937"/>
    <circle cx="-18" cy="-54" r="3" fill="#e11d2a" opacity="0.3"/>
    <circle cx="18" cy="-54" r="3" fill="#e11d2a" opacity="0.3"/>
    <circle cx="-9" cy="-59" r="7" fill="#ffffff" fill-opacity="0.5" stroke="#1f2937" stroke-width="2"/>
    <circle cx="9" cy="-59" r="7" fill="#ffffff" fill-opacity="0.5" stroke="#1f2937" stroke-width="2"/>
    <line x1="-2" y1="-59" x2="2" y2="-59" stroke="#1f2937" stroke-width="2"/>
    <path d="M -12,-59 Q -9,-56 -6,-59" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 6,-59 Q 9,-56 12,-59" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
    <line x1="-14" y1="-66" x2="-5" y2="-63" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <line x1="5" y1="-63" x2="14" y2="-66" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <path d="M -6,-49 Q 0,-45 6,-49" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
