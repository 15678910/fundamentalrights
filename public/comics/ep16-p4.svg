<svg viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="네모가 문을 두드리고 동그라미가 웃으며 들어오라고 반기는 장면">
  <title>네모가 문을 두드리고 동그라미가 웃으며 들어오라고 반기는 장면</title>
  <rect width="320" height="260" fill="#ffffff"/>
  <rect y="200" width="320" height="60" fill="#eef2f7"/>

  <!-- 반짝임 -->
  <path d="M 285,30 L 288,38 L 296,41 L 288,44 L 285,52 L 282,44 L 274,41 L 282,38 Z" fill="#e11d2a" opacity="0.5"/>

  <!-- 문 (닫힘) -->
  <rect x="150" y="70" width="46" height="130" rx="2" fill="#f8fafc" stroke="#1f2937" stroke-width="2"/>
  <circle cx="184" cy="135" r="2.6" fill="#1f2937"/>

  <!-- 효과: 똑똑 -->
  <text x="185" y="118" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="17" font-weight="bold" fill="#e11d2a">똑똑</text>

  <!-- 동그라미 (반갑게 맞이함) -->
