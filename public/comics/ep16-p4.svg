    <line x1="-13" y1="-62" x2="-5" y2="-60" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <line x1="5" y1="-60" x2="13" y2="-62" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <path d="M -6,-46 Q 0,-42 6,-46" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
