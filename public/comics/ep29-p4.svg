<svg viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="수리가 끝난 그네를 셋이 안전하게 타며 웃는 장면">
  <title>수리가 끝난 그네를 셋이 안전하게 타며 웃는 장면</title>
  <rect width="320" height="260" fill="#ffffff"/>
  <rect y="200" width="320" height="60" fill="#eef2f7"/>

  <!-- 패널 번호 -->
  <circle cx="22" cy="22" r="13" fill="#e11d2a"/>
  <text x="22" y="27" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">4</text>

  <!-- 수리 완료 표지판 -->
  <line x1="46" y1="200" x2="46" y2="158" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
  <rect x="22" y="132" width="48" height="26" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="46" y="149" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="12" font-weight="bold" fill="#e11d2a">수리 끝!</text>

  <!-- 그네 (수리됨) -->
  <line x1="160" y1="204" x2="190" y2="38" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/>
  <line x1="220" y1="204" x2="190" y2="38" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/>
  <line x1="168" y1="188" x2="212" y2="188" stroke="#1f2937" stroke-width="2"/>
  <line x1="182" y1="45" x2="178" y2="126" stroke="#1f2937" stroke-width="2"/>
  <line x1="198" y1="45" x2="202" y2="122" stroke="#1f2937" stroke-width="2"/>

  <!-- 움직임 표시 -->
  <path d="M 128,110 Q 102,80 122,42" stroke="#94a3b8" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="4 6"/>

  <!-- 동그라미 (신나게 그네 타는 중) -->
  <g transform="translate(190,124)">
    <line x1="-6" y1="4" x2="-16" y2="34" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="6" y1="4" x2="20" y2="30" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-17" cy="36" rx="6" ry="3" fill="#1f2937"/>
    <ellipse cx="21" cy="32" rx="6" ry="3" fill="#1f2937"/>
    <circle cx="0" cy="-45" r="26" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
    <path d="M -3,-71 Q 4,-82 -2,-87 Q -7,-91 -1,-95" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M -24,-48 Q -22,-68 -12,-78" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="-12" cy="-78" r="4" fill="#1f2937"/>
    <path d="M 24,-48 Q 22,-64 12,-72" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="12" cy="-72" r="4" fill="#1f2937"/>
    <circle cx="-17" cy="-44" r="3" fill="#e11d2a" opacity="0.3"/>
    <circle cx="17" cy="-44" r="3" fill="#e11d2a" opacity="0.3"/>
    <circle cx="-8" cy="-49" r="2.5" fill="#1f2937"/>
    <circle cx="8" cy="-49" r="2.5" fill="#1f2937"/>
    <g fill="none" stroke="#1f2937" stroke-width="2"><circle cx="-8" cy="-49" r="7"/><circle cx="8" cy="-49" r="7"/><path d="M -1,-49 h2"/></g>
    <line x1="-12" y1="-56" x2="-5" y2="-54" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <line x1="5" y1="-54" x2="12" y2="-56" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <path d="M -6,-40 Q -1,-37 5,-41" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 네모 (지켜보며 웃음) -->
  <g transform="translate(275,206)">
    <ellipse cx="0" cy="2" rx="26" ry="5" fill="#1f2937" opacity="0.08"/>
    <line x1="-10" y1="-30" x2="-13" y2="-3" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="-30" x2="14" y2="-3" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <rect x="-19" y="-6" width="10" height="6" rx="2" fill="#e11d2a"/>
    <rect x="9" y="-6" width="10" height="6" rx="2" fill="#e11d2a"/>
    <rect x="-28" y="-85" width="56" height="56" rx="10" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/>
    <path d="M -19,-85 q6 -12 12 -4 q6 -12 12 -4 q6 -10 12 -2" fill="none" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <path d="M -26,-58 Q -34,-46 -30,-34" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <rect x="-36" y="-38" width="8" height="8" rx="3" fill="#e11d2a"/>
    <path d="M 26,-58 Q 34,-46 30,-34" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <rect x="28" y="-38" width="8" height="8" rx="3" fill="#e11d2a"/>
    <circle cx="-10" cy="-62" r="3.2" fill="#1f2937"/>
    <circle cx="10" cy="-62" r="3.2" fill="#1f2937"/>
    <g fill="none" stroke="#1f2937" stroke-width="2"><circle cx="-10" cy="-62" r="7"/><circle cx="10" cy="-62" r="7"/><path d="M -3,-62 h6"/></g>
    <line x1="-15" y1="-72" x2="-6" y2="-69" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="-69" x2="15" y2="-72" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <path d="M -7,-49 Q 0,-45 7,-49" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 캡션 -->
  <text x="160" y="250" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="12" fill="#64748b">제29조 국가배상청구권</text>
</svg>
