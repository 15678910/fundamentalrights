<svg viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="네모가 무슨 일이냐고 묻고 동그라미가 나쁜 일을 겪었다고 답하는 장면">
  <title>네모가 무슨 일이냐고 묻고 동그라미가 나쁜 일을 겪었다고 답하는 장면</title>
  <rect width="320" height="260" fill="#ffffff"/>
  <rect y="200" width="320" height="60" fill="#eef2f7"/>

  <!-- 동그라미 (풀 죽음) -->
  <g transform="translate(95,206)">
    <ellipse cx="0" cy="2" rx="24" ry="5" fill="#1f2937" opacity="0.08"/>
    <line x1="-10" y1="-32" x2="-11" y2="-3" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="-32" x2="11" y2="-3" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-11" cy="-2" rx="6" ry="3" fill="#1f2937"/>
    <ellipse cx="11" cy="-2" rx="6" ry="3" fill="#1f2937"/>
    <circle cx="0" cy="-57" r="28" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
    <path d="M -3,-85 Q 4,-96 -2,-101 Q -7,-105 -1,-109" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M -27.98,-58.08 Q -28,-46 -24,-36" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="-24" cy="-36" r="4" fill="#1f2937"/>
    <path d="M 27.98,-58.08 Q 28,-46 24,-36" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="24" cy="-36" r="4" fill="#1f2937"/>
    <circle cx="-9" cy="-59" r="2.3" fill="#1f2937"/>
    <circle cx="9" cy="-59" r="2.3" fill="#1f2937"/>
    <g fill="none" stroke="#1f2937" stroke-width="2"><circle cx="-9" cy="-59" r="7"/><circle cx="9" cy="-59" r="7"/><path d="M -2,-59 h4"/></g>
    <line x1="-14" y1="-65" x2="-6" y2="-68" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="-68" x2="14" y2="-65" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <path d="M -6,-48 Q 0,-52 6,-48" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

