    <line x1="-10" y1="-30" x2="-13" y2="-3" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="-30" x2="14" y2="-3" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <rect x="-19" y="-6" width="10" height="6" rx="2" fill="#e11d2a"/>
    <rect x="9" y="-6" width="10" height="6" rx="2" fill="#e11d2a"/>
    <g transform="rotate(-6 0 -50)">
      <rect x="-28" y="-85" width="56" height="56" rx="10" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/>
      <path d="M -19,-85 q6 -12 12 -4 q6 -12 12 -4 q6 -10 12 -2" fill="none" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
      <circle cx="-10" cy="-62" r="3.2" fill="#1f2937"/>
      <circle cx="10" cy="-62" r="3.2" fill="#1f2937"/>
      <g fill="none" stroke="#1f2937" stroke-width="2"><circle cx="-10" cy="-62" r="7"/><circle cx="10" cy="-62" r="7"/><path d="M -3,-62 h6"/></g>
      <path d="M -15,-70 Q -10,-73 -5,-70" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
      <path d="M 5,-70 Q 10,-73 15,-70" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
      <ellipse cx="0" cy="-49" rx="3" ry="4" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    </g>
    <path d="M -29.59,-63.62 Q -34,-52 -30,-40" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 27.09,-60.11 Q 20,-48 12,-44" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 말풍선: 동그라미 -->
  <rect x="8" y="16" width="160" height="42" rx="14" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <polygon points="85,58 105,58 97,90" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <rect x="86" y="56" width="18" height="4" fill="#ffffff"/>
  <text x="88" y="38" text-anchor="middle" dominant-baseline="middle" font-family="'Pretendard', sans-serif" font-size="15" fill="#1f2937">나쁜 일을 겪었어…</text>

  <!-- 말풍선: 네모 -->
  <rect x="182" y="10" width="130" height="42" rx="14" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <polygon points="220,52 240,52 232,84" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <rect x="221" y="50" width="18" height="4" fill="#ffffff"/>
  <text x="247" y="32" text-anchor="middle" dominant-baseline="middle" font-family="'Pretendard', sans-serif" font-size="15" fill="#1f2937">무슨 일 있었어?</text>
