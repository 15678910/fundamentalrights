  <path d="M 25,8 H 175 A14,14 0 0 1 189,22 V 56 A14,14 0 0 1 175,70 H 78 L 65,96 L 54,70 H 25 A14,14 0 0 1 11,56 V 22 A14,14 0 0 1 25,8 Z" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="100" y="39" text-anchor="middle" dominant-baseline="middle" font-family="'Pretendard', sans-serif" font-size="15" fill="#1f2937">
