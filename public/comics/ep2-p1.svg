<svg viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="네모가 동그라미의 생김새를 놀리고 동그라미의 표정이 굳는 장면">
  <title>네모가 동그라미의 생김새를 놀리고 동그라미의 표정이 굳는 장면</title>
  <rect width="320" height="260" fill="#ffffff"/>
  <rect y="200" width="320" height="60" fill="#eef2f7"/>

  <!-- 네모 (놀리는 중) -->
  <g>
    <rect x="50" y="120" width="70" height="70" rx="10" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/>
    <path d="M 60,120 q8 -16 16 -5 q8 -16 16 -5 q8 -13 16 -3" fill="none" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <g fill="none" stroke="#1f2937" stroke-width="2"><circle cx="72" cy="148" r="7"/><circle cx="98" cy="148" r="7"/><path d="M 79,148 h12"/></g>
    <circle cx="72" cy="148" r="3" fill="#1f2937"/>
    <circle cx="98" cy="148" r="3" fill="#1f2937"/>
    <line x1="64" y1="136" x2="78" y2="132" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="92" y1="130" x2="106" y2="136" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <path d="M70,160 Q85,172 104,158" stroke="#1f2937" stroke-width="3" fill="none" stroke-linecap="round"/>
    <line x1="50" y1="155" x2="28" y2="172" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <line x1="120" y1="150" x2="168" y2="142" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <line x1="68" y1="190" x2="68" y2="208" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <line x1="102" y1="190" x2="102" y2="208" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="68" cy="211" rx="9" ry="5" fill="#e11d2a"/>
    <ellipse cx="102" cy="211" rx="9" ry="5" fill="#e11d2a"/>
  </g>

  <!-- 동그라미 (표정 굳음) -->
  <g>
    <circle cx="255" cy="165" r="35" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
    <path d="M248,131 Q236,112 252,104 Q266,99 260,114" fill="none" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <circle cx="241" cy="160" r="5" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <circle cx="241" cy="161" r="1.6" fill="#1f2937"/>
    <circle cx="269" cy="160" r="5" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <circle cx="269" cy="161" r="1.6" fill="#1f2937"/>
    <path d="M 246,160 h18" fill="none" stroke="#1f2937" stroke-width="2"/>
    <line x1="230" y1="144" x2="246" y2="140" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="264" y1="140" x2="280" y2="144" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="255" cy="180" rx="4" ry="6" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <line x1="220" y1="165" x2="198" y2="182" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="290" y1="165" x2="312" y2="182" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <circle cx="198" cy="182" r="4" fill="#1f2937"/>
    <circle cx="312" cy="182" r="4" fill="#1f2937"/>
    <line x1="240" y1="200" x2="240" y2="216" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="270" y1="200" x2="270" y2="216" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="240" cy="219" rx="8" ry="4" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <ellipse cx="270" cy="219" rx="8" ry="4" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  </g>

  <!-- 말풍선 -->
  <polygon points="75,72 105,72 85,118" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <rect x="12" y="18" width="216" height="54" rx="14" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="120" y="52" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="16" fill="#1f2937">넌 굴러다녀서 이상해!</text>
</svg>
