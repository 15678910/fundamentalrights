<svg viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="네모가 동그라미에게 깃발을 내밀며 너도 최고라고 말하라고 강요하고 동그라미가 곤란해하는 장면">
  <title>네모가 동그라미에게 깃발을 내밀며 너도 최고라고 말하라고 강요하고 동그라미가 곤란해하는 장면</title>
  <rect width="320" height="260" fill="#ffffff"/>
  <rect y="200" width="320" height="60" fill="#eef2f7"/>

  <!-- 네모 (다가서며 강요) -->
  <g transform="translate(95,206)">
    <ellipse cx="0" cy="2" rx="26" ry="5" fill="#1f2937" opacity="0.08"/>
    <line x1="-10" y1="-30" x2="-13" y2="-3" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="-30" x2="14" y2="-3" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <rect x="-19" y="-6" width="10" height="6" rx="2" fill="#e11d2a"/>
    <rect x="9" y="-6" width="10" height="6" rx="2" fill="#e11d2a"/>
    <rect x="-28" y="-85" width="56" height="56" rx="10" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/>
    <path d="M -19,-85 q6 -12 12 -4 q6 -12 12 -4 q6 -10 12 -2" fill="none" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <!-- 왼팔 허리 -->
    <path d="M -28,-65 Q -34,-53 -30,-42" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- 오른팔 쭉 내밀며 깃발 -->
    <path d="M 28,-65 Q 57,-62 90,-58" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <rect x="88" y="-63" width="9" height="8" rx="3" fill="#e11d2a"/>
    <line x1="97" y1="-59" x2="97" y2="-95" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <polygon points="97,-95 126,-84 97,-73" fill="#e11d2a" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="-10" cy="-62" r="3.2" fill="#1f2937"/>
    <circle cx="10" cy="-62" r="3.2" fill="#1f2937"/>
    <g fill="none" stroke="#1f2937" stroke-width="2"><circle cx="-10" cy="-62" r="7"/><circle cx="10" cy="-62" r="7"/><path d="M -3,-62 h6"/></g>
    <line x1="-16" y1="-71" x2="-6" y2="-69" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="-69" x2="16" y2="-71" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <line x1="-7" y1="-49" x2="7" y2="-49" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- 동그라미 (곤란, 뒤로 살짝) -->
  <g transform="translate(240,209) rotate(6)">
    <ellipse cx="0" cy="-1" rx="24" ry="5" fill="#1f2937" opacity="0.08"/>
    <line x1="-10" y1="-32" x2="-11" y2="-3" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="-32" x2="11" y2="-3" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-11" cy="-2" rx="6" ry="3" fill="#1f2937"/>
    <ellipse cx="11" cy="-2" rx="6" ry="3" fill="#1f2937"/>
    <circle cx="0" cy="-57" r="28" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
    <path d="M -3,-85 Q 4,-96 -2,-101 Q -7,-105 -1,-109" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M -25,-56 Q -34,-50 -32,-40" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 25,-56 Q 34,-50 32,-40" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="-32" cy="-40" r="4" fill="#1f2937"/>
    <circle cx="32" cy="-40" r="4" fill="#1f2937"/>
    <circle cx="-9" cy="-61" r="2.5" fill="#1f2937"/>
    <circle cx="9" cy="-61" r="2.5" fill="#1f2937"/>
    <g fill="none" stroke="#1f2937" stroke-width="2"><circle cx="-9" cy="-61" r="7"/><circle cx="9" cy="-61" r="7"/><path d="M -2,-61 h4"/></g>
    <path d="M -14,-70 Q -9,-73 -4,-70" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 4,-70 Q 9,-73 14,-70" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M -6,-51 Q 0,-54 6,-51" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 말풍선: 네모 (2줄) -->
  <path d="M 18,8 H 150 A13,13 0 0 1 163,21 V 63 A13,13 0 0 1 150,76 H 100 L 91,105 L 82,76 H 18 A13,13 0 0 1 5,63 V 21 A13,13 0 0 1 18,8 Z" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="84" y="42" text-anchor="middle" dominant-baseline="middle" font-family="'Pretendard', sans-serif" font-size="15" fill="#1f2937">
    <tspan x="84" dy="-11">너도 최고라고</tspan>
    <tspan x="84" dy="22">말해! 어서!</tspan>
  </text>
</svg>
