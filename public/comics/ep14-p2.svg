    <path d="M -26,-65 Q -50,-58 -78,-48" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="-80" cy="-46" r="5" fill="#e11d2a"/>
    <path d="M 26,-65 Q 32,-55 22,-50" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <rect x="18" y="-53" width="8" height="8" rx="3" fill="#e11d2a"/>
    <g fill="none" stroke="#1f2937" stroke-width="2"><circle cx="-10" cy="-62" r="7"/><circle cx="10" cy="-62" r="7"/><path d="M -3,-62 h6"/></g>
    <circle cx="-10" cy="-62" r="3.2" fill="#1f2937"/>
    <circle cx="10" cy="-62" r="3.2" fill="#1f2937"/>
    <path d="M -15,-70 Q -10,-73 -5,-70" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 5,-70 Q 10,-73 15,-70" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M -6,-46 Q 0,-50 6,-46" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- 눈물 -->
    <path d="M 15,-58 C 12,-52 12,-47 15,-46 C 18,-47 18,-52 15,-58 Z" fill="#60a5fa"/>
  </g>

  <!-- 말풍선: 네모 (2줄) -->
  <path d="M 152,8 H 300 A14,14 0 0 1 314,22 V 56 A14,14 0 0 1 300,70 H 229 L 220,104 L 211,70 H 152 A14,14 0 0 1 138,56 V 22 A14,14 0 0 1 152,8 Z" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="226" y="39" text-anchor="middle" dominant-baseline="middle" font-family="'Pretendard', sans-serif" font-size="15" fill="#1f2937">
    <tspan x="226" dy="-11">이사 금지야!</tspan>
    <tspan x="226" dy="22">못 가!</tspan>
  </text>
</svg>
