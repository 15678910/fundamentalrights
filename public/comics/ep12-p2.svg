<svg viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="네모가 동그라미의 팔을 붙잡고 범인이라 몰아세우며 의자에 앉히는 장면">
  <title>네모가 동그라미의 팔을 붙잡고 범인이라 몰아세우며 의자에 앉히는 장면</title>
  <rect width="320" height="260" fill="#ffffff"/>
  <rect y="200" width="320" height="60" fill="#eef2f7"/>

  <!-- 의자 -->
  <g transform="translate(90,206)">
    <rect x="-24" y="-56" width="6" height="52" fill="#d8c39a" stroke="#1f2937" stroke-width="2"/>
    <rect x="-24" y="-8" width="50" height="8" rx="2" fill="#d8c39a" stroke="#1f2937" stroke-width="2"/>
    <line x1="-20" y1="0" x2="-20" y2="20" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="22" y1="0" x2="22" y2="20" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 동그라미 (놀라서 붙잡힘) -->
  <g transform="translate(90,206)">
    <ellipse cx="0" cy="2" rx="20" ry="5" fill="#1f2937" opacity="0.08"/>
    <line x1="-9" y1="-28" x2="-10" y2="-3" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="9" y1="-28" x2="10" y2="-3" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-10" cy="-2" rx="5" ry="2.8" fill="#1f2937"/>
    <ellipse cx="10" cy="-2" rx="5" ry="2.8" fill="#1f2937"/>
    <path d="M -23.90,-52.17 Q -30,-64 -26,-78" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/><circle cx="-26" cy="-78" r="4" fill="#1f2937"/>
    <path d="M 23.90,-52.17 Q 34,-50 44,-46" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/><circle cx="44" cy="-46" r="4" fill="#1f2937"/>
    <circle cx="0" cy="-50" r="24" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
    <path d="M -3,-74 Q 3,-84 -2,-89 Q -6,-92 -1,-96" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <g fill="none" stroke="#1f2937" stroke-width="2"><circle cx="-8" cy="-54" r="7"/><circle cx="8" cy="-54" r="7"/><path d="M -1,-54 h2"/></g>
    <circle cx="-8" cy="-54" r="2.4" fill="#1f2937"/>
    <circle cx="8" cy="-54" r="2.4" fill="#1f2937"/>
    <line x1="-13" y1="-63" x2="-5" y2="-59" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <line x1="5" y1="-59" x2="13" y2="-63" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="0" cy="-42" rx="4" ry="5" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  </g>

  <!-- 붙잡힌 손 -->
  <rect x="126" y="152" width="13" height="11" rx="3" fill="#e11d2a"/>

  <!-- 네모 (팔을 붙잡고 몰아세움) -->
  <g transform="translate(195,206)">
    <ellipse cx="0" cy="2" rx="26" ry="5" fill="#1f2937" opacity="0.08"/>
    <line x1="-10" y1="-30" x2="-11" y2="-3" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="-30" x2="11" y2="-3" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <rect x="-16" y="-6" width="10" height="6" rx="2" fill="#e11d2a"/>
    <rect x="6" y="-6" width="10" height="6" rx="2" fill="#e11d2a"/>
    <path d="M -28,-65 Q -50,-58 -66,-50" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 28,-65 Q 36,-58 42,-46" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <rect x="-28" y="-85" width="56" height="56" rx="10" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/>
    <path d="M -20,-85 q6 -12 12 -4 q6 -12 12 -4 q6 -10 12 -2" fill="none" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <g fill="none" stroke="#1f2937" stroke-width="2"><circle cx="-9" cy="-63" r="7"/><circle cx="9" cy="-63" r="7"/><path d="M -2,-63 h4"/></g>
    <line x1="-13" y1="-62" x2="-6" y2="-64" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="6" y1="-64" x2="13" y2="-62" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="-15" y1="-70" x2="-6" y2="-68" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="-68" x2="15" y2="-70" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="0" cy="-48" rx="8" ry="7" fill="#1f2937"/>
  </g>

  <!-- 말풍선: 네모 (2줄) -->
  <path d="M 152,8 H 288 A14,14 0 0 1 302,22 V 56 A14,14 0 0 1 288,70 H 229 L 220,104 L 211,70 H 152 A14,14 0 0 1 138,56 V 22 A14,14 0 0 1 152,8 Z" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="220" y="39" text-anchor="middle" dominant-baseline="middle" font-family="'Pretendard', sans-serif" font-size="15" fill="#1f2937">
    <tspan x="220" dy="-11">네가 범인!</tspan>
    <tspan x="220" dy="22">꼼짝 마!</tspan>
  </text>
</svg>
