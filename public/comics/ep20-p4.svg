<svg viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="네모가 구경만 해도 좋다고 말하고 동그라미가 편안하게 별님 클럽을 구경하는 장면">
  <title>네모가 구경만 해도 좋다고 말하고 동그라미가 편안하게 별님 클럽을 구경하는 장면</title>
  <rect width="320" height="260" fill="#ffffff"/>
  <rect y="200" width="320" height="60" fill="#eef2f7"/>

  <!-- 패널 번호 -->
  <circle cx="22" cy="22" r="13" fill="#e11d2a"/>
  <text x="22" y="27" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">4</text>

  <!-- 반짝임 -->
  <path d="M 285,34 L 288,42 L 296,45 L 288,48 L 285,56 L 282,48 L 274,45 L 282,42 Z" fill="#fbbf24" stroke="#1f2937" stroke-width="1" opacity="0.9"/>

  <!-- 동그라미 (편안히 구경, 앉은 자세) -->
  <g transform="translate(90,206)">
    <ellipse cx="0" cy="2" rx="24" ry="5" fill="#1f2937" opacity="0.08"/>
    <path d="M -14,-4 Q -20,-10 -18,-2" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 14,-4 Q 20,-10 18,-2" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <ellipse cx="-15" cy="-2" rx="6" ry="3" fill="#1f2937"/>
    <ellipse cx="15" cy="-2" rx="6" ry="3" fill="#1f2937"/>
    <circle cx="0" cy="-40" r="28" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
    <path d="M -3,-68 Q 4,-79 -2,-84 Q -7,-88 -1,-92" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M -26,-42 Q -32,-32 -28,-22" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 26,-42 Q 32,-32 28,-22" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="-28" cy="-22" r="4" fill="#1f2937"/>
    <circle cx="28" cy="-22" r="4" fill="#1f2937"/>
    <circle cx="-19" cy="-39" r="3" fill="#e11d2a" opacity="0.3"/>
    <circle cx="19" cy="-39" r="3" fill="#e11d2a" opacity="0.3"/>
    <circle cx="-9" cy="-44" r="2.5" fill="#1f2937"/>
    <circle cx="9" cy="-44" r="2.5" fill="#1f2937"/>
    <g fill="none" stroke="#1f2937" stroke-width="2"><circle cx="-9" cy="-44" r="7"/><circle cx="9" cy="-44" r="7"/><path d="M -2,-44 h4"/></g>
    <line x1="-13" y1="-51" x2="-6" y2="-49" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="-49" x2="13" y2="-51" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <path d="M -7,-35 Q 0,-30 7,-35" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 네모 (반짝이 모자, 웃음) -->
  <g transform="translate(220,206)">
    <ellipse cx="0" cy="2" rx="26" ry="5" fill="#1f2937" opacity="0.08"/>
    <line x1="-10" y1="-30" x2="-13" y2="-3" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="-30" x2="14" y2="-3" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <rect x="-19" y="-6" width="10" height="6" rx="2" fill="#e11d2a"/>
    <rect x="9" y="-6" width="10" height="6" rx="2" fill="#e11d2a"/>
    <rect x="-28" y="-85" width="56" height="56" rx="10" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/>
    <polygon points="0,-146 -20,-95 20,-95" fill="#fbbf24" stroke="#1f2937" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="0" cy="-146" r="4" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
    <path d="M -19,-85 q6 -12 12 -4 q6 -12 12 -4 q6 -10 12 -2" fill="none" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <path d="M -26,-65 Q -33,-52 -26,-42" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 26,-65 Q 33,-52 26,-42" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="-10" cy="-62" r="3.2" fill="#1f2937"/>
    <circle cx="10" cy="-62" r="3.2" fill="#1f2937"/>
    <g fill="none" stroke="#1f2937" stroke-width="2"><circle cx="-10" cy="-62" r="7"/><circle cx="10" cy="-62" r="7"/><path d="M -3,-62 h6"/></g>
    <line x1="-15" y1="-72" x2="-6" y2="-70" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="-70" x2="15" y2="-72" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <path d="M -7,-48 Q 0,-43 7,-48" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 말풍선: 네모 -->
  <path d="M 128,10 H 300 A13,13 0 0 1 313,23 V 47 A13,13 0 0 1 300,60 H 234 L 225,100 L 216,60 H 128 A13,13 0 0 1 115,47 V 23 A13,13 0 0 1 128,10 Z" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="214" y="34" text-anchor="middle" dominant-baseline="middle" font-family="'Pretendard', sans-serif" font-size="15" fill="#1f2937">구경만 해도 좋아.</text>

  <!-- 캡션 -->
  <text x="160" y="250" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="12" fill="#64748b">제20조 종교의 자유</text>
</svg>
