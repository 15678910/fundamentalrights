    <circle cx="11" cy="-75" r="7" fill="#ffffff" fill-opacity="0.5" stroke="#1f2937" stroke-width="2"/>
    <line x1="-4" y1="-75" x2="4" y2="-75" stroke="#1f2937" stroke-width="2"/>
    <circle cx="-11" cy="-75" r="1.6" fill="#1f2937"/>
    <circle cx="11" cy="-75" r="1.6" fill="#1f2937"/>
    <circle cx="-20" cy="-63" r="3" fill="#e11d2a" opacity="0.3"/>
    <circle cx="20" cy="-63" r="3" fill="#e11d2a" opacity="0.3"/>
    <path d="M -8,-59 Q 0,-53 8,-59" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
