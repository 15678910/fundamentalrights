<svg viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="세모가 범죄 피해를 입으면 나라가 도와준다고 헌법 제30조를 설명하는 장면">
  <title>세모가 범죄 피해를 입으면 나라가 도와준다고 헌법 제30조를 설명하는 장면</title>
  <rect width="320" height="260" fill="#ffffff"/>
