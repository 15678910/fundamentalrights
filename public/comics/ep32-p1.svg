<svg viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="네모가 전단지 아르바이트를 시작했다며 동그라미에게 자랑하는 장면">
  <title>네모가 전단지 아르바이트를 시작했다며 동그라미에게 자랑하는 장면</title>
  <rect width="320" height="260" fill="#ffffff"/>
  <rect y="200" width="320" height="60" fill="#eef2f7"/>

  <!-- 전봇대 + 전단지 -->
  <line x1="20" y1="10" x2="20" y2="200" stroke="#94a3b8" stroke-width="4"/>
  <rect x="9" y="22" width="22" height="28" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="12" y1="30" x2="28" y2="30" stroke="#94a3b8" stroke-width="1"/>
  <line x1="12" y1="36" x2="28" y2="36" stroke="#94a3b8" stroke-width="1"/>

  <!-- 패널 번호 -->
  <circle cx="298" cy="22" r="13" fill="#e11d2a"/>
  <text x="298" y="27" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">1</text>

  <!-- 동그라미 (놀람/감탄) -->
  <g transform="translate(100,206)">
    <ellipse cx="0" cy="2" rx="24" ry="5" fill="#1f2937" opacity="0.08"/>
    <line x1="-10" y1="-32" x2="-11" y2="-3" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="-32" x2="11" y2="-3" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-11" cy="-2" rx="6" ry="3" fill="#1f2937"/>
    <ellipse cx="11" cy="-2" rx="6" ry="3" fill="#1f2937"/>
    <circle cx="0" cy="-57" r="28" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
    <path d="M -3,-85 Q 4,-96 -2,-101 Q -7,-105 -1,-109" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M -26,-58 Q -32,-50 -28,-40" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 26,-58 Q 32,-50 28,-40" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="-28" cy="-40" r="4" fill="#1f2937"/>
    <circle cx="28" cy="-40" r="4" fill="#1f2937"/>
    <circle cx="-19" cy="-56" r="3" fill="#e11d2a" opacity="0.3"/>
    <circle cx="19" cy="-56" r="3" fill="#e11d2a" opacity="0.3"/>
    <g fill="none" stroke="#1f2937" stroke-width="2"><circle cx="-9" cy="-61" r="7"/><circle cx="9" cy="-61" r="7"/><path d="M -2,-61 h4"/></g>
    <circle cx="-9" cy="-61" r="3.2" fill="#1f2937"/>
    <circle cx="9" cy="-61" r="3.2" fill="#1f2937"/>
    <line x1="-14" y1="-68" x2="-5" y2="-68" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <line x1="5" y1="-68" x2="14" y2="-68" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="0" cy="-51" rx="4" ry="5" fill="#1f2937"/>
  </g>

  <!-- 네모 (전단지 들고 자랑) -->
  <g transform="translate(220,206)">
    <ellipse cx="0" cy="2" rx="26" ry="5" fill="#1f2937" opacity="0.08"/>
    <line x1="-10" y1="-30" x2="-13" y2="-3" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="-30" x2="14" y2="-3" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <rect x="-19" y="-6" width="10" height="6" rx="2" fill="#e11d2a"/>
    <rect x="9" y="-6" width="10" height="6" rx="2" fill="#e11d2a"/>
    <rect x="-28" y="-85" width="56" height="56" rx="10" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/>
    <path d="M -20,-85 q6 -12 12 -4 q6 -12 12 -4 q6 -10 12 -2" fill="none" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <path d="M -26,-65 Q -34,-55 -30,-42" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <rect x="-34" y="-46" width="8" height="8" rx="3" fill="#e11d2a"/>
    <path d="M 26,-65 Q 40,-72 46,-88" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <rect x="42" y="-94" width="8" height="8" rx="3" fill="#e11d2a"/>
    <g fill="none" stroke="#1f2937" stroke-width="2"><circle cx="-9.5" cy="-63" r="7"/><circle cx="9.5" cy="-63" r="7"/><path d="M -2,-63 h4"/></g>
    <line x1="-13" y1="-62" x2="-6" y2="-64" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="6" y1="-64" x2="13" y2="-62" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="-15" y1="-72" x2="-6" y2="-70" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="-70" x2="15" y2="-72" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <path d="M -7,-49 Q 0,-43 7,-49" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- 전단지 뭉치 -->
    <g transform="rotate(10 50 -85)">
      <rect x="36" y="-102" width="28" height="34" rx="2" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/>
      <rect x="40" y="-98" width="28" height="34" rx="2" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
      <text x="54" y="-82" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="9" font-weight="bold" fill="#e11d2a">전단지</text>
      <line x1="44" y1="-72" x2="64" y2="-73" stroke="#94a3b8" stroke-width="1"/>
      <line x1="44" y1="-67" x2="60" y2="-68" stroke="#94a3b8" stroke-width="1"/>
    </g>
  </g>

  <!-- 말풍선: 네모 -->
  <path d="M 142,12 H 298 A12,12 0 0 1 310,24 V 46 A12,12 0 0 1 298,58 H 229 L 220,100 L 211,58 H 142 A12,12 0 0 1 130,46 V 24 A12,12 0 0 1 142,12 Z" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="220" y="35" text-anchor="middle" dominant-baseline="middle" font-family="'Pretendard', sans-serif" font-size="16" fill="#1f2937">나 전단지 알바해!</text>
</svg>
