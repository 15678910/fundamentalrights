    <line x1="-9" y1="-28" x2="-10" y2="-3" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <line x1="9" y1="-28" x2="10" y2="-3" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <rect x="-15" y="-6" width="9" height="6" rx="2" fill="#e11d2a"/>
    <rect x="6" y="-6" width="9" height="6" rx="2" fill="#e11d2a"/>
    <rect x="-25" y="-78" width="50" height="50" rx="9" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/>
    <polyline points="-21,-78 -15,-89 -8,-78 0,-90 8,-78 15,-89 21,-78" fill="none" stroke="#e11d2a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M -23,-56 Q -34,-64 -50,-58" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 23,-58 Q 30,-68 26,-84" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- 목도리 -->
    <path d="M -18,-33 Q 0,-21 18,-33 Q 18,-24 0,-15 Q -18,-24 -18,-33 Z" fill="#e11d2a" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/>
    <rect x="-8" y="-18" width="7" height="15" rx="2" fill="#e11d2a" stroke="#1f2937" stroke-width="2" transform="rotate(8 -4 -10)"/>
    <circle cx="-9" cy="-56" r="2.8" fill="#1f2937"/>
    <circle cx="9" cy="-56" r="2.8" fill="#1f2937"/>
    <line x1="-13" y1="-63" x2="-5" y2="-64" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <line x1="5" y1="-64" x2="13" y2="-63" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <path d="M -6,-44 Q 0,-39 6,-44" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 말풍선: 네모 -->
  <rect x="130" y="8" width="180" height="44" rx="14" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <polygon points="250,52 268,52 260,76" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="220" y="31" text-anchor="middle" dominant-baseline="middle" font-family="'Pretendard', sans-serif" font-size="15" fill="#1f2937">복지센터에 알려요!</text>

  <!-- 캡션 -->
  <text x="160" y="250" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="12" fill="#64748b">제34조 인간다운 생활을 할 권리</text>
</svg>
