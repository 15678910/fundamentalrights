<svg viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="셋이 복지센터에 할머니 소식을 전하고 뿌듯해하는 장면">
  <title>셋이 복지센터에 할머니 소식을 전하고 뿌듯해하는 장면</title>
  <rect width="320" height="260" fill="#ffffff"/>
  <rect y="200" width="320" height="60" fill="#eef2f7"/>

  <!-- 복지센터 픽토그램 (집 + 하트) -->
  <g>
    <rect x="14" y="30" width="70" height="36" fill="#fdecea" stroke="#1f2937" stroke-width="2"/>
    <polygon points="10,32 49,10 88,32" fill="#fdecea" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/>
    <rect x="42" y="46" width="14" height="20" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <path d="M49,36 C49,31 42,29 42,36 C42,41 49,46 49,46 C49,46 56,41 56,36 C56,29 49,31 49,36 Z" fill="#e11d2a"/>
  </g>

  <!-- 반짝이 -->
  <g transform="translate(295,72)" stroke="#e11d2a" stroke-width="2" stroke-linecap="round">
    <line x1="0" y1="-7" x2="0" y2="7"/>
    <line x1="-7" y1="0" x2="7" y2="0"/>
    <line x1="-5" y1="-5" x2="5" y2="5"/>
    <line x1="-5" y1="5" x2="5" y2="-5"/>
