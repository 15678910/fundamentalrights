<svg viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="동그라미는 궁금해서 그랬다고 하고, 네모는 허락 없이 보면 안 된다고 화내는 장면">
  <title>동그라미는 궁금해서 그랬다고 하고, 네모는 허락 없이 보면 안 된다고 화내는 장면</title>
  <rect width="320" height="260" fill="#ffffff"/>
  <rect y="200" width="320" height="60" fill="#eef2f7"/>

  <!-- 패널 번호 -->
  <circle cx="22" cy="22" r="13" fill="#e11d2a"/>
  <text x="22" y="27" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">2</text>

  <!-- 동그라미 (머쓱) -->
  <g transform="translate(100,206)">
    <ellipse cx="0" cy="2" rx="24" ry="5" fill="#1f2937" opacity="0.08"/>
    <line x1="-10" y1="-32" x2="-11" y2="-3" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="-32" x2="11" y2="-3" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-11" cy="-2" rx="6" ry="3" fill="#1f2937"/>
    <ellipse cx="11" cy="-2" rx="6" ry="3" fill="#1f2937"/>
    <circle cx="0" cy="-57" r="28" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
    <path d="M -3,-85 Q 4,-96 -2,-101 Q -7,-105 -1,-109" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M -26,-60 Q -28,-48 -26,-38" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 26,-60 Q 30,-72 24,-82" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="-26" cy="-38" r="4" fill="#1f2937"/>
    <circle cx="24" cy="-82" r="4" fill="#1f2937"/>
    <path d="M 22,-84 C 19,-78 19,-73 22,-72 C 25,-73 25,-78 22,-84 Z" fill="#60a5fa"/>
    <circle cx="-19" cy="-56" r="3" fill="#e11d2a" opacity="0.3"/>
    <circle cx="19" cy="-56" r="3" fill="#e11d2a" opacity="0.3"/>
    <g fill="none" stroke="#1f2937" stroke-width="2"><circle cx="-9" cy="-61" r="7"/><circle cx="9" cy="-61" r="7"/><path d="M -2,-61 h4"/></g>
    <circle cx="-9" cy="-61" r="2.5" fill="#1f2937"/>
    <circle cx="9" cy="-61" r="2.5" fill="#1f2937"/>
    <line x1="-14" y1="-67" x2="-5" y2="-70" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <line x1="5" y1="-67" x2="14" y2="-64" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <path d="M -7,-51 Q -3,-48 0,-51 Q 3,-54 7,-51" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 네모 (화남, 허리에 손) -->
  <g transform="translate(220,206)">
    <ellipse cx="0" cy="2" rx="26" ry="5" fill="#1f2937" opacity="0.08"/>
    <line x1="-10" y1="-30" x2="-11" y2="-3" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="-30" x2="11" y2="-3" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <rect x="-16" y="-6" width="10" height="6" rx="2" fill="#e11d2a"/>
    <rect x="6" y="-6" width="10" height="6" rx="2" fill="#e11d2a"/>
    <rect x="-28" y="-85" width="56" height="56" rx="10" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/>
    <path d="M -20,-85 q6 -12 12 -4 q6 -12 12 -4 q6 -10 12 -2" fill="none" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <path d="M -26,-65 Q -30,-55 -20,-50" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <rect x="-26" y="-52" width="8" height="8" rx="3" fill="#e11d2a"/>
    <path d="M 26,-65 Q 30,-55 20,-50" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <rect x="18" y="-52" width="8" height="8" rx="3" fill="#e11d2a"/>
    <g fill="none" stroke="#1f2937" stroke-width="2"><circle cx="-10" cy="-62" r="7"/><circle cx="10" cy="-62" r="7"/><path d="M -3,-62 h6"/></g>
    <line x1="-13" y1="-62" x2="-7" y2="-62" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="7" y1="-62" x2="13" y2="-62" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="-15" y1="-70" x2="-6" y2="-64" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="-64" x2="15" y2="-70" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <line x1="-7" y1="-49" x2="7" y2="-49" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- 말풍선: 동그라미 -->
  <path d="M 22,14 H 128 A12,12 0 0 1 140,26 V 44 A12,12 0 0 1 128,56 H 115 L 100,96 L 95,56 H 22 A12,12 0 0 1 10,44 V 26 A12,12 0 0 1 22,14 Z" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="75" y="35" text-anchor="middle" dominant-baseline="middle" font-family="'Pretendard', sans-serif" font-size="14" fill="#1f2937">그냥 궁금해서…</text>

  <!-- 말풍선: 네모 (2줄) -->
  <path d="M 184,8 H 296 A14,14 0 0 1 310,22 V 56 A14,14 0 0 1 296,70 H 229 L 220,104 L 211,70 H 184 A14,14 0 0 1 170,56 V 22 A14,14 0 0 1 184,8 Z" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="240" y="39" text-anchor="middle" dominant-baseline="middle" font-family="'Pretendard', sans-serif" font-size="15" fill="#1f2937">
    <tspan x="240" dy="-11">허락 없이 보면</tspan>
    <tspan x="240" dy="22">안 되지!</tspan>
  </text>
</svg>
