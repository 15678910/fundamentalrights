  <!-- 말풍선: 네모 (2줄) -->
  <path d="M 152,8 H 300 A14,14 0 0 1 314,22 V 56 A14,14 0 0 1 300,70 H 229 L 220,104 L 211,70 H 152 A14,14 0 0 1 138,56 V 22 A14,14 0 0 1 152,8 Z" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="226" y="39" text-anchor="middle" dominant-baseline="middle" font-family="'Pretendard', sans-serif" font-size="15" fill="#1f2937">
    <tspan x="226" dy="-11">에이, 멋없어.</tspan>
    <tspan x="226" dy="22">의사 해!</tspan>
