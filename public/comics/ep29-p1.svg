    <line x1="6" y1="-69" x2="15" y2="-72" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <path d="M -7,-49 Q 0,-45 7,-49" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
