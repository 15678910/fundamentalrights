    <line x1="-14" y1="-30" x2="-22" y2="-2" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="-30" x2="22" y2="0" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-22" cy="-1" rx="6" ry="3" fill="#1f2937"/>
    <ellipse cx="23" cy="1" rx="6" ry="3" fill="#1f2937"/>
    <circle cx="0" cy="-57" r="28" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
    <path d="M -3,-85 Q 4,-96 -2,-101 Q -7,-105 -1,-109" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M -26,-58 Q -36,-62 -44,-56" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="-44" cy="-56" r="4" fill="#1f2937"/>
    <path d="M 26,-58 Q 34,-48 30,-38" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="30" cy="-38" r="4" fill="#1f2937"/>
    <circle cx="-19" cy="-56" r="3" fill="#e11d2a" opacity="0.3"/>
    <circle cx="19" cy="-56" r="3" fill="#e11d2a" opacity="0.3"/>
    <circle cx="-9" cy="-61" r="2.5" fill="#1f2937"/>
    <circle cx="9" cy="-61" r="2.5" fill="#1f2937"/>
    <g fill="none" stroke="#1f2937" stroke-width="2"><circle cx="-9" cy="-61" r="7"/><circle cx="9" cy="-61" r="7"/><path d="M -2,-61 h4"/></g>
    <line x1="-13" y1="-68" x2="-6" y2="-66" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
