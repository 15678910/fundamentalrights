  <!-- 말풍선: 동그라미 -->
  <rect x="18" y="60" width="104" height="42" rx="14" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <polygon points="94,102 114,102 112,130" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <rect x="95" y="100" width="18" height="4" fill="#ffffff"/>
  <text x="70" y="83" text-anchor="middle" dominant-baseline="middle" font-family="'Pretendard', sans-serif" font-size="16" fill="#1f2937">그네 탈래!</text>
