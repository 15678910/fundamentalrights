<svg viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="동그라미와 네모가 놀이터에서 그네를 타려고 신난 장면">
  <title>동그라미와 네모가 놀이터에서 그네를 타려고 신난 장면</title>
  <rect width="320" height="260" fill="#ffffff"/>
  <rect y="200" width="320" height="60" fill="#eef2f7"/>

  <!-- 패널 번호 -->
  <circle cx="298" cy="22" r="13" fill="#e11d2a"/>
  <text x="298" y="27" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">1</text>

  <!-- 그네 -->
  <line x1="160" y1="204" x2="190" y2="38" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/>
  <line x1="220" y1="204" x2="190" y2="38" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/>
  <line x1="168" y1="188" x2="212" y2="188" stroke="#1f2937" stroke-width="2"/>
  <line x1="182" y1="45" x2="178" y2="128" stroke="#1f2937" stroke-width="2"/>
  <line x1="198" y1="45" x2="202" y2="128" stroke="#1f2937" stroke-width="2"/>
  <rect x="172" y="128" width="36" height="10" rx="3" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/>

