    <polygon points="0,-100 -28,-35 28,-35" fill="#ffffff" stroke="#1f2937" stroke-width="3" stroke-linejoin="round"/>
    <path d="M -8,-98 L -13,-110" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <path d="M 0,-102 L 0,-115" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <path d="M 8,-98 L 13,-110" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <path d="M -24,-70 Q -28,-58 -26,-45" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 25,-72 Q 42,-76 56,-70" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <line x1="-16" y1="-84" x2="-6" y2="-86" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="-86" x2="16" y2="-84" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <circle cx="-11" cy="-75" r="7" fill="#ffffff" fill-opacity="0.5" stroke="#1f2937" stroke-width="2"/>
    <circle cx="11" cy="-75" r="7" fill="#ffffff" fill-opacity="0.5" stroke="#1f2937" stroke-width="2"/>
    <line x1="-4" y1="-75" x2="4" y2="-75" stroke="#1f2937" stroke-width="2"/>
    <circle cx="-11" cy="-75" r="1.6" fill="#1f2937"/>
    <circle cx="11" cy="-75" r="1.6" fill="#1f2937"/>
    <circle cx="-20" cy="-64" r="3" fill="#e11d2a" opacity="0.3"/>
    <circle cx="20" cy="-64" r="3" fill="#e11d2a" opacity="0.3"/>
    <path d="M -9,-59 Q 0,-51 9,-59" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
