    <path d="M 5,-59 Q 8,-56 11,-59" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
    <line x1="-14" y1="-66" x2="-5" y2="-63" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <line x1="5" y1="-63" x2="14" y2="-66" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <path d="M -6,-50 Q 0,-46 6,-50" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
