<svg viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="열린 창문 쪽으로 이어진 발자국을 따라가 바람에 컵이 넘어진 것임이 밝혀지고 네모가 동그라미에게 사과하는 장면">
  <title>열린 창문 쪽으로 이어진 발자국을 따라가 바람에 컵이 넘어진 것임이 밝혀지고 네모가 동그라미에게 사과하는 장면</title>
  <rect width="320" height="260" fill="#ffffff"/>
  <rect y="200" width="320" height="60" fill="#eef2f7"/>

  <!-- 열린 창문 (바람) -->
  <rect x="248" y="16" width="56" height="72" rx="4" fill="#dbeafe" stroke="#1f2937" stroke-width="3"/>
  <line x1="276" y1="16" x2="276" y2="88" stroke="#1f2937" stroke-width="2"/>
  <line x1="248" y1="52" x2="304" y2="52" stroke="#1f2937" stroke-width="2"/>
  <path d="M 244,30 Q 232,38 240,48 Q 228,56 238,66" stroke="#94a3b8" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- 발자국 -->
  <g fill="#cbd5e1">
    <ellipse cx="150" cy="188" rx="7" ry="4" transform="rotate(-20 150 188)"/>
    <ellipse cx="172" cy="176" rx="6" ry="3.4" transform="rotate(-20 172 176)"/>
    <ellipse cx="196" cy="160" rx="5" ry="3" transform="rotate(-20 196 160)"/>
    <ellipse cx="218" cy="140" rx="4" ry="2.4" transform="rotate(-20 218 140)"/>
  </g>

