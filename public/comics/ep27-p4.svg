      <polyline points="-21,-78 -15,-89 -8,-78 0,-90 8,-78 15,-89 21,-78" fill="none" stroke="#e11d2a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M -23,-58 Q -18,-48 -10,-45" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
      <path d="M 23,-58 Q 18,-48 10,-45" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
      <g fill="none" stroke="#1f2937" stroke-width="2"><circle cx="-9" cy="-58" r="7"/><circle cx="9" cy="-58" r="7"/><path d="M -2,-58 h4"/></g>
      <path d="M -12,-58 Q -9,-55 -6,-58" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
      <path d="M 6,-58 Q 9,-55 12,-58" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
      <line x1="-14" y1="-65" x2="-5" y2="-62" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
      <line x1="5" y1="-62" x2="14" y2="-65" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
      <path d="M -6,-42 Q 0,-46 6,-42" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
    </g>
  </g>

  <!-- 말풍선: 네모 -->
  <rect x="196" y="106" width="86" height="42" rx="14" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <polygon points="234,148 242,172 250,148" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <rect x="234" y="146" width="16" height="4" fill="#ffffff"/>
  <text x="239" y="132" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="15" fill="#1f2937">미안해!</text>

  <!-- 캡션 -->
  <text x="160" y="248" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="12" fill="#64748b">제27조 재판을 받을 권리</text>
</svg>
