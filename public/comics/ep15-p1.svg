<svg viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="장래희망 발표 시간, 동그라미가 작은 냄비를 들고 요리사라고 외치는 장면">
  <title>장래희망 발표 시간, 동그라미가 작은 냄비를 들고 요리사라고 외치는 장면</title>
  <rect width="320" height="260" fill="#ffffff"/>
  <rect y="200" width="320" height="60" fill="#eef2f7"/>

  <!-- 칠판 -->
  <rect x="14" y="16" width="100" height="50" rx="4" fill="#e3ede2" stroke="#1f2937" stroke-width="2"/>
  <line x1="14" y1="66" x2="114" y2="66" stroke="#1f2937" stroke-width="2"/>
  <text x="64" y="46" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="12" font-weight="bold" fill="#1f2937">장래희망</text>

  <!-- 패널 번호 -->
  <circle cx="298" cy="22" r="13" fill="#e11d2a"/>
  <text x="298" y="27" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">1</text>

  <!-- 반짝임 -->
  <path d="M 250,86 L 252,91 L 257,93 L 252,95 L 250,100 L 248,95 L 243,93 L 248,91 Z" fill="#e11d2a" opacity="0.4"/>

  <!-- 동그라미 (신나서 냄비 들고 발표) -->
  <g transform="translate(150,206)">
    <ellipse cx="0" cy="2" rx="24" ry="5" fill="#1f2937" opacity="0.08"/>
    <line x1="-10" y1="-32" x2="-11" y2="-3" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="-32" x2="11" y2="-3" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-11" cy="-2" rx="6" ry="3" fill="#1f2937"/>
    <ellipse cx="11" cy="-2" rx="6" ry="3" fill="#1f2937"/>
    <circle cx="0" cy="-57" r="28" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
    <path d="M -3,-85 Q 4,-96 -2,-101 Q -7,-105 -1,-109" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M -26,-60 Q -34,-70 -32,-84" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/><circle cx="-32" cy="-84" r="4" fill="#1f2937"/>
    <path d="M 26,-60 Q 34,-70 32,-84" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/><circle cx="32" cy="-84" r="4" fill="#1f2937"/>
    <circle cx="-19" cy="-56" r="3" fill="#e11d2a" opacity="0.3"/>
    <circle cx="19" cy="-56" r="3" fill="#e11d2a" opacity="0.3"/>
    <g fill="none" stroke="#1f2937" stroke-width="2"><circle cx="-9" cy="-61" r="7"/><circle cx="9" cy="-61" r="7"/><path d="M -2,-61 h4"/></g>
    <path d="M -12,-63 Q -9,-60 -6,-63" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 6,-63 Q 9,-60 12,-63" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M -14,-70 Q -9,-73 -4,-70" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 4,-70 Q 9,-73 14,-70" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M -8,-49 Q -1,-44 8,-49" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- 작은 냄비 (오른손) -->
    <g transform="translate(38,-86)">
      <path d="M -12,0 A12,7 0 0 0 12,0 L 10,10 A10,5 0 0 1 -10,10 Z" fill="#c9d3dc" stroke="#1f2937" stroke-width="2"/>
      <ellipse cx="0" cy="0" rx="12" ry="4" fill="#e2e8f0" stroke="#1f2937" stroke-width="2"/>
      <line x1="-19" y1="-2" x2="-12" y2="-1" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
      <line x1="19" y1="-2" x2="12" y2="-1" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
      <path d="M -3,-9 Q -1,-14 3,-16" stroke="#e11d2a" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
    </g>
  </g>

  <!-- 말풍선: 동그라미 -->
  <path d="M 138,10 H 300 A12,12 0 0 1 312,22 V 46 A12,12 0 0 1 300,58 H 217 L 208,100 L 199,58 H 138 A12,12 0 0 1 126,46 V 22 A12,12 0 0 1 138,10 Z" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="219" y="35" text-anchor="middle" dominant-baseline="middle" font-family="'Pretendard', sans-serif" font-size="16" fill="#1f2937">저는 요리사요!</text>
</svg>
