<svg viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="동그라미가 새 책가방을 메고 설레는 마음으로 학교 가는 길에 나서는 장면">
  <title>동그라미가 새 책가방을 메고 설레는 마음으로 학교 가는 길에 나서는 장면</title>
  <rect width="320" height="260" fill="#ffffff"/>
  <rect y="200" width="320" height="60" fill="#eef2f7"/>
  <path d="M 0,232 Q 80,216 160,228 T 320,220" stroke="#dbe4ee" stroke-width="10" fill="none"/>

  <!-- 학교 건물 (배경) -->
  <rect x="16" y="30" width="70" height="36" rx="2" fill="#fef3e2" stroke="#1f2937" stroke-width="2"/>
  <polygon points="16,30 51,10 86,30" fill="#fca5a5" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/>
  <rect x="44" y="46" width="14" height="20" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <line x1="51" y1="10" x2="51" y2="2" stroke="#1f2937" stroke-width="2"/>
  <path d="M 51,2 L 62,6 L 51,10 Z" fill="#e11d2a"/>

  <!-- 작은 새 -->
  <path d="M 240,26 q 5,-6 10,0 q 5,-6 10,0" stroke="#1f2937" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 265,42 q 4,-5 8,0 q 4,-5 8,0" stroke="#1f2937" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- 동그라미 (책가방 메고 설렘) -->
  <g transform="translate(160,206)">
    <ellipse cx="0" cy="2" rx="24" ry="5" fill="#1f2937" opacity="0.08"/>
    <line x1="-10" y1="-32" x2="-11" y2="-3" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="-32" x2="11" y2="-3" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-11" cy="-2" rx="6" ry="3" fill="#1f2937"/>
    <ellipse cx="11" cy="-2" rx="6" ry="3" fill="#1f2937"/>
    <rect x="-30" y="-90" width="60" height="46" rx="10" fill="#fbbf24" stroke="#1f2937" stroke-width="3"/>
    <circle cx="0" cy="-57" r="28" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
    <path d="M -3,-85 Q 4,-96 -2,-101 Q -7,-105 -1,-109" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <line x1="-14" y1="-82" x2="-6" y2="-34" stroke="#1f2937" stroke-width="2"/>
    <line x1="14" y1="-82" x2="6" y2="-34" stroke="#1f2937" stroke-width="2"/>
    <circle cx="0" cy="-36" r="4" fill="#fbbf24" stroke="#1f2937" stroke-width="1.5"/>
    <path d="M -27.5,-62.5 Q -35,-78 -32,-95" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 27.5,-62.5 Q 35,-78 32,-95" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="-32" cy="-95" r="4" fill="#1f2937"/>
    <circle cx="32" cy="-95" r="4" fill="#1f2937"/>
    <circle cx="-19" cy="-56" r="3" fill="#e11d2a" opacity="0.3"/>
    <circle cx="19" cy="-56" r="3" fill="#e11d2a" opacity="0.3"/>
    <g fill="none" stroke="#1f2937" stroke-width="2"><circle cx="-9" cy="-61" r="7"/><circle cx="9" cy="-61" r="7"/><path d="M -2,-61 h4"/></g>
    <circle cx="-9" cy="-61" r="2.8" fill="#1f2937"/>
    <circle cx="9" cy="-61" r="2.8" fill="#1f2937"/>
    <line x1="-14" y1="-70" x2="-6" y2="-69" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="-69" x2="14" y2="-70" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <path d="M -9,-52 Q 0,-44 9,-52" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 말풍선: 동그라미 -->
  <path d="M 97,14 H 223 A12,12 0 0 1 235,26 V 44 A12,12 0 0 1 223,56 H 169 L 160,95 L 151,56 H 97 A12,12 0 0 1 85,44 V 26 A12,12 0 0 1 97,14 Z" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="160" y="35" text-anchor="middle" dominant-baseline="middle" font-family="'Pretendard', sans-serif" font-size="16" fill="#1f2937">새 책가방이다!</text>
</svg>
