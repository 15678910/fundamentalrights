<svg viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="네모가 반장 배지를 달고 새 규칙 종이를 들고 등장하는 장면">
  <title>네모가 반장 배지를 달고 새 규칙 종이를 들고 등장하는 장면</title>
  <rect width="320" height="260" fill="#ffffff"/>
  <rect y="200" width="320" height="60" fill="#eef2f7"/>

  <line x1="24" y1="30" x2="96" y2="30" stroke="#c9b6a0" stroke-width="2"/>
  <line x1="24" y1="42" x2="86" y2="42" stroke="#c9b6a0" stroke-width="2"/>
  <line x1="24" y1="54" x2="90" y2="54" stroke="#c9b6a0" stroke-width="2"/>

  <!-- 패널 번호 -->
  <circle cx="298" cy="22" r="13" fill="#e11d2a"/>
  <text x="298" y="27" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">1</text>

  <!-- 동그라미 (놀란 표정) -->
  <g transform="translate(100,206)">
    <ellipse cx="0" cy="2" rx="24" ry="5" fill="#1f2937" opacity="0.08"/>
    <line x1="-10" y1="-32" x2="-11" y2="-3" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="-32" x2="11" y2="-3" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-11" cy="-2" rx="6" ry="3" fill="#1f2937"/>
    <ellipse cx="11" cy="-2" rx="6" ry="3" fill="#1f2937"/>
    <circle cx="0" cy="-57" r="28" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
    <path d="M -3,-85 Q 4,-96 -2,-101 Q -7,-105 -1,-109" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M -26,-60 Q -30,-70 -26,-80" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/><circle cx="-26" cy="-80" r="4" fill="#1f2937"/>
    <path d="M 26,-60 Q 30,-70 26,-80" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/><circle cx="26" cy="-80" r="4" fill="#1f2937"/>
    <circle cx="-19" cy="-56" r="3" fill="#e11d2a" opacity="0.3"/>
    <circle cx="19" cy="-56" r="3" fill="#e11d2a" opacity="0.3"/>
    <g fill="none" stroke="#1f2937" stroke-width="2"><circle cx="-9" cy="-61" r="7"/><circle cx="9" cy="-61" r="7"/><path d="M -2,-61 h4"/></g>
    <circle cx="-9" cy="-61" r="3.2" fill="#1f2937"/>
    <circle cx="9" cy="-61" r="3.2" fill="#1f2937"/>
    <line x1="-14" y1="-68" x2="-5" y2="-68" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <line x1="5" y1="-68" x2="14" y2="-68" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="0" cy="-51" rx="4" ry="5" fill="#1f2937"/>
  </g>

  <!-- 네모 (반장 배지 + 규칙 종이 들고 등장) -->
  <g transform="translate(220,206)">
    <ellipse cx="0" cy="2" rx="26" ry="5" fill="#1f2937" opacity="0.08"/>
    <line x1="-10" y1="-30" x2="-13" y2="-3" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="-30" x2="14" y2="-3" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <rect x="-19" y="-6" width="10" height="6" rx="2" fill="#e11d2a"/>
    <rect x="9" y="-6" width="10" height="6" rx="2" fill="#e11d2a"/>
    <rect x="-28" y="-85" width="56" height="56" rx="10" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/>
    <path d="M -20,-85 q6 -12 12 -4 q6 -12 12 -4 q6 -10 12 -2" fill="none" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <!-- 반장 배지 -->
    <circle cx="14" cy="-64" r="7" fill="#e11d2a"/>
    <text x="14" y="-61" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="8" font-weight="bold" fill="#ffffff">반</text>
    <!-- 팔: 종이를 든 왼팔 -->
    <path d="M -26,-68 Q -40,-58 -46,-40" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 26,-68 Q 34,-58 34,-46" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <g fill="none" stroke="#1f2937" stroke-width="2"><circle cx="-10" cy="-62" r="7"/><circle cx="10" cy="-62" r="7"/><path d="M -3,-62 h6"/></g>
    <circle cx="-10" cy="-62" r="3.2" fill="#1f2937"/>
    <circle cx="10" cy="-62" r="3.2" fill="#1f2937"/>
    <line x1="-15" y1="-72" x2="-6" y2="-70" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="-70" x2="15" y2="-72" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <path d="M -6,-48 Q 0,-45 6,-48" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- 규칙 종이 -->
    <rect x="-58" y="-46" width="30" height="38" rx="3" fill="#ffffff" stroke="#1f2937" stroke-width="2" transform="rotate(-6 -43 -27)"/>
    <text x="-44" y="-32" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="9" font-weight="bold" fill="#e11d2a" transform="rotate(-6 -43 -27)">새 규칙</text>
    <line x1="-53" y1="-24" x2="-33" y2="-25" stroke="#94a3b8" stroke-width="1" transform="rotate(-6 -43 -27)"/>
    <line x1="-53" y1="-18" x2="-33" y2="-19" stroke="#94a3b8" stroke-width="1" transform="rotate(-6 -43 -27)"/>
  </g>

  <!-- 말풍선: 네모 -->
  <path d="M 130,10 H 300 A12,12 0 0 1 312,22 V 46 A12,12 0 0 1 300,58 H 231 L 222,100 L 213,58 H 130 A12,12 0 0 1 118,46 V 22 A12,12 0 0 1 130,10 Z" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="215" y="33" text-anchor="middle" dominant-baseline="middle" font-family="'Pretendard', sans-serif" font-size="15" fill="#1f2937">
    <tspan x="215" dy="-11">모두 주목!</tspan>
    <tspan x="215" dy="22">새 규칙 발표!</tspan>
  </text>
</svg>
