<svg viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="동그라미가 혼자 작은 목소리로 놀이 시간을 늘려 달라고 말하지만 아무도 듣지 못하는 장면">
  <title>동그라미가 혼자 작은 목소리로 놀이 시간을 늘려 달라고 말하지만 아무도 듣지 못하는 장면</title>
  <rect width="320" height="260" fill="#ffffff"/>
  <rect y="200" width="320" height="60" fill="#eef2f7"/>
  <rect x="0" y="0" width="14" height="200" fill="#f4f6f9"/>
  <rect x="306" y="0" width="14" height="200" fill="#f4f6f9"/>

  <!-- 패널 번호 -->
  <circle cx="298" cy="22" r="13" fill="#e11d2a"/>
  <text x="298" y="27" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">1</text>

  <!-- 작아지는 목소리 표시 -->
  <path d="M 225,63 Q 236,63 236,74" stroke="#cbd5e1" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.55"/>
  <path d="M 232,58 Q 249,58 249,79" stroke="#cbd5e1" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.3"/>

  <!-- 동그라미 (작은 목소리) -->
  <g transform="translate(160,206)">
    <ellipse cx="0" cy="2" rx="24" ry="5" fill="#1f2937" opacity="0.08"/>
    <line x1="-10" y1="-32" x2="-11" y2="-3" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="-32" x2="11" y2="-3" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-11" cy="-2" rx="6" ry="3" fill="#1f2937"/>
    <ellipse cx="11" cy="-2" rx="6" ry="3" fill="#1f2937"/>
    <circle cx="0" cy="-57" r="28" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
    <path d="M -3,-85 Q 4,-96 -2,-101 Q -7,-105 -1,-109" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M -25,-60 Q -30,-52 -27,-42" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 25,-60 Q 30,-52 27,-42" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="-19" cy="-56" r="3" fill="#e11d2a" opacity="0.25"/>
    <circle cx="19" cy="-56" r="3" fill="#e11d2a" opacity="0.25"/>
    <circle cx="-9" cy="-61" r="2.6" fill="#1f2937"/>
    <circle cx="9" cy="-61" r="2.6" fill="#1f2937"/>
    <line x1="-13" y1="-68" x2="-6" y2="-67" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="-67" x2="13" y2="-68" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="0" cy="-49" rx="4" ry="3" fill="#1f2937"/>
  </g>

  <!-- 작은 말풍선 (조그맣고 옅은 목소리) -->
  <path d="M 118,42 H 202 A10,10 0 0 1 212,52 V 74 A10,10 0 0 1 202,84 H 168 L 160,106 L 152,84 H 118 A10,10 0 0 1 108,74 V 52 A10,10 0 0 1 118,42 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="160" y="63" text-anchor="middle" dominant-baseline="middle" font-family="'Pretendard', sans-serif" font-size="12" fill="#64748b">
    <tspan x="160" dy="-7">놀이 시간 좀</tspan>
    <tspan x="160" dy="15">늘려주세요…</tspan>
  </text>
</svg>
