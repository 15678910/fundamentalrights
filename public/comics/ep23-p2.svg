<svg viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="네모가 저금통을 들고 잠깐 쓰겠다며 가져가려 하고 동그라미가 놀라 말리는 장면">
  <title>네모가 저금통을 들고 잠깐 쓰겠다며 가져가려 하고 동그라미가 놀라 말리는 장면</title>
  <rect width="320" height="260" fill="#ffffff"/>
  <rect y="200" width="320" height="60" fill="#eef2f7"/>

  <!-- 패널 번호 -->
  <circle cx="22" cy="22" r="13" fill="#e11d2a"/>
  <text x="22" y="27" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">2</text>

  <!-- 네모 (저금통을 들어 올리는 중) -->
  <g transform="translate(190,206)">
    <ellipse cx="0" cy="2" rx="26" ry="5" fill="#1f2937" opacity="0.08"/>
    <line x1="-10" y1="-30" x2="-11" y2="-3" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="-30" x2="11" y2="-3" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <rect x="-16" y="-6" width="10" height="6" rx="2" fill="#e11d2a"/>
    <rect x="6" y="-6" width="10" height="6" rx="2" fill="#e11d2a"/>
    <rect x="-28" y="-85" width="56" height="56" rx="10" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/>
    <polyline points="-24,-85 -17,-97 -9,-85 0,-98 9,-85 17,-97 24,-85" fill="none" stroke="#e11d2a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M -26,-65 Q -40,-78 -36,-96" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 26,-65 Q 40,-78 36,-96" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="-9" cy="-62" r="3.2" fill="#1f2937"/>
    <circle cx="9" cy="-62" r="3.2" fill="#1f2937"/>
    <line x1="-15" y1="-72" x2="-6" y2="-74" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="-74" x2="15" y2="-72" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <path d="M -8,-50 Q -1,-45 8,-50" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 돼지저금통 (들려 있음) -->
  <g transform="translate(190,148) scale(0.82)">
    <ellipse cx="0" cy="-38" rx="34" ry="26" fill="#e11d2a" stroke="#1f2937" stroke-width="3"/>
    <path d="M -22,-58 L -30,-70 L -14,-64 Z" fill="#e11d2a" stroke="#1f2937" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 22,-58 L 30,-70 L 14,-64 Z" fill="#e11d2a" stroke="#1f2937" stroke-width="3" stroke-linejoin="round"/>
    <ellipse cx="0" cy="-32" rx="10" ry="7" fill="#ffffff" stroke="#1f2937" stroke-width="2.5"/>
    <circle cx="-4" cy="-32" r="1.6" fill="#1f2937"/>
    <circle cx="4" cy="-32" r="1.6" fill="#1f2937"/>
    <circle cx="-14" cy="-42" r="2.5" fill="#1f2937"/>
    <circle cx="14" cy="-42" r="2.5" fill="#1f2937"/>
    <rect x="-8" y="-64" width="16" height="4" rx="2" fill="#1f2937"/>
    <path d="M 32,-46 Q 40,-50 38,-58" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 동그라미 (놀라서 말림) -->
  <g transform="translate(88,206)">
    <ellipse cx="0" cy="2" rx="24" ry="5" fill="#1f2937" opacity="0.08"/>
    <line x1="-10" y1="-32" x2="-11" y2="-3" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="-32" x2="11" y2="-3" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-11" cy="-2" rx="6" ry="3" fill="#1f2937"/>
    <ellipse cx="11" cy="-2" rx="6" ry="3" fill="#1f2937"/>
    <circle cx="0" cy="-57" r="28" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
    <path d="M -3,-85 Q 4,-96 -2,-101 Q -7,-105 -1,-109" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M -26,-60 Q -20,-48 -13,-44" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 26,-60 Q 44,-64 58,-58" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="-19" cy="-56" r="3" fill="#e11d2a" opacity="0.3"/>
    <circle cx="19" cy="-56" r="3" fill="#e11d2a" opacity="0.3"/>
    <circle cx="-9" cy="-61" r="2.5" fill="#1f2937"/>
    <circle cx="9" cy="-61" r="2.5" fill="#1f2937"/>
    <line x1="-14" y1="-70" x2="-6" y2="-68" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="-68" x2="14" y2="-70" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="-48" r="4" fill="#1f2937"/>
  </g>

  <!-- 말풍선: 동그라미 (좌측, 패널 번호 배지와 11px 간격) -->
  <path d="M 56,2 H 142 A10,10 0 0 1 152,12 V 30 A10,10 0 0 1 142,40 H 99 L 90,90 L 81,40 H 56 A10,10 0 0 1 46,30 V 12 A10,10 0 0 1 56,2 Z" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="99" y="21" text-anchor="middle" dominant-baseline="middle" font-family="'Pretendard', sans-serif" font-size="15" fill="#1f2937">안 돼!!</text>

  <!-- 말풍선: 네모 (우측, 좌측 풍선과 12px 간격) -->
  <path d="M 174,2 H 274 A10,10 0 0 1 284,12 V 30 A10,10 0 0 1 274,40 H 214 L 205,110 L 196,40 H 174 A10,10 0 0 1 164,30 V 12 A10,10 0 0 1 174,2 Z" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="224" y="21" text-anchor="middle" dominant-baseline="middle" font-family="'Pretendard', sans-serif" font-size="15" fill="#1f2937">잠깐 쓸게~</text>
</svg>
