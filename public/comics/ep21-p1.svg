<svg viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="동그라미가 벽신문에 급식에 과일을 늘려 달라는 의견 쪽지를 붙이는 장면">
  <title>동그라미가 벽신문에 급식에 과일을 늘려 달라는 의견 쪽지를 붙이는 장면</title>
  <rect width="320" height="260" fill="#ffffff"/>
  <rect y="200" width="320" height="60" fill="#eef2f7"/>

  <!-- 벽신문 게시판 -->
  <line x1="60" y1="118" x2="60" y2="200" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="60" cy="200" rx="20" ry="5" fill="#1f2937" opacity="0.1"/>
  <rect x="14" y="16" width="92" height="102" rx="6" fill="#e9dcc3" stroke="#1f2937" stroke-width="3"/>
  <text x="60" y="34" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="12" fill="#1f2937" font-weight="bold">벽신문</text>
  <!-- 붙어있는 다른 쪽지 -->
  <rect x="24" y="46" width="34" height="24" rx="2" fill="#ffffff" stroke="#1f2937" stroke-width="1.5" transform="rotate(-3 41 58)"/>
  <circle cx="41" cy="50" r="2.4" fill="#e11d2a" transform="rotate(-3 41 58)"/>

  <!-- 동그라미 (쪽지를 붙이는 중) -->
  <g transform="translate(150,206)">
    <ellipse cx="0" cy="2" rx="24" ry="5" fill="#1f2937" opacity="0.08"/>
    <line x1="-10" y1="-32" x2="-11" y2="-3" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="-32" x2="11" y2="-3" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-11" cy="-2" rx="6" ry="3" fill="#1f2937"/>
    <ellipse cx="11" cy="-2" rx="6" ry="3" fill="#1f2937"/>
    <circle cx="0" cy="-57" r="28" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
    <path d="M -3,-85 Q 4,-96 -2,-101 Q -7,-105 -1,-109" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M -26,-60 Q -30,-48 -24,-38" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 26,-60 Q 42,-72 58,-88" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="-24" cy="-38" r="4" fill="#1f2937"/>
    <circle cx="58" cy="-88" r="4" fill="#1f2937"/>
    <circle cx="-19" cy="-56" r="3" fill="#e11d2a" opacity="0.3"/>
    <circle cx="19" cy="-56" r="3" fill="#e11d2a" opacity="0.3"/>
    <circle cx="-9" cy="-61" r="2.5" fill="#1f2937"/>
    <circle cx="9" cy="-61" r="2.5" fill="#1f2937"/>
    <g fill="none" stroke="#1f2937" stroke-width="2"><circle cx="-9" cy="-61" r="7"/><circle cx="9" cy="-61" r="7"/><path d="M -2,-61 h4"/></g>
    <line x1="-13" y1="-68" x2="-6" y2="-66" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="-66" x2="13" y2="-68" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <path d="M -6,-52 Q -1,-48 5,-52" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 동그라미가 붙이는 쪽지 -->
  <rect x="122" y="108" width="52" height="34" rx="2" fill="#ffffff" stroke="#1f2937" stroke-width="2" transform="rotate(-4 148 125)"/>
  <circle cx="148" cy="113" r="2.6" fill="#e11d2a" transform="rotate(-4 148 125)"/>
  <text x="148" y="130" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="10" fill="#1f2937" transform="rotate(-4 148 125)">급식에</text>
  <text x="148" y="141" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="10" fill="#1f2937" transform="rotate(-4 148 125)">과일을!</text>

  <!-- 말풍선: 동그라미 -->
  <path d="M 178,26 H 300 A12,12 0 0 1 312,38 V 58 A12,12 0 0 1 300,70 H 234 L 225,100 L 216,70 H 178 A12,12 0 0 1 166,58 V 38 A12,12 0 0 1 178,26 Z" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="239" y="48" text-anchor="middle" dominant-baseline="middle" font-family="'Pretendard', sans-serif" font-size="15" fill="#1f2937">내 의견이야!</text>
</svg>
