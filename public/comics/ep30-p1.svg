<svg viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="동그라미가 혼자 풀 죽은 채 고개를 숙이고 있는 장면">
  <title>동그라미가 혼자 풀 죽은 채 고개를 숙이고 있는 장면</title>
  <rect width="320" height="260" fill="#ffffff"/>
  <rect y="200" width="320" height="60" fill="#eef2f7"/>

  <!-- 벤치 -->
  <rect x="70" y="160" width="180" height="10" rx="3" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/>
  <line x1="85" y1="170" x2="85" y2="200" stroke="#1f2937" stroke-width="2"/>
  <line x1="235" y1="170" x2="235" y2="200" stroke="#1f2937" stroke-width="2"/>

  <!-- 생각 구름 -->
  <circle cx="205" cy="150" r="4" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <circle cx="216" cy="138" r="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <ellipse cx="238" cy="113" rx="28" ry="19" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="238" y="120" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="20" fill="#1f2937">…</text>

  <!-- 패널 번호 -->
  <circle cx="298" cy="22" r="13" fill="#e11d2a"/>
  <text x="298" y="27" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">1</text>

  <!-- 동그라미 (혼자 풀 죽음) -->
  <g transform="translate(155,206)">
    <ellipse cx="0" cy="2" rx="24" ry="5" fill="#1f2937" opacity="0.08"/>
    <line x1="-10" y1="-32" x2="-11" y2="-3" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="-32" x2="11" y2="-3" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-11" cy="-2" rx="6" ry="3" fill="#1f2937"/>
    <ellipse cx="11" cy="-2" rx="6" ry="3" fill="#1f2937"/>
    <path d="M -26,-58 Q -28,-42 -25,-28" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="-25" cy="-28" r="4" fill="#1f2937"/>
    <path d="M 26,-58 Q 28,-42 25,-28" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="25" cy="-28" r="4" fill="#1f2937"/>
    <g transform="rotate(20 0 -30)">
