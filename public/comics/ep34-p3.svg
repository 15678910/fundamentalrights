<svg viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="세모가 어려운 이웃은 나라가 돌봐야 한다며 헌법 제34조를 설명하는 장면">
  <title>세모가 어려운 이웃은 나라가 돌봐야 한다며 헌법 제34조를 설명하는 장면</title>
  <rect width="320" height="260" fill="#ffffff"/>
  <rect y="200" width="320" height="60" fill="#eef2f7"/>

  <!-- 동그라미 (고개 끄덕) -->
  <g transform="translate(55,206)">
    <ellipse cx="0" cy="2" rx="22" ry="5" fill="#1f2937" opacity="0.08"/>
    <line x1="-9" y1="-30" x2="-10" y2="-3" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="9" y1="-30" x2="10" y2="-3" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-10" cy="-2" rx="5.5" ry="3" fill="#1f2937"/>
    <ellipse cx="10" cy="-2" rx="5.5" ry="3" fill="#1f2937"/>
    <circle cx="0" cy="-55" r="26" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
    <path d="M -3,-81 Q 4,-92 -2,-97 Q -7,-101 -1,-105" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M -25.98,-56.04 Q -29,-44 -27,-32" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="-27" cy="-32" r="4" fill="#1f2937"/>
    <path d="M 25.98,-56.04 Q 29,-44 27,-32" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="27" cy="-32" r="4" fill="#1f2937"/>
    <!-- 목도리 -->
    <circle cx="-18" cy="-54" r="3" fill="#e11d2a" opacity="0.3"/>
    <circle cx="18" cy="-54" r="3" fill="#e11d2a" opacity="0.3"/>
    <g fill="none" stroke="#1f2937" stroke-width="2"><circle cx="-8" cy="-59" r="7"/><circle cx="8" cy="-59" r="7"/><path d="M -1,-59 h2"/></g>
    <circle cx="-8" cy="-59" r="2.4" fill="#1f2937"/>
    <circle cx="8" cy="-59" r="2.4" fill="#1f2937"/>
    <line x1="-12" y1="-66" x2="-5" y2="-65" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <line x1="5" y1="-65" x2="12" y2="-66" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <path d="M -5,-49 Q 0,-46 5,-49" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 세모 (설명 중) -->
  <g transform="translate(160,206)">
    <ellipse cx="0" cy="2" rx="24" ry="5" fill="#1f2937" opacity="0.08"/>
    <line x1="-8" y1="-35" x2="-10" y2="-4" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="8" y1="-35" x2="10" y2="-4" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-10" cy="-2" rx="6" ry="3" fill="#1f2937"/>
    <ellipse cx="10" cy="-2" rx="6" ry="3" fill="#1f2937"/>
    <polygon points="0,-100 -28,-35 28,-35" fill="#ffffff" stroke="#1f2937" stroke-width="3" stroke-linejoin="round"/>
    <path d="M -8,-98 L -13,-110" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <path d="M 0,-102 L 0,-115" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <path d="M 8,-98 L 13,-110" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <path d="M -14.66,-65.98 Q -28,-58 -26,-45" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="-26" cy="-45" r="4" fill="#1f2937"/>
    <path d="M 14.66,-65.98 Q 34,-80 30,-92" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="30" cy="-92" r="4" fill="#1f2937"/>
    <!-- 목도리 -->
    <circle cx="-11" cy="-75" r="7" fill="#ffffff" fill-opacity="0.5" stroke="#1f2937" stroke-width="2"/>
    <circle cx="11" cy="-75" r="7" fill="#ffffff" fill-opacity="0.5" stroke="#1f2937" stroke-width="2"/>
    <line x1="-4" y1="-75" x2="4" y2="-75" stroke="#1f2937" stroke-width="2"/>
    <circle cx="-11" cy="-75" r="1.6" fill="#1f2937"/>
    <circle cx="11" cy="-75" r="1.6" fill="#1f2937"/>
    <circle cx="-20" cy="-63" r="3" fill="#e11d2a" opacity="0.3"/>
    <circle cx="20" cy="-63" r="3" fill="#e11d2a" opacity="0.3"/>
    <path d="M -8,-59 Q 0,-53 8,-59" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 네모 (신나서 반응) -->
  <g transform="translate(265,206)">
    <ellipse cx="0" cy="2" rx="24" ry="5" fill="#1f2937" opacity="0.08"/>
    <line x1="-9" y1="-28" x2="-10" y2="-3" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <line x1="9" y1="-28" x2="10" y2="-3" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <rect x="-15" y="-6" width="9" height="6" rx="2" fill="#e11d2a"/>
    <rect x="6" y="-6" width="9" height="6" rx="2" fill="#e11d2a"/>
    <rect x="-25" y="-78" width="50" height="50" rx="9" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/>
    <path d="M -17,-78 q6,-11 11,-4 q6,-11 11,-4 q6,-9 11,-2" fill="none" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <path d="M -25,-58 Q -30,-68 -28,-84" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 25,-58 Q 30,-68 28,-84" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- 목도리 -->
    <g fill="none" stroke="#1f2937" stroke-width="2"><circle cx="-9" cy="-56" r="7"/><circle cx="9" cy="-56" r="7"/><path d="M -2,-56 h4"/></g>
    <circle cx="-9" cy="-56" r="2.8" fill="#1f2937"/>
    <circle cx="9" cy="-56" r="2.8" fill="#1f2937"/>
    <line x1="-13" y1="-63" x2="-5" y2="-65" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <line x1="5" y1="-65" x2="13" y2="-63" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <path d="M -6,-44 Q 0,-39 6,-44" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 말풍선: 세모 (2줄) -->
  <rect x="65" y="36" width="190" height="64" rx="14" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <polygon points="150,100 168,100 159,122" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="160" y="60" text-anchor="middle" dominant-baseline="middle" font-family="'Pretendard', sans-serif" font-size="15" fill="#1f2937">
    <tspan x="160" dy="0">어려운 이웃은 나라가</tspan>
    <tspan x="160" dy="22">돌봐. 제34조!</tspan>
  </text>

  <!-- 말풍선(작게): 네모 -->
  <rect x="196" y="4" width="120" height="30" rx="12" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <polygon points="270,34 285,34 278,50" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="256" y="20" text-anchor="middle" dominant-baseline="middle" font-family="'Pretendard', sans-serif" font-size="13" fill="#1f2937">우리도 함께!</text>
</svg>
