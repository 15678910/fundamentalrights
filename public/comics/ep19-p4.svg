  <!-- 말풍선: 네모 (2줄) -->
  <path d="M 130,8 H 300 A14,14 0 0 1 314,22 V 56 A14,14 0 0 1 300,70 H 234 L 225,102 L 216,70 H 130 A14,14 0 0 1 116,56 V 22 A14,14 0 0 1 130,8 Z" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
