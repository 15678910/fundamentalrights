    <path d="M 26,-60 Q 36,-70 40,-90" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="-24" cy="-38" r="4" fill="#1f2937"/>
    <circle cx="40" cy="-90" r="4" fill="#1f2937"/>
    <line x1="40" y1="-92" x2="40" y2="-130" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="40,-130 68,-120 40,-110" fill="#60a5fa" stroke="#1f2937" stroke-width="1.6" stroke-linejoin="round"/>
    <circle cx="-19" cy="-56" r="3" fill="#e11d2a" opacity="0.3"/>
    <circle cx="19" cy="-56" r="3" fill="#e11d2a" opacity="0.3"/>
    <circle cx="-9" cy="-61" r="2.5" fill="#1f2937"/>
    <circle cx="9" cy="-61" r="2.5" fill="#1f2937"/>
    <g fill="none" stroke="#1f2937" stroke-width="2"><circle cx="-9" cy="-61" r="7"/><circle cx="9" cy="-61" r="7"/><path d="M -2,-61 h4"/></g>
