<svg viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="학교 게시판에 붙은 회장 선거 공고를 동그라미가 신기한 표정으로 바라보는 장면">
  <title>학교 게시판에 붙은 회장 선거 공고를 동그라미가 신기한 표정으로 바라보는 장면</title>
  <rect width="320" height="260" fill="#ffffff"/>
  <rect y="200" width="320" height="60" fill="#eef2f7"/>

  <!-- 게시판 (선거 공고) -->
  <rect x="14" y="14" width="108" height="60" rx="6" fill="#fdf6e3" stroke="#1f2937" stroke-width="2"/>
  <circle cx="68" cy="24" r="4" fill="#e11d2a"/>
  <text x="68" y="46" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="13" font-weight="bold" fill="#1f2937">학급 회장</text>
  <text x="68" y="64" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="12" fill="#1f2937">선거 공고</text>

  <!-- 동그라미 (신기해하며 게시판을 가리킴) -->
  <g transform="translate(220,206)">
    <ellipse cx="0" cy="2" rx="24" ry="5" fill="#1f2937" opacity="0.08"/>
    <line x1="-10" y1="-32" x2="-11" y2="-3" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="-32" x2="11" y2="-3" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-11" cy="-2" rx="6" ry="3" fill="#1f2937"/>
    <ellipse cx="11" cy="-2" rx="6" ry="3" fill="#1f2937"/>
    <circle cx="0" cy="-57" r="28" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
    <path d="M -3,-85 Q 4,-96 -2,-101 Q -7,-105 -1,-109" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M -27.98,-58.08 Q -38,-70 -40,-84" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="-40" cy="-84" r="4" fill="#1f2937"/>
    <path d="M 27.82,-60.21 Q 30,-48 27,-36" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="27" cy="-36" r="4" fill="#1f2937"/>
    <circle cx="-19" cy="-56" r="3" fill="#e11d2a" opacity="0.3"/>
    <circle cx="19" cy="-56" r="3" fill="#e11d2a" opacity="0.3"/>
    <g fill="none" stroke="#1f2937" stroke-width="2"><circle cx="-9" cy="-61" r="7"/><circle cx="9" cy="-61" r="7"/><path d="M -2,-61 h4"/></g>
    <circle cx="-9" cy="-61" r="2.5" fill="#1f2937"/>
    <circle cx="9" cy="-61" r="2.5" fill="#1f2937"/>
    <line x1="-14" y1="-71" x2="-6" y2="-72" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="-72" x2="14" y2="-71" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="0" cy="-49" rx="4" ry="5" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  </g>

  <!-- 말풍선: 동그라미 -->
  <rect x="137" y="12" width="166" height="48" rx="14" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <polygon points="212,60 220,92 228,60" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <rect x="212" y="58" width="16" height="4" fill="#ffffff"/>
  <text x="220" y="41" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="16" fill="#1f2937">회장 선거네?</text>
</svg>
