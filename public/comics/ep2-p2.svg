<svg viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="동그라미가 혼자 고개를 숙이고 눈물을 흘리는 장면">
  <title>동그라미가 혼자 고개를 숙이고 눈물을 흘리는 장면</title>
  <rect width="320" height="260" fill="#ffffff"/>
  <rect y="200" width="320" height="60" fill="#eef2f7"/>

  <!-- 생각 구름 (말풍선) -->
  <path d="M200,80 C182,80 180,55 198,50 C196,32 222,24 236,36 C250,20 280,26 280,46 C298,46 300,72 282,78 C284,92 260,96 248,84 C234,96 206,94 200,80 Z" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <circle cx="195" cy="95" r="8" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <circle cx="178" cy="112" r="6" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <circle cx="165" cy="126" r="4" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="15" fill="#1f2937">
    <tspan x="240" y="52">장난인데…</tspan>
    <tspan x="240" y="72">왜 아프지.</tspan>
  </text>

  <!-- 동그라미 (혼자, 고개 숙임) -->
  <g transform="rotate(9 140 180)">
    <circle cx="140" cy="175" r="40" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
    <path d="M128,138 Q114,118 132,110 Q148,105 140,122" fill="none" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <line x1="112" y1="170" x2="130" y2="164" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="150" y1="164" x2="168" y2="170" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="116" y1="182" x2="128" y2="184" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="152" y1="184" x2="164" y2="182" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <path d="M124,196 Q140,188 156,196" stroke="#1f2937" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M116,190 c4,5 4,10 0,13 c-4,-3 -4,-8 0,-13 Z" fill="#60a5fa"/>
    <line x1="100" y1="180" x2="88" y2="205" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="180" y1="180" x2="192" y2="205" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="125" y1="214" x2="125" y2="234" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="155" y1="214" x2="155" y2="234" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="125" cy="237" rx="8" ry="4" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <ellipse cx="155" cy="237" rx="8" ry="4" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  </g>
</svg>
