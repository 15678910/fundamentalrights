<svg viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="바람에 화분이 쓰러진 게 밝혀지고 네모가 억울했겠다고 말하는 장면">
  <title>바람에 화분이 쓰러진 게 밝혀지고 네모가 억울했겠다고 말하는 장면</title>
  <rect width="320" height="260" fill="#ffffff"/>
  <rect y="200" width="320" height="60" fill="#eef2f7"/>

  <!-- 바람 -->
  <path d="M 30,32 Q 60,18 90,32" stroke="#94a3b8" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 40,52 Q 70,38 100,52" stroke="#94a3b8" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 20,72 Q 50,60 78,72" stroke="#94a3b8" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- 쓰러진 화분 -->
  <g transform="translate(163,196) rotate(72)">
    <polygon points="-9,10 9,10 6,-4 -6,-4" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/>
    <path d="M -4,-4 Q -8,-16 -1,-22" stroke="#1f2937" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 4,-4 Q 8,-16 1,-22" stroke="#1f2937" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="-1" cy="-22" r="3" fill="#e11d2a" opacity="0.7"/>
  </g>
  <ellipse cx="185" cy="204" rx="14" ry="4" fill="#1f2937" opacity="0.15"/>
  <circle cx="178" cy="202" r="2" fill="#1f2937" opacity="0.4"/>
  <circle cx="192" cy="205" r="1.6" fill="#1f2937" opacity="0.4"/>

  <!-- 동그라미 (놀람) -->
  <g transform="translate(75,206)">
    <ellipse cx="0" cy="2" rx="24" ry="5" fill="#1f2937" opacity="0.08"/>
    <line x1="-10" y1="-32" x2="-11" y2="-3" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="-32" x2="11" y2="-3" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-11" cy="-2" rx="6" ry="3" fill="#1f2937"/>
    <ellipse cx="11" cy="-2" rx="6" ry="3" fill="#1f2937"/>
    <circle cx="0" cy="-57" r="28" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
    <path d="M -3,-85 Q 4,-96 -2,-101 Q -7,-105 -1,-109" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M -27.8,-60.2 Q -34,-54 -38,-44" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 27.8,-60.2 Q 34,-54 38,-44" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="-38" cy="-44" r="4" fill="#1f2937"/>
    <circle cx="38" cy="-44" r="4" fill="#1f2937"/>
    <circle cx="-19" cy="-56" r="3" fill="#e11d2a" opacity="0.3"/>
    <circle cx="19" cy="-56" r="3" fill="#e11d2a" opacity="0.3"/>
    <circle cx="-9" cy="-61" r="3.2" fill="#1f2937"/>
    <circle cx="9" cy="-61" r="3.2" fill="#1f2937"/>
    <g fill="none" stroke="#1f2937" stroke-width="2"><circle cx="-9" cy="-61" r="7"/><circle cx="9" cy="-61" r="7"/><path d="M -2,-61 h4"/></g>
    <path d="M -14,-70 Q -10,-73 -5,-70" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 5,-70 Q 10,-73 14,-70" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
    <ellipse cx="0" cy="-49" rx="3" ry="4" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
