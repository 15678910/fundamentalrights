<svg viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="셋이 집게와 봉투를 들고 함께 놀이터를 청소하는 장면">
  <title>셋이 집게와 봉투를 들고 함께 놀이터를 청소하는 장면</title>
  <rect width="320" height="260" fill="#ffffff"/>
  <rect y="200" width="320" height="60" fill="#eef2f7"/>

  <!-- 깨끗해진 그네 -->
  <line x1="14" y1="12" x2="14" y2="70" stroke="#1f2937" stroke-width="2"/>
  <line x1="60" y1="12" x2="60" y2="70" stroke="#1f2937" stroke-width="2"/>
  <line x1="14" y1="12" x2="60" y2="12" stroke="#1f2937" stroke-width="2"/>
  <line x1="24" y1="14" x2="24" y2="46" stroke="#94a3b8" stroke-width="2"/>
  <line x1="50" y1="14" x2="50" y2="46" stroke="#94a3b8" stroke-width="2"/>
  <rect x="22" y="46" width="30" height="7" rx="2" fill="#f3e6d8" stroke="#1f2937" stroke-width="1.5"/>

  <!-- 반짝이 -->
  <g transform="translate(90,26)" stroke="#e11d2a" stroke-width="2" stroke-linecap="round">
    <line x1="0" y1="-7" x2="0" y2="7"/>
    <line x1="-7" y1="0" x2="7" y2="0"/>
    <line x1="-5" y1="-5" x2="5" y2="5"/>
    <line x1="-5" y1="5" x2="5" y2="-5"/>
  </g>
  <g transform="translate(300,60)" stroke="#e11d2a" stroke-width="2" stroke-linecap="round">
    <line x1="0" y1="-6" x2="0" y2="6"/>
    <line x1="-6" y1="0" x2="6" y2="0"/>
  </g>
  <g transform="translate(200,20)" stroke="#e11d2a" stroke-width="2" stroke-linecap="round">
    <line x1="0" y1="-5" x2="0" y2="5"/>
    <line x1="-5" y1="0" x2="5" y2="0"/>
  </g>

  <!-- 동그라미 (봉투 들고) -->
  <g transform="translate(55,206)">
    <ellipse cx="0" cy="2" rx="22" ry="5" fill="#1f2937" opacity="0.08"/>
    <line x1="-9" y1="-30" x2="-10" y2="-3" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="9" y1="-30" x2="10" y2="-3" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-10" cy="-2" rx="5.5" ry="3" fill="#1f2937"/>
    <ellipse cx="10" cy="-2" rx="5.5" ry="3" fill="#1f2937"/>
    <circle cx="0" cy="-55" r="26" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
    <path d="M -3,-81 Q 4,-92 -2,-97 Q -7,-101 -1,-105" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M -25,-58 Q -32,-48 -34,-34" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 25,-56 Q 29,-44 27,-32" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- 봉투 -->
    <path d="M -44,-34 Q -46,-52 -34,-54 Q -22,-52 -24,-34 Z" fill="#eef2f7" stroke="#1f2937" stroke-width="1.5"/>
    <rect x="-45" y="-58" width="22" height="6" rx="2" fill="#e11d2a"/>
    <circle cx="-18" cy="-54" r="3" fill="#e11d2a" opacity="0.3"/>
    <circle cx="18" cy="-54" r="3" fill="#e11d2a" opacity="0.3"/>
    <circle cx="-8" cy="-59" r="2.4" fill="#1f2937"/>
    <circle cx="8" cy="-59" r="2.4" fill="#1f2937"/>
    <line x1="-12" y1="-66" x2="-5" y2="-67" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <line x1="5" y1="-67" x2="12" y2="-66" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <path d="M -6,-48 Q 0,-43 6,-48" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 세모 (엄지척) -->
  <g transform="translate(160,206)">
    <ellipse cx="0" cy="2" rx="24" ry="5" fill="#1f2937" opacity="0.08"/>
    <line x1="-8" y1="-35" x2="-10" y2="-4" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="8" y1="-35" x2="10" y2="-4" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-10" cy="-2" rx="6" ry="3" fill="#1f2937"/>
    <ellipse cx="10" cy="-2" rx="6" ry="3" fill="#1f2937"/>
    <polygon points="0,-100 -28,-35 28,-35" fill="#ffffff" stroke="#1f2937" stroke-width="3" stroke-linejoin="round"/>
    <path d="M -8,-98 L -13,-110" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <path d="M 0,-102 L 0,-115" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <path d="M 8,-98 L 13,-110" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <path d="M -24,-70 Q -34,-82 -30,-98" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 24,-70 Q 28,-58 26,-45" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- 집게 -->
    <g transform="translate(30,-40) rotate(24)">
      <rect x="-2" y="-22" width="4" height="26" rx="2" fill="#f3f4f6" stroke="#1f2937" stroke-width="1.5"/>
      <rect x="-2" y="-22" width="4" height="26" rx="2" fill="#f3f4f6" stroke="#1f2937" stroke-width="1.5" transform="rotate(16)"/>
      <circle cx="0" cy="-15" r="2" fill="#1f2937"/>
    </g>
    <circle cx="-11" cy="-75" r="7" fill="#ffffff" fill-opacity="0.5" stroke="#1f2937" stroke-width="2"/>
    <circle cx="11" cy="-75" r="7" fill="#ffffff" fill-opacity="0.5" stroke="#1f2937" stroke-width="2"/>
    <line x1="-4" y1="-75" x2="4" y2="-75" stroke="#1f2937" stroke-width="2"/>
    <circle cx="-11" cy="-75" r="1.6" fill="#1f2937"/>
    <circle cx="11" cy="-75" r="1.6" fill="#1f2937"/>
    <circle cx="-20" cy="-63" r="3" fill="#e11d2a" opacity="0.3"/>
    <circle cx="20" cy="-63" r="3" fill="#e11d2a" opacity="0.3"/>
    <path d="M -8,-59 Q 0,-53 8,-59" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 네모 (집게 들고) -->
  <g transform="translate(265,206)">
    <ellipse cx="0" cy="2" rx="24" ry="5" fill="#1f2937" opacity="0.08"/>
    <line x1="-9" y1="-28" x2="-10" y2="-3" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <line x1="9" y1="-28" x2="10" y2="-3" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <rect x="-15" y="-6" width="9" height="6" rx="2" fill="#e11d2a"/>
    <rect x="6" y="-6" width="9" height="6" rx="2" fill="#e11d2a"/>
    <rect x="-25" y="-78" width="50" height="50" rx="9" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/>
    <polyline points="-21,-78 -15,-89 -8,-78 0,-90 8,-78 15,-89 21,-78" fill="none" stroke="#e11d2a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M -23,-56 Q -32,-46 -30,-32" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 23,-56 Q 27,-46 19,-40" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- 집게 -->
    <g transform="translate(-32,-30) rotate(-20)">
      <rect x="-2" y="-20" width="4" height="24" rx="2" fill="#f3f4f6" stroke="#1f2937" stroke-width="1.5"/>
      <rect x="-2" y="-20" width="4" height="24" rx="2" fill="#f3f4f6" stroke="#1f2937" stroke-width="1.5" transform="rotate(-16)"/>
      <circle cx="0" cy="-13" r="2" fill="#1f2937"/>
    </g>
    <circle cx="-9" cy="-56" r="2.8" fill="#1f2937"/>
    <circle cx="9" cy="-56" r="2.8" fill="#1f2937"/>
    <line x1="-13" y1="-62" x2="-5" y2="-61" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <line x1="5" y1="-61" x2="13" y2="-62" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <path d="M -6,-44 Q 0,-39 6,-44" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 말풍선: 네모 -->
  <rect x="182" y="8" width="128" height="42" rx="14" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <polygon points="252,50 268,50 260,74" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="246" y="30" text-anchor="middle" dominant-baseline="middle" font-family="'Pretendard', sans-serif" font-size="15" fill="#1f2937">우리가 지킬게!</text>

  <!-- 캡션 -->
  <text x="160" y="250" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="12" fill="#64748b">제35조 환경권</text>
</svg>
