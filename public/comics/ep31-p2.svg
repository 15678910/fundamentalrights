<svg viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="동그라미가 학교 가는 길에 책값이 비쌀까 봐 걱정하는 장면">
  <title>동그라미가 학교 가는 길에 책값이 비쌀까 봐 걱정하는 장면</title>
  <rect width="320" height="260" fill="#ffffff"/>
  <rect y="200" width="320" height="60" fill="#eef2f7"/>
  <path d="M 0,232 Q 80,216 160,228 T 320,220" stroke="#dbe4ee" stroke-width="10" fill="none"/>

  <!-- 패널 번호 -->
  <circle cx="22" cy="22" r="13" fill="#e11d2a"/>
  <text x="22" y="27" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">2</text>

  <!-- 생각 구름 -->
  <ellipse cx="185" cy="45" rx="76" ry="38" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <circle cx="150" cy="90" r="9" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <circle cx="170" cy="107" r="5" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <circle cx="178" cy="117" r="3" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="185" y="46" text-anchor="middle" dominant-baseline="middle" font-family="'Pretendard', sans-serif" font-size="15" fill="#1f2937">
    <tspan x="185" dy="-10">책값이 비싸면</tspan>
    <tspan x="185" dy="21">어떡하지…</tspan>
  </text>

  <!-- 동그라미 (걱정, 책가방 멘 채) -->
  <g transform="translate(180,206)">
    <ellipse cx="0" cy="2" rx="24" ry="5" fill="#1f2937" opacity="0.08"/>
    <line x1="-10" y1="-32" x2="-11" y2="-3" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="-32" x2="11" y2="-3" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-11" cy="-2" rx="6" ry="3" fill="#1f2937"/>
    <ellipse cx="11" cy="-2" rx="6" ry="3" fill="#1f2937"/>
    <rect x="-30" y="-90" width="60" height="46" rx="10" fill="#fbbf24" stroke="#1f2937" stroke-width="3"/>
    <circle cx="0" cy="-57" r="28" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
    <path d="M -3,-85 Q 4,-96 -2,-101 Q -7,-105 -1,-109" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <line x1="-14" y1="-82" x2="-6" y2="-34" stroke="#1f2937" stroke-width="2"/>
    <line x1="14" y1="-82" x2="6" y2="-34" stroke="#1f2937" stroke-width="2"/>
    <circle cx="0" cy="-36" r="4" fill="#fbbf24" stroke="#1f2937" stroke-width="1.5"/>
    <path d="M -25,-58 Q -30,-48 -22,-40" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 25,-58 Q 30,-48 22,-40" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="-22" cy="-40" r="4" fill="#1f2937"/>
    <circle cx="22" cy="-40" r="4" fill="#1f2937"/>
    <circle cx="-19" cy="-56" r="3" fill="#e11d2a" opacity="0.25"/>
    <circle cx="19" cy="-56" r="3" fill="#e11d2a" opacity="0.25"/>
    <g fill="none" stroke="#1f2937" stroke-width="2"><circle cx="-9" cy="-59" r="7"/><circle cx="9" cy="-59" r="7"/><path d="M -2,-59 h4"/></g>
    <circle cx="-9" cy="-59" r="2.6" fill="#1f2937"/>
    <circle cx="9" cy="-59" r="2.6" fill="#1f2937"/>
    <path d="M -14,-68 Q -9,-65 -5,-67" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 5,-67 Q 9,-65 14,-68" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M -6,-49 Q 0,-52 6,-49" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>
