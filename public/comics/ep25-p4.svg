  <g transform="translate(55,206)">
    <ellipse cx="0" cy="2" rx="22" ry="5" fill="#1f2937" opacity="0.08"/>
    <line x1="-9" y1="-30" x2="-10" y2="-3" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="9" y1="-30" x2="10" y2="-3" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-10" cy="-2" rx="5.5" ry="3" fill="#1f2937"/>
    <ellipse cx="10" cy="-2" rx="5.5" ry="3" fill="#1f2937"/>
    <circle cx="0" cy="-55" r="26" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
    <path d="M -3,-81 Q 4,-92 -2,-97 Q -7,-101 -1,-105" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M -25.98,-56.13 Q -20,-46 -13,-42" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="-13" cy="-42" r="4" fill="#1f2937"/>
    <path d="M 25.98,-56.13 Q 20,-46 13,-42" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="13" cy="-42" r="4" fill="#1f2937"/>
    <!-- 후보 등록서 -->
    <rect x="-14" y="-50" width="28" height="20" rx="2" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <line x1="-9" y1="-45" x2="9" y2="-45" stroke="#94a3b8" stroke-width="1"/>
    <line x1="-9" y1="-40" x2="9" y2="-40" stroke="#94a3b8" stroke-width="1"/>
    <path d="M -7,-35 L -3,-31 L 6,-38" stroke="#e11d2a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="-18" cy="-54" r="3" fill="#e11d2a" opacity="0.3"/>
    <circle cx="18" cy="-54" r="3" fill="#e11d2a" opacity="0.3"/>
    <g fill="none" stroke="#1f2937" stroke-width="2"><circle cx="-8" cy="-59" r="7"/><circle cx="8" cy="-59" r="7"/><path d="M -1,-59 h2"/></g>
    <circle cx="-8" cy="-59" r="2.4" fill="#1f2937"/>
    <circle cx="8" cy="-59" r="2.4" fill="#1f2937"/>
    <line x1="-13" y1="-67" x2="-5" y2="-68" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <line x1="5" y1="-68" x2="13" y2="-67" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <path d="M -6,-49 Q 0,-45 6,-49" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

