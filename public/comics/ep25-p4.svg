    <ellipse cx="10" cy="-2" rx="6" ry="3" fill="#1f2937"/>
    <polygon points="0,-100 -28,-35 28,-35" fill="#ffffff" stroke="#1f2937" stroke-width="3" stroke-linejoin="round"/>
    <path d="M -8,-98 L -13,-110" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <path d="M 0,-102 L 0,-115" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <path d="M 8,-98 L 13,-110" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <path d="M -15.38,-64.29 Q -32,-58 -30,-45" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="-30" cy="-45" r="4" fill="#1f2937"/>
    <path d="M 15.38,-64.29 Q 32,-58 30,-45" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="30" cy="-45" r="4" fill="#1f2937"/>
    <line x1="-16" y1="-84" x2="-6" y2="-86" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="-86" x2="16" y2="-84" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <circle cx="-11" cy="-75" r="7" fill="#ffffff" fill-opacity="0.5" stroke="#1f2937" stroke-width="2"/>
    <circle cx="11" cy="-75" r="7" fill="#ffffff" fill-opacity="0.5" stroke="#1f2937" stroke-width="2"/>
    <line x1="-4" y1="-75" x2="4" y2="-75" stroke="#1f2937" stroke-width="2"/>
    <circle cx="-11" cy="-75" r="1.6" fill="#1f2937"/>
    <circle cx="11" cy="-75" r="1.6" fill="#1f2937"/>
    <circle cx="-20" cy="-64" r="3" fill="#e11d2a" opacity="0.3"/>
    <circle cx="20" cy="-64" r="3" fill="#e11d2a" opacity="0.3"/>
    <path d="M -9,-59 Q 0,-51 9,-59" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 네모 (주먹 불끈, 응원) -->
  <g transform="translate(265,206)">
    <ellipse cx="0" cy="2" rx="24" ry="5" fill="#1f2937" opacity="0.08"/>
    <line x1="-9" y1="-28" x2="-10" y2="-3" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <line x1="9" y1="-28" x2="10" y2="-3" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <rect x="-15" y="-6" width="9" height="6" rx="2" fill="#e11d2a"/>
    <rect x="6" y="-6" width="9" height="6" rx="2" fill="#e11d2a"/>
    <rect x="-25" y="-78" width="50" height="50" rx="9" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/>
    <path d="M -18,-78 q6 -11 11 -4 q6 -11 11 -4 q6 -9 11 -2" fill="none" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <path d="M -25,-56 Q -28,-46 -24,-38" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 25,-60 Q 32,-72 30,-90" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <g fill="none" stroke="#1f2937" stroke-width="2"><circle cx="-9" cy="-56" r="7"/><circle cx="9" cy="-56" r="7"/><path d="M -2,-56 h4"/></g>
    <circle cx="-9" cy="-56" r="2.8" fill="#1f2937"/>
    <circle cx="9" cy="-56" r="2.8" fill="#1f2937"/>
    <line x1="-14" y1="-64" x2="-5" y2="-63" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <line x1="5" y1="-63" x2="14" y2="-64" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <path d="M -8,-44 Q 0,-38 8,-44" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 말풍선: 네모 -->
  <rect x="112" y="8" width="196" height="48" rx="14" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <polygon points="252,56 260,80 268,56" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <rect x="252" y="54" width="16" height="4" fill="#ffffff"/>
  <text x="210" y="37" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="14" fill="#1f2937">정정당당 대결이다!</text>

  <!-- 캡션 -->
  <text x="160" y="250" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="12" fill="#64748b">제25조 공무담임권</text>
</svg>
