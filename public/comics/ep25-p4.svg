<svg viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="동그라미가 후보 등록을 하고 네모가 정정당당한 대결이라며 응원하는 장면">
  <title>동그라미가 후보 등록을 하고 네모가 정정당당한 대결이라며 응원하는 장면</title>
  <rect width="320" height="260" fill="#ffffff"/>
  <rect y="200" width="320" height="60" fill="#eef2f7"/>

  <!-- 반짝임 -->
  <path d="M 285,30 L 288,38 L 296,41 L 288,44 L 285,52 L 282,44 L 274,41 L 282,38 Z" fill="#e11d2a" opacity="0.5"/>
  <path d="M 55,18 L 57,23 L 62,25 L 57,27 L 55,32 L 53,27 L 48,25 L 53,23 Z" fill="#e11d2a" opacity="0.35"/>

