<svg viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="네모가 동그라미 짓이라며 벌을 서라고 다그치고 동그라미는 아니라고 항변하는 장면">
  <title>네모가 동그라미 짓이라며 벌을 서라고 다그치고 동그라미는 아니라고 항변하는 장면</title>
  <rect width="320" height="260" fill="#ffffff"/>
  <rect y="200" width="320" height="60" fill="#eef2f7"/>

  <!-- 동그라미 (억울, 팔을 저으며 부인) -->
  <g transform="translate(100,206)">
    <ellipse cx="0" cy="2" rx="24" ry="5" fill="#1f2937" opacity="0.08"/>
    <line x1="-10" y1="-32" x2="-11" y2="-3" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="-32" x2="11" y2="-3" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-11" cy="-2" rx="6" ry="3" fill="#1f2937"/>
    <ellipse cx="11" cy="-2" rx="6" ry="3" fill="#1f2937"/>
    <circle cx="0" cy="-57" r="28" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
    <path d="M -3,-85 Q 4,-96 -2,-101 Q -7,-105 -1,-109" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M -27.5,-62.29 Q -36,-58 -40,-46" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="-40" cy="-46" r="4" fill="#1f2937"/>
    <path d="M 27.5,-62.29 Q 36,-58 40,-46" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="40" cy="-46" r="4" fill="#1f2937"/>
    <circle cx="-19" cy="-56" r="3" fill="#e11d2a" opacity="0.3"/>
    <circle cx="19" cy="-56" r="3" fill="#e11d2a" opacity="0.3"/>
    <g fill="none" stroke="#1f2937" stroke-width="2"><circle cx="-9" cy="-61" r="7"/><circle cx="9" cy="-61" r="7"/><path d="M -2,-61 h4"/></g>
    <circle cx="-9" cy="-61" r="2.5" fill="#1f2937"/>
    <circle cx="9" cy="-61" r="2.5" fill="#1f2937"/>
    <line x1="-6" y1="-71" x2="-13" y2="-67" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <line x1="13" y1="-67" x2="6" y2="-71" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="0" cy="-49" rx="5" ry="6" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  </g>

  <!-- 네모 (삿대질) -->
  <g transform="translate(220,206)">
    <ellipse cx="0" cy="2" rx="26" ry="5" fill="#1f2937" opacity="0.08"/>
    <line x1="-10" y1="-30" x2="-11" y2="-3" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="-30" x2="11" y2="-3" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <rect x="-16" y="-6" width="10" height="6" rx="2" fill="#e11d2a"/>
    <rect x="6" y="-6" width="10" height="6" rx="2" fill="#e11d2a"/>
    <rect x="-28" y="-85" width="56" height="56" rx="10" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/>
    <path d="M -19,-85 q6 -12 12 -4 q6 -12 12 -4 q6 -10 12 -2" fill="none" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <path d="M -28,-65 Q -34,-53 -30,-42" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 28,-64 Q 42,-64 54,-58" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <g fill="none" stroke="#1f2937" stroke-width="2"><circle cx="-10" cy="-62" r="7"/><circle cx="10" cy="-62" r="7"/><path d="M -3,-62 h6"/></g>
    <circle cx="-10" cy="-62" r="3.2" fill="#1f2937"/>
    <circle cx="10" cy="-62" r="3.2" fill="#1f2937"/>
    <line x1="-15" y1="-71" x2="-5" y2="-69" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <line x1="5" y1="-69" x2="15" y2="-71" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <path d="M -8,-47 Q 0,-42 8,-47" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 말풍선: 네모 (2줄) -->
  <rect x="140" y="4" width="176" height="66" rx="14" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <polygon points="212,70 220,100 228,70" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <rect x="212" y="68" width="16" height="4" fill="#ffffff"/>
  <text x="228" y="28" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="15" fill="#1f2937">
    <tspan x="228" dy="0">동그라미 짓이지?</tspan>
    <tspan x="228" dy="22">벌 서!</tspan>
  </text>

  <!-- 말풍선: 동그라미 -->
  <rect x="18" y="18" width="90" height="42" rx="14" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <polygon points="88,60 96,86 104,60" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <rect x="88" y="58" width="16" height="4" fill="#ffffff"/>
  <text x="63" y="44" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="16" fill="#1f2937">아니야!</text>
</svg>
