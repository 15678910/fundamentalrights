<svg viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="네모가 동그라미의 실수를 크게 웃으며 놀리고 동그라미가 시무룩해지는 장면">
  <title>네모가 동그라미의 실수를 크게 웃으며 놀리고 동그라미가 시무룩해지는 장면</title>
  <rect width="320" height="260" fill="#ffffff"/>
  <rect y="200" width="320" height="60" fill="#eef2f7"/>

  <!-- 동그라미 (시무룩, 눈물) -->
  <g transform="translate(100,206)">
