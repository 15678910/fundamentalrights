    <line x1="10" y1="-32" x2="11" y2="-3" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-11" cy="-2" rx="6" ry="3" fill="#1f2937"/>
    <ellipse cx="11" cy="-2" rx="6" ry="3" fill="#1f2937"/>
    <path d="M -27.98,-58.08 Q -30,-44 -28,-30" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/><circle cx="-28" cy="-30" r="4" fill="#1f2937"/>
    <path d="M 27.98,-58.08 Q 30,-44 28,-30" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/><circle cx="28" cy="-30" r="4" fill="#1f2937"/>
    <circle cx="0" cy="-57" r="28" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
    <path d="M -3,-85 Q 4,-96 -2,-101 Q -7,-105 -1,-109" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M -14,-58 c-3,4 -3,8 0,11 c3,-3 3,-7 0,-11 Z" fill="#60a5fa"/>
    <g fill="none" stroke="#1f2937" stroke-width="2"><circle cx="-9" cy="-61" r="7"/><circle cx="9" cy="-61" r="7"/><path d="M -2,-61 h4"/></g>
    <circle cx="-9" cy="-61" r="2.5" fill="#1f2937"/>
    <circle cx="9" cy="-61" r="2.5" fill="#1f2937"/>
    <line x1="-14" y1="-69" x2="-5" y2="-65" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <line x1="5" y1="-65" x2="14" y2="-69" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <path d="M -6,-46 Q 0,-51 6,-46" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
