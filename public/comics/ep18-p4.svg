<svg viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="세모가 쪽지를 무사히 전달하고 네모가 궁금함을 참으며 웃는 장면">
  <title>세모가 쪽지를 무사히 전달하고 네모가 궁금함을 참으며 웃는 장면</title>
  <rect width="320" height="260" fill="#ffffff"/>
  <rect y="200" width="320" height="60" fill="#eef2f7"/>

  <!-- 반짝임 -->
  <path d="M 285,30 L 288,38 L 296,41 L 288,44 L 285,52 L 282,44 L 274,41 L 282,38 Z" fill="#e11d2a" opacity="0.5"/>
  <path d="M 250,18 L 252,23 L 257,25 L 252,27 L 250,32 L 248,27 L 243,25 L 248,23 Z" fill="#e11d2a" opacity="0.35"/>

  <!-- 패널 번호 -->
  <circle cx="22" cy="22" r="13" fill="#e11d2a"/>
  <text x="22" y="27" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">4</text>

  <!-- 세모 (쪽지 전달) -->
  <g transform="translate(110,206)">
    <ellipse cx="0" cy="2" rx="24" ry="5" fill="#1f2937" opacity="0.08"/>
    <line x1="-8" y1="-35" x2="-10" y2="-4" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="8" y1="-35" x2="10" y2="-4" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-10" cy="-2" rx="6" ry="3" fill="#1f2937"/>
    <ellipse cx="10" cy="-2" rx="6" ry="3" fill="#1f2937"/>
    <polygon points="0,-100 -28,-35 28,-35" fill="#ffffff" stroke="#1f2937" stroke-width="3" stroke-linejoin="round"/>
    <path d="M -8,-98 L -13,-110" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <path d="M 0,-102 L 0,-115" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <path d="M 8,-98 L 13,-110" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <path d="M -24,-68 Q -32,-58 -30,-45" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 24,-70 Q 40,-64 50,-52" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <g transform="translate(50,-56)">
      <rect x="0" y="-8" width="22" height="16" rx="2" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
      <path d="M0,-8 L11,2 L22,-8" fill="none" stroke="#1f2937" stroke-width="1.5"/>
    </g>
    <circle cx="-11" cy="-75" r="7" fill="#ffffff" fill-opacity="0.5" stroke="#1f2937" stroke-width="2"/>
    <circle cx="11" cy="-75" r="7" fill="#ffffff" fill-opacity="0.5" stroke="#1f2937" stroke-width="2"/>
    <line x1="-4" y1="-75" x2="4" y2="-75" stroke="#1f2937" stroke-width="2"/>
    <circle cx="-11" cy="-75" r="1.6" fill="#1f2937"/>
    <circle cx="11" cy="-75" r="1.6" fill="#1f2937"/>
    <line x1="-16" y1="-84" x2="-6" y2="-86" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="-86" x2="16" y2="-84" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <path d="M -9,-59 Q 0,-51 9,-59" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 네모 (기쁘게 받음) -->
  <g transform="translate(220,206)">
    <ellipse cx="0" cy="2" rx="24" ry="5" fill="#1f2937" opacity="0.08"/>
    <line x1="-9" y1="-28" x2="-10" y2="-3" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <line x1="9" y1="-28" x2="10" y2="-3" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <rect x="-15" y="-6" width="9" height="6" rx="2" fill="#e11d2a"/>
    <rect x="6" y="-6" width="9" height="6" rx="2" fill="#e11d2a"/>
    <rect x="-25" y="-78" width="50" height="50" rx="9" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/>
    <polyline points="-21,-78 -15,-89 -8,-78 0,-90 8,-78 15,-89 21,-78" fill="none" stroke="#e11d2a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M -26,-60 Q -45,-56 -58,-48" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 26,-60 Q 20,-50 14,-46" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="-9" cy="-56" r="2.8" fill="#1f2937"/>
    <circle cx="9" cy="-56" r="2.8" fill="#1f2937"/>
    <line x1="-14" y1="-63" x2="-5" y2="-61" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <line x1="5" y1="-61" x2="14" y2="-63" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <path d="M -8,-47 Q 0,-40 8,-47" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 말풍선: 네모 -->
  <path d="M 156,10 H 284 A12,12 0 0 1 296,22 V 46 A12,12 0 0 1 284,58 H 229 L 220,90 L 211,58 H 156 A12,12 0 0 1 144,46 V 22 A12,12 0 0 1 156,10 Z" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="220" y="34" text-anchor="middle" dominant-baseline="middle" font-family="'Pretendard', sans-serif" font-size="16" fill="#1f2937">이제 알았어!</text>

  <!-- 캡션 -->
  <text x="160" y="250" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="12" fill="#64748b">제18조 통신의 비밀</text>
</svg>
