  <!-- 말풍선: 네모 (2줄) -->
  <path d="M 130,8 H 292 A14,14 0 0 1 306,22 V 56 A14,14 0 0 1 292,70 H 235 L 226,104 L 217,70 H 130 A14,14 0 0 1 116,56 V 22 A14,14 0 0 1 130,8 Z" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="211" y="39" text-anchor="middle" dominant-baseline="middle" font-family="'Pretendard', sans-serif" font-size="15" fill="#1f2937">
