    <line x1="5" y1="-58" x2="12" y2="-61" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <path d="M -6,-41 Q 0,-45 6,-41" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
