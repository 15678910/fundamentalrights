<svg viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="급식 시간, 동그라미가 식판을 보며 과일이 더 있으면 좋겠다고 아쉬워하는 장면">
  <title>급식 시간, 동그라미가 식판을 보며 과일이 더 있으면 좋겠다고 아쉬워하는 장면</title>
  <rect width="320" height="260" fill="#ffffff"/>
  <rect y="200" width="320" height="60" fill="#eef2f7"/>

  <!-- 상황 배지 -->
  <rect x="14" y="18" width="86" height="30" rx="15" fill="#fef3c7" stroke="#1f2937" stroke-width="2"/>
  <text x="57" y="38" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="13" font-weight="bold" fill="#1f2937">급식 시간</text>

  <!-- 동그라미 (식판을 보며 아쉬워함) -->
  <g transform="translate(220,206)">
    <ellipse cx="0" cy="2" rx="24" ry="5" fill="#1f2937" opacity="0.08"/>
    <line x1="-10" y1="-32" x2="-11" y2="-3" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="-32" x2="11" y2="-3" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-11" cy="-2" rx="6" ry="3" fill="#1f2937"/>
    <ellipse cx="11" cy="-2" rx="6" ry="3" fill="#1f2937"/>
    <circle cx="0" cy="-57" r="28" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
    <path d="M -3,-85 Q 4,-96 -2,-101 Q -7,-105 -1,-109" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M -27.98,-55.92 Q -24,-48 -18,-44" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="-18" cy="-44" r="4" fill="#1f2937"/>
    <path d="M 27.98,-55.92 Q 24,-48 18,-44" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="18" cy="-44" r="4" fill="#1f2937"/>
    <!-- 식판 -->
    <rect x="-22" y="-50" width="44" height="18" rx="3" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <line x1="-6" y1="-50" x2="-6" y2="-32" stroke="#94a3b8" stroke-width="1"/>
    <line x1="10" y1="-50" x2="10" y2="-32" stroke="#94a3b8" stroke-width="1"/>
    <circle cx="-14" cy="-40" r="4" fill="#e11d2a"/>
    <path d="M -14,-44 Q -11,-47 -9,-45" stroke="#166534" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <circle cx="-19" cy="-56" r="3" fill="#e11d2a" opacity="0.3"/>
    <circle cx="19" cy="-56" r="3" fill="#e11d2a" opacity="0.3"/>
    <g fill="none" stroke="#1f2937" stroke-width="2"><circle cx="-9" cy="-61" r="7"/><circle cx="9" cy="-61" r="7"/><path d="M -2,-61 h4"/></g>
    <circle cx="-9" cy="-61" r="2.5" fill="#1f2937"/>
    <circle cx="9" cy="-61" r="2.5" fill="#1f2937"/>
    <line x1="-6" y1="-70" x2="-13" y2="-68" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <line x1="13" y1="-68" x2="6" y2="-70" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <path d="M -5,-49 Q 0,-51 5,-49" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 말풍선: 동그라미 (2줄) -->
  <rect x="118" y="4" width="190" height="64" rx="14" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <polygon points="212,68 220,98 228,68" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <rect x="212" y="66" width="16" height="4" fill="#ffffff"/>
  <text x="213" y="28" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="15" fill="#1f2937">
    <tspan x="213" dy="0">과일이 더 있으면</tspan>
    <tspan x="213" dy="22">좋겠다…</tspan>
  </text>
</svg>
