<svg viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="교실 책상에서 지우개가 사라져 동그라미가 어리둥절해하는 장면">
  <title>교실 책상에서 지우개가 사라져 동그라미가 어리둥절해하는 장면</title>
  <rect width="320" height="260" fill="#ffffff"/>
  <rect y="200" width="320" height="60" fill="#eef2f7"/>

  <!-- 책상 -->
  <line x1="78" y1="215" x2="78" y2="240" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
  <line x1="142" y1="215" x2="142" y2="240" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
  <rect x="70" y="205" width="80" height="10" rx="2" fill="#e8ded0" stroke="#1f2937" stroke-width="2"/>

  <!-- 사라진 지우개 자리 -->
  <rect x="95" y="192" width="28" height="13" rx="2" fill="none" stroke="#e11d2a" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="109" y="178" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="26" font-weight="bold" fill="#e11d2a">?</text>

  <!-- 동그라미 (어리둥절) -->
  <g transform="translate(230,206)">
    <ellipse cx="0" cy="2" rx="22" ry="5" fill="#1f2937" opacity="0.08"/>
    <line x1="-9" y1="-28" x2="-10" y2="-3" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="9" y1="-28" x2="10" y2="-3" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-10" cy="-2" rx="5.5" ry="3" fill="#1f2937"/>
    <ellipse cx="10" cy="-2" rx="5.5" ry="3" fill="#1f2937"/>
    <path d="M -25.76,-51.49 Q -26,-40 -24,-28" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/><circle cx="-24" cy="-28" r="4" fill="#1f2937"/>
    <path d="M 25.97,-56.18 Q 30,-64 24,-73" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/><circle cx="24" cy="-73" r="4" fill="#1f2937"/>
    <circle cx="0" cy="-55" r="26" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
    <path d="M -3,-81 Q 4,-92 -2,-97 Q -7,-101 -1,-105" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="-18" cy="-54" r="3" fill="#e11d2a" opacity="0.3"/>
    <circle cx="18" cy="-54" r="3" fill="#e11d2a" opacity="0.3"/>
    <g fill="none" stroke="#1f2937" stroke-width="2"><circle cx="-8" cy="-59" r="7"/><circle cx="8" cy="-59" r="7"/><path d="M -1,-59 h2"/></g>
    <circle cx="-8" cy="-59" r="2.4" fill="#1f2937"/>
    <circle cx="8" cy="-59" r="2.4" fill="#1f2937"/>
    <line x1="-12" y1="-64" x2="-5" y2="-63" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <line x1="5" y1="-68" x2="12" y2="-71" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="0" cy="-48" rx="3.5" ry="4.5" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  </g>

  <!-- 말풍선: 동그라미 -->
  <path d="M 114,10 H 293 A14,14 0 0 1 307,24 V 46 A14,14 0 0 1 293,60 H 244 L 235,100 L 226,60 H 114 A14,14 0 0 1 100,46 V 24 A14,14 0 0 1 114,10 Z" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="204" y="35" text-anchor="middle" dominant-baseline="middle" font-family="'Pretendard', sans-serif" font-size="15" fill="#1f2937">내 지우개 어디 갔지?</text>
</svg>
