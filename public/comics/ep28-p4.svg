<svg viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="네모가 아이스크림을 건네고 동그라미와 화해하며 웃는 장면">
  <title>네모가 아이스크림을 건네고 동그라미와 화해하며 웃는 장면</title>
  <rect width="320" height="260" fill="#ffffff"/>
  <rect y="200" width="320" height="60" fill="#eef2f7"/>

  <!-- 반짝임 -->
  <path d="M 268,26 L 271,34 L 279,37 L 271,40 L 268,48 L 265,40 L 257,37 L 265,34 Z" fill="#e11d2a" opacity="0.5"/>
  <path d="M 40,20 L 42,25 L 47,27 L 42,29 L 40,34 L 38,29 L 33,27 L 38,25 Z" fill="#e11d2a" opacity="0.35"/>

  <!-- 패널 번호 -->
  <circle cx="22" cy="22" r="13" fill="#e11d2a"/>
  <text x="22" y="27" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">4</text>

  <!-- 아이스크림 -->
  <g transform="translate(170,150)">
    <polygon points="0,30 -9,4 9,4" fill="#f3f4f6" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/>
    <line x1="-5" y1="10" x2="2" y2="24" stroke="#1f2937" stroke-width="1"/>
    <line x1="5" y1="10" x2="-2" y2="24" stroke="#1f2937" stroke-width="1"/>
    <circle cx="0" cy="-6" r="11" fill="#e11d2a" stroke="#1f2937" stroke-width="2"/>
    <path d="M -5,-9 Q 0,-13 5,-9" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- 동그라미 (기쁘게 받음) -->
  <g transform="translate(80,206)">
    <ellipse cx="0" cy="2" rx="24" ry="5" fill="#1f2937" opacity="0.08"/>
    <line x1="-10" y1="-32" x2="-11" y2="-3" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="-32" x2="11" y2="-3" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-11" cy="-2" rx="6" ry="3" fill="#1f2937"/>
    <ellipse cx="11" cy="-2" rx="6" ry="3" fill="#1f2937"/>
    <circle cx="0" cy="-57" r="28" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
    <path d="M -3,-85 Q 4,-96 -2,-101 Q -7,-105 -1,-109" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M -26,-60 Q -22,-50 -16,-45" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="-16" cy="-45" r="4" fill="#1f2937"/>
    <path d="M 26,-58 Q 44,-56 60,-48" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="60" cy="-48" r="4" fill="#1f2937"/>
    <circle cx="-19" cy="-56" r="3" fill="#e11d2a" opacity="0.3"/>
    <circle cx="19" cy="-56" r="3" fill="#e11d2a" opacity="0.3"/>
    <circle cx="-9" cy="-61" r="2.5" fill="#1f2937"/>
    <circle cx="9" cy="-61" r="2.5" fill="#1f2937"/>
    <g fill="none" stroke="#1f2937" stroke-width="2"><circle cx="-9" cy="-61" r="7"/><circle cx="9" cy="-61" r="7"/><path d="M -2,-61 h4"/></g>
    <line x1="-13" y1="-68" x2="-6" y2="-66" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="-66" x2="13" y2="-68" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <path d="M -6,-52 Q -1,-49 5,-53" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 네모 (아이스크림 건넴) -->
  <g transform="translate(230,206)">
    <ellipse cx="0" cy="2" rx="26" ry="5" fill="#1f2937" opacity="0.08"/>
    <line x1="-10" y1="-30" x2="-13" y2="-3" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="-30" x2="14" y2="-3" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <rect x="-19" y="-6" width="10" height="6" rx="2" fill="#e11d2a"/>
    <rect x="9" y="-6" width="10" height="6" rx="2" fill="#e11d2a"/>
    <rect x="-28" y="-85" width="56" height="56" rx="10" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/>
    <path d="M -19,-85 q6 -12 12 -4 q6 -12 12 -4 q6 -10 12 -2" fill="none" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <path d="M -26,-60 Q -46,-58 -62,-50" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <rect x="-70" y="-54" width="8" height="8" rx="3" fill="#e11d2a"/>
    <path d="M 26,-68 Q 30,-56 24,-48" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="-10" cy="-62" r="3.2" fill="#1f2937"/>
    <circle cx="10" cy="-62" r="3.2" fill="#1f2937"/>
    <g fill="none" stroke="#1f2937" stroke-width="2"><circle cx="-10" cy="-62" r="7"/><circle cx="10" cy="-62" r="7"/><path d="M -3,-62 h6"/></g>
    <line x1="-15" y1="-72" x2="-6" y2="-69" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="-69" x2="15" y2="-72" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <path d="M -7,-49 Q 0,-45 7,-49" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 말풍선: 동그라미 -->
  <rect x="18" y="18" width="96" height="42" rx="14" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <polygon points="52,60 72,60 66,92" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <rect x="53" y="58" width="18" height="4" fill="#ffffff"/>
  <text x="66" y="41" text-anchor="middle" dominant-baseline="middle" font-family="'Pretendard', sans-serif" font-size="16" fill="#1f2937">고마워!</text>

  <!-- 캡션 -->
  <text x="160" y="250" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="12" fill="#64748b">제28조 형사보상청구권</text>
</svg>
