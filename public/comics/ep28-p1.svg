<svg viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="동그라미가 억울하게 화단 청소 벌을 받으며 빗자루를 든 채 시무룩해하는 장면">
  <title>동그라미가 억울하게 화단 청소 벌을 받으며 빗자루를 든 채 시무룩해하는 장면</title>
  <rect width="320" height="260" fill="#ffffff"/>
  <rect y="200" width="320" height="60" fill="#eef2f7"/>

  <!-- 화단 선반 (배경) -->
  <rect x="14" y="52" width="100" height="10" rx="2" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/>
  <g transform="translate(38,52)">
    <polygon points="-9,10 9,10 6,-4 -6,-4" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/>
    <path d="M -4,-4 Q -8,-16 -1,-22" stroke="#1f2937" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 4,-4 Q 8,-16 1,-22" stroke="#1f2937" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="-1" cy="-22" r="3" fill="#e11d2a" opacity="0.7"/>
  </g>
  <g transform="translate(88,52)">
    <polygon points="-9,10 9,10 6,-4 -6,-4" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/>
    <path d="M -4,-4 Q -8,-16 -1,-22" stroke="#1f2937" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 4,-4 Q 8,-16 1,-22" stroke="#1f2937" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="1" cy="-22" r="3" fill="#e11d2a" opacity="0.7"/>
  </g>

  <!-- 패널 번호 -->
  <circle cx="298" cy="22" r="13" fill="#e11d2a"/>
  <text x="298" y="27" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">1</text>

  <!-- 동그라미 (빗자루 들고 시무룩) -->
  <g transform="translate(150,206)">
    <ellipse cx="0" cy="2" rx="24" ry="5" fill="#1f2937" opacity="0.08"/>
    <line x1="-10" y1="-32" x2="-11" y2="-3" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="-32" x2="11" y2="-3" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-11" cy="-2" rx="6" ry="3" fill="#1f2937"/>
    <ellipse cx="11" cy="-2" rx="6" ry="3" fill="#1f2937"/>
    <circle cx="0" cy="-57" r="28" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
    <path d="M -3,-85 Q 4,-96 -2,-101 Q -7,-105 -1,-109" stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M -26,-60 Q -20,-48 -13,-44" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 26,-60 Q 32,-52 34,-47" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="-13" cy="-44" r="4" fill="#1f2937"/>
    <circle cx="34" cy="-47" r="4" fill="#1f2937"/>
    <circle cx="-19" cy="-56" r="3" fill="#e11d2a" opacity="0.3"/>
    <circle cx="19" cy="-56" r="3" fill="#e11d2a" opacity="0.3"/>
    <circle cx="-9" cy="-61" r="2.5" fill="#1f2937"/>
    <circle cx="9" cy="-61" r="2.5" fill="#1f2937"/>
    <g fill="none" stroke="#1f2937" stroke-width="2"><circle cx="-9" cy="-61" r="7"/><circle cx="9" cy="-61" r="7"/><path d="M -2,-61 h4"/></g>
    <line x1="-13" y1="-64" x2="-6" y2="-69" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="-69" x2="13" y2="-64" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <path d="M -6,-48 Q 0,-53 6,-48" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- 빗자루 -->
    <line x1="10" y1="-98" x2="58" y2="4" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <rect x="52" y="-2" width="12" height="6" rx="2" fill="#e11d2a"/>
    <line x1="58" y1="4" x2="48" y2="15" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <line x1="58" y1="4" x2="58" y2="17" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <line x1="58" y1="4" x2="68" y2="15" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- 말풍선 -->
  <rect x="150" y="8" width="160" height="46" rx="14" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <polygon points="168,54 188,54 176,92" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <rect x="169" y="52" width="18" height="4" fill="#ffffff"/>
  <text x="230" y="35" text-anchor="middle" dominant-baseline="middle" font-family="'Pretendard', sans-serif" font-size="16" fill="#1f2937">나 안 그랬는데…</text>
</svg>
