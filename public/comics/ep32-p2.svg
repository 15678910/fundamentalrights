    <path d="M 25,-58 Q 32,-52 34,-44" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="-30" cy="-40" r="4" fill="#1f2937"/>
    <circle cx="34" cy="-44" r="4" fill="#1f2937"/>
    <circle cx="-19" cy="-56" r="3" fill="#e11d2a" opacity="0.25"/>
    <circle cx="19" cy="-56" r="3" fill="#e11d2a" opacity="0.25"/>
