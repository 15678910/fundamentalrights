  <g transform="translate(138,130) scale(0.62)">
    <polygon points="35,10 0,100 70,100" fill="#ffffff" stroke="#1f2937" stroke-width="3" stroke-linejoin="round"/>
    <line x1="25" y1="8" x2="20" y2="-10" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <line x1="35" y1="5" x2="35" y2="-14" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <line x1="45" y1="8" x2="50" y2="-10" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <circle cx="22" cy="45" r="7" fill="none" stroke="#1f2937" stroke-width="2"/>
    <circle cx="48" cy="45" r="7" fill="none" stroke="#1f2937" stroke-width="2"/>
    <line x1="29" y1="45" x2="41" y2="45" stroke="#1f2937" stroke-width="2"/>
    <circle cx="22" cy="45" r="1.6" fill="#1f2937"/>
    <circle cx="48" cy="45" r="1.6" fill="#1f2937"/>
    <line x1="14" y1="33" x2="28" y2="31" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="42" y1="31" x2="56" y2="33" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <path d="M27,60 Q35,67 43,60" stroke="#1f2937" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="16" cy="55" r="5" fill="#e11d2a" opacity=".3"/>
    <circle cx="54" cy="55" r="5" fill="#e11d2a" opacity=".3"/>
    <line x1="5" y1="60" x2="-15" y2="75" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="65" y1="60" x2="85" y2="75" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-15" cy="75" r="4" fill="#1f2937"/>
    <circle cx="85" cy="75" r="4" fill="#1f2937"/>
    <line x1="15" y1="100" x2="15" y2="122" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="55" y1="100" x2="55" y2="122" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="15" cy="125" rx="8" ry="4" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <ellipse cx="55" cy="125" rx="8" ry="4" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
