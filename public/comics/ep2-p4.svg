    <g fill="none" stroke="#1f2937" stroke-width="2"><circle cx="24" cy="38" r="7"/><circle cx="46" cy="38" r="7"/><path d="M 31,38 h8"/></g>
    <circle cx="24" cy="38" r="3" fill="#1f2937"/>
    <circle cx="46" cy="38" r="3" fill="#1f2937"/>
    <line x1="16" y1="26" x2="30" y2="24" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="40" y1="24" x2="54" y2="26" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <path d="M22,50 Q35,62 48,50" stroke="#1f2937" stroke-width="3" fill="none" stroke-linecap="round"/>
    <line x1="0" y1="50" x2="-18" y2="66" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="70" y1="50" x2="88" y2="66" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-18" cy="66" r="4" fill="#1f2937"/>
    <circle cx="88" cy="66" r="4" fill="#1f2937"/>
    <line x1="22" y1="75" x2="22" y2="95" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="48" y1="75" x2="48" y2="95" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="22" cy="98" rx="8" ry="4" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <ellipse cx="48" cy="98" rx="8" ry="4" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  </g>

  <!-- 말풍선 (네모의 사과) -->
  <polygon points="48,86 70,86 55,135" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <rect x="10" y="18" width="180" height="68" rx="14" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="15" fill="#1f2937">
    <tspan x="100" y="46">미안해. 네 모습</tspan>
    <tspan x="100" y="68">그대로 멋져!</tspan>
  </text>

  <!-- 캡션 -->
  <text x="160" y="248" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="12" fill="#64748b">제10조 인간의 존엄과 가치</text>
</svg>
