  <!-- 네모 (사과) -->
  <g transform="translate(33,152) scale(0.62) rotate(5,35,35)">
    <rect x="0" y="0" width="70" height="70" rx="10" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/>
    <path d="M 10,0 q8 -16 16 -5 q8 -16 16 -5 q8 -13 16 -3" fill="none" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <g fill="none" stroke="#1f2937" stroke-width="2"><circle cx="22" cy="28" r="7"/><circle cx="48" cy="28" r="7"/><path d="M 29,28 h12"/></g>
    <circle cx="22" cy="28" r="3" fill="#1f2937"/>
    <circle cx="48" cy="28" r="3" fill="#1f2937"/>
    <line x1="14" y1="14" x2="28" y2="20" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="42" y1="20" x2="56" y2="14" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <path d="M20,40 Q35,48 50,40" stroke="#1f2937" stroke-width="3" fill="none" stroke-linecap="round"/>
    <line x1="0" y1="35" x2="-20" y2="50" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-23" cy="53" r="7" fill="#e11d2a"/>
    <line x1="70" y1="35" x2="90" y2="50" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <circle cx="93" cy="53" r="7" fill="#e11d2a"/>
    <line x1="18" y1="70" x2="18" y2="86" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <line x1="52" y1="70" x2="52" y2="86" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="18" cy="89" rx="9" ry="5" fill="#e11d2a"/>
    <ellipse cx="52" cy="89" rx="9" ry="5" fill="#e11d2a"/>
  </g>

