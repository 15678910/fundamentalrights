<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="청원권">
  <title>청원권</title>
  <rect width="120" height="120" rx="26" fill="#fbf1da"/>
  <!-- Document / petition paper -->
  <rect x="28" y="24" width="58" height="72" rx="9" fill="#ffffff" stroke="#ca8a04" stroke-width="2.2"/>
  <!-- Document header bar -->
  <rect x="28" y="24" width="58" height="14" rx="9" fill="#ca8a04"/>
  <rect x="28" y="30" width="58" height="8" fill="#ca8a04"/>
  <!-- Lines on petition (text lines) -->
  <rect x="36" y="46" width="36" height="3" rx="1.5" fill="#fde68a"/>
  <rect x="36" y="52" width="32" height="3" rx="1.5" fill="#fde68a"/>
  <rect x="36" y="58" width="34" height="3" rx="1.5" fill="#fde68a"/>
  <rect x="36" y="64" width="28" height="3" rx="1.5" fill="#fde68a"/>
  <!-- Signature line -->
  <rect x="36" y="76" width="30" height="2" rx="1" fill="#ca8a04" opacity="0.5"/>
  <!-- Pen -->
  <rect x="72" y="58" width="7" height="34" rx="3.5" fill="#ca8a04" transform="rotate(-30 72 58)"/>
  <polygon points="78,92 82,100 74,96" fill="#1f2937"/>
  <!-- Pen grip ring -->
  <rect x="72" y="79" width="7" height="4" rx="2" fill="#f59e0b" transform="rotate(-30 72 79)"/>
  <!-- Small raised hand (petition / request gesture) -->
  <!-- Palm -->
  <ellipse cx="86" cy="40" rx="9" ry="7" fill="#fcd9b6" transform="rotate(-15 86 40)"/>
  <!-- Thumb -->
  <path d="M79 42 Q72 36 76 30 Q80 24 84 30" stroke="#fcd9b6" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- Fingers together pointing up -->
  <rect x="80" y="26" width="5" height="16" rx="2.5" fill="#fcd9b6" transform="rotate(10 80 26)"/>
  <rect x="86" y="24" width="5" height="17" rx="2.5" fill="#fcd9b6" transform="rotate(5 86 24)"/>
  <rect x="92" y="27" width="5" height="15" rx="2.5" fill="#fcd9b6" transform="rotate(-5 92 27)"/>
</svg>
