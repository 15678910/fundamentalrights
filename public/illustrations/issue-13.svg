<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="정교분리와 정당 속의 종교">
  <title>정교분리와 정당 속의 종교</title>
  <rect width="120" height="120" rx="26" fill="#f0ecf9"/>
  <!-- state building (left): columns and pediment -->
  <path d="M16 52 L42 38 L68 52 Z" fill="#7c3aed"/>
  <rect x="20" y="54" width="44" height="34" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
  <g fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5">
    <rect x="25" y="59" width="7" height="29"/>
    <rect x="38" y="59" width="7" height="29"/>
    <rect x="51" y="59" width="7" height="29"/>
  </g>
  <!-- worship house (right): abstract building with candle flame (no specific religion) -->
  <path d="M76 56 q14 -16 28 0 v32 h-28 Z" fill="#ffffff" stroke="#0891b2" stroke-width="3" stroke-linejoin="round"/>
  <path d="M90 44 q-4 6 0 10 q4 -4 0 -10" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
  <rect x="85" y="72" width="10" height="16" rx="4" fill="#0891b2" opacity="0.25"/>
  <!-- separation: vertical dashed line between them -->
  <line x1="71" y1="34" x2="71" y2="92" stroke="#dc2626" stroke-width="3" stroke-dasharray="6 5" stroke-linecap="round"/>
  <!-- question mark above the line -->
  <text x="71" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#dc2626" font-family="sans-serif">?</text>
  <!-- ground -->
  <ellipse cx="60" cy="102" rx="40" ry="6" fill="#7c3aed" opacity="0.12"/>
</svg>
