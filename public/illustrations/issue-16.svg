<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="선거 연령과 청소년 참정권">
  <title>선거 연령과 청소년 참정권</title>
  <rect width="120" height="120" rx="26" fill="#eef2ff"/>
  <!-- ballot box -->
  <rect x="30" y="58" width="60" height="40" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="3"/>
  <rect x="48" y="52" width="24" height="7" rx="3.5" fill="#4f46e5"/>
  <circle cx="60" cy="80" r="9" fill="none" stroke="#4f46e5" stroke-width="3"/>
  <path d="M56 80 l3 3 l6 -7" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- ballot paper sliding in -->
  <g transform="rotate(-14 62 34)">
    <rect x="48" y="24" width="28" height="20" rx="3" fill="#ffffff" stroke="#f59e0b" stroke-width="3"/>
    <path d="M54 31 h16 M54 37 h10" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- young hand reaching -->
  <path d="M18 44 q10 -8 22 -6" fill="none" stroke="#fcd9b6" stroke-width="9" stroke-linecap="round"/>
  <!-- age tag 18 -> 16? -->
  <g font-family="sans-serif" font-weight="700">
    <text x="94" y="40" font-size="15" fill="#4f46e5" text-anchor="middle">18</text>
    <text x="94" y="56" font-size="11" fill="#94a3b8" text-anchor="middle">16?</text>
  </g>
</svg>
