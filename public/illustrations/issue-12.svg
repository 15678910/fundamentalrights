<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="입시 제도와 기회의 균등">
  <title>입시 제도와 기회의 균등</title>
  <rect width="120" height="120" rx="26" fill="#eef4ff"/>
  <!-- graduation cap at top -->
  <path d="M60 18 L88 28 L60 38 L32 28 Z" fill="#1f2937"/>
  <path d="M74 32 v10 q0 6 -14 6 q-14 0 -14 -6 v-10" fill="none" stroke="#1f2937" stroke-width="3"/>
  <path d="M86 29 v12" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="86" cy="44" r="2.5" fill="#f59e0b"/>
  <!-- two runners on different starting blocks -->
  <!-- track line -->
  <path d="M14 96 h92" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
  <!-- left figure: starts on low block -->
  <rect x="20" y="88" width="16" height="8" rx="2" fill="#93c5fd"/>
  <circle cx="28" cy="70" r="6.5" fill="#fcd9b6"/>
  <rect x="23" y="77" width="10" height="11" rx="5" fill="#2563eb"/>
  <!-- right figure: starts on tall stacked blocks (head start) -->
  <rect x="80" y="88" width="16" height="8" rx="2" fill="#93c5fd"/>
  <rect x="80" y="79" width="16" height="8" rx="2" fill="#60a5fa"/>
  <rect x="80" y="70" width="16" height="8" rx="2" fill="#3b82f6"/>
  <circle cx="88" cy="52" r="6.5" fill="#fcd9b6"/>
  <rect x="83" y="59" width="10" height="11" rx="5" fill="#16a34a"/>
  <!-- question: equals sign with ? -->
  <g stroke="#dc2626" stroke-width="3.5" stroke-linecap="round">
    <path d="M52 66 h16"/>
    <path d="M52 74 h16"/>
  </g>
  <text x="55" y="60" font-size="13" font-weight="bold" fill="#dc2626" font-family="sans-serif">?</text>
  <ellipse cx="60" cy="106" rx="38" ry="5" fill="#2563eb" opacity="0.12"/>
</svg>
