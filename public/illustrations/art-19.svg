<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="양심의 자유">
  <title>양심의 자유</title>
  <rect width="120" height="120" rx="26" fill="#e0f5fa"/>
  <!-- Head / profile silhouette -->
  <circle cx="52" cy="52" r="30" fill="#fcd9b6"/>
  <!-- Ear -->
  <ellipse cx="23" cy="52" rx="5" ry="8" fill="#fcd9b6"/>
  <!-- Hair top -->
  <path d="M28 38 Q38 20 60 22 Q76 24 78 38 Q76 30 60 30 Q40 30 28 38Z" fill="#1f2937"/>
  <!-- Face cut-off on right side (profile direction) -->
  <circle cx="52" cy="52" r="30" fill="#fcd9b6"/>
  <!-- Simple face features -->
  <circle cx="44" cy="48" r="3" fill="#1f2937"/>
  <circle cx="45" cy="47" r="1" fill="#ffffff"/>
  <!-- Nose bridge -->
  <path d="M48 52 Q46 58 48 62" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4"/>
  <!-- Cheek blush -->
  <circle cx="38" cy="58" r="5" fill="#f59e0b" opacity="0.3"/>
  <!-- Inner glow area in head — where the heart/conviction lives -->
  <circle cx="64" cy="54" r="18" fill="#0891b2" opacity="0.15"/>
  <!-- Heart inside (inner conviction) -->
  <path d="M64 64 C64 64 54 56 54 49.5 C54 46 56.7 44 60 44 C61.2 44 62.3 44.5 63 45.3 L64 46.5 L65 45.3 C65.7 44.5 66.8 44 68 44 C71.3 44 74 46 74 49.5 C74 56 64 64 64 64Z" fill="#0891b2"/>
  <!-- Spark / inner light rays -->
  <line x1="64" y1="28" x2="64" y2="34" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="76" y1="32" x2="73" y2="37" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="84" y1="42" x2="79" y2="44" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="52" y1="32" x2="55" y2="37" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
</svg>
