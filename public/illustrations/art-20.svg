<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="종교의 자유">
  <title>종교의 자유</title>
  <rect width="120" height="120" rx="26" fill="#e0f5fa"/>
  <!-- Left hand (palm up) -->
  <path d="M24 80 Q22 68 28 62 Q32 58 36 62 L40 72" stroke="#fcd9b6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Left palm base -->
  <ellipse cx="36" cy="76" rx="14" ry="10" fill="#fcd9b6"/>
  <!-- Left fingers -->
  <rect x="25" y="64" width="7" height="16" rx="3.5" fill="#fcd9b6"/>
  <rect x="33" y="60" width="7" height="18" rx="3.5" fill="#fcd9b6"/>
  <rect x="41" y="62" width="7" height="17" rx="3.5" fill="#fcd9b6"/>
  <!-- Right hand (palm up, mirrored) -->
  <path d="M96 80 Q98 68 92 62 Q88 58 84 62 L80 72" stroke="#fcd9b6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Right palm base -->
  <ellipse cx="84" cy="76" rx="14" ry="10" fill="#fcd9b6"/>
  <!-- Right fingers -->
  <rect x="88" y="64" width="7" height="16" rx="3.5" fill="#fcd9b6"/>
  <rect x="80" y="60" width="7" height="18" rx="3.5" fill="#fcd9b6"/>
  <rect x="72" y="62" width="7" height="17" rx="3.5" fill="#fcd9b6"/>
  <!-- Flame above hands — calm, neutral spiritual symbol -->
  <!-- Outer flame -->
  <path d="M60 26 C60 26 44 40 44 56 C44 66 51.2 74 60 74 C68.8 74 76 66 76 56 C76 40 60 26 60 26Z" fill="#f59e0b"/>
  <!-- Inner flame -->
  <path d="M60 38 C60 38 52 48 52 56 C52 61.5 55.6 66 60 66 C64.4 66 68 61.5 68 56 C68 48 60 38 60 38Z" fill="#ffffff" opacity="0.7"/>
  <!-- Core glow -->
  <ellipse cx="60" cy="58" rx="5" ry="7" fill="#0891b2" opacity="0.5"/>
</svg>
