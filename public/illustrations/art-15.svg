<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="제15조 - 직업선택의 자유">
  <title>제15조 - 직업선택의 자유</title>
  <rect width="120" height="120" rx="26" fill="#e0f5fa"/>
  <!-- Central figure (small, deciding) -->
  <circle cx="60" cy="46" r="12" fill="#fcd9b6"/>
  <!-- Hair -->
  <ellipse cx="60" cy="35" rx="10" ry="5.5" fill="#1f2937"/>
  <ellipse cx="50" cy="39" rx="4.5" ry="4" fill="#1f2937"/>
  <ellipse cx="70" cy="39" rx="4.5" ry="4" fill="#1f2937"/>
  <!-- Eyes (looking left with curiosity) -->
  <circle cx="55" cy="45" r="2.5" fill="#1f2937"/>
  <circle cx="65" cy="45" r="2.5" fill="#1f2937"/>
  <circle cx="54" cy="44.2" r="0.9" fill="#ffffff"/>
  <circle cx="64" cy="44.2" r="0.9" fill="#ffffff"/>
  <!-- Smile -->
  <path d="M55.5 51 Q60 55 64.5 51" stroke="#1f2937" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <!-- Body -->
  <rect x="52" y="58" width="16" height="20" rx="7" fill="#0891b2"/>
  <!-- Option 1: Briefcase (left) - career/office -->
  <rect x="14" y="54" width="30" height="24" rx="6" fill="#0891b2"/>
  <!-- Briefcase handle -->
  <path d="M22 54 Q22 48 29 48 Q36 48 36 54" stroke="#0891b2" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <!-- Briefcase latch -->
  <rect x="27" y="63" width="6" height="5" rx="2" fill="#bae6fd"/>
  <!-- Briefcase line -->
  <rect x="14" y="66" width="30" height="3" rx="1.5" fill="#0e7490" opacity="0.5"/>
  <!-- Option 2: Wrench / tool (right) - manual/craft -->
  <rect x="76" y="52" width="30" height="28" rx="8" fill="#f59e0b"/>
  <!-- Wrench shape inside box -->
  <!-- Wrench head circle (left) -->
  <circle cx="86" cy="62" r="8" fill="none" stroke="#ffffff" stroke-width="3.5"/>
  <circle cx="86" cy="62" r="3.5" fill="#f59e0b"/>
  <!-- Wrench handle -->
  <rect x="90" y="60" width="14" height="5" rx="2.5" fill="#ffffff"/>
  <!-- Arrow left (pointing to briefcase) -->
  <path d="M52 64 Q42 60 46 56" stroke="#0891b2" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.5"/>
  <!-- Arrow right (pointing to wrench box) -->
  <path d="M68 64 Q78 60 74 56" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.5"/>
  <!-- Question mark / choice sparkle above figure -->
  <circle cx="60" cy="28" r="5" fill="#f59e0b" opacity="0.6"/>
  <circle cx="60" cy="20" r="3.5" fill="#0891b2" opacity="0.5"/>
  <!-- Ground -->
  <rect x="18" y="90" width="84" height="5" rx="2.5" fill="#0891b2" opacity="0.15"/>
  <!-- Legs -->
  <rect x="53" y="76" width="6" height="16" rx="3" fill="#0891b2"/>
  <rect x="61" y="76" width="6" height="16" rx="3" fill="#0891b2"/>
</svg>
