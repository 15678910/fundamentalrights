<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="이주 노동자와 기본권">
  <title>이주 노동자와 기본권</title>
  <rect width="120" height="120" rx="26" fill="#e0f2fe"/>
  <!-- globe -->
  <circle cx="44" cy="46" r="24" fill="#bae6fd" stroke="#0369a1" stroke-width="3"/>
  <ellipse cx="44" cy="46" rx="10" ry="24" fill="none" stroke="#0369a1" stroke-width="2.2"/>
  <path d="M20 46 h48 M24 34 h40 M24 58 h40" stroke="#0369a1" stroke-width="2.2" fill="none"/>
  <!-- three people of different colors, arms linked -->
  <g stroke-width="2.5" stroke-linejoin="round">
    <circle cx="66" cy="76" r="7" fill="#fcd34d" stroke="#92400e"/>
    <path d="M55 102 v-10 a11 11 0 0 1 22 0 v10 Z" fill="#f59e0b" stroke="#92400e"/>
    <circle cx="86" cy="72" r="7" fill="#c4b5fd" stroke="#5b21b6"/>
    <path d="M75 100 v-12 a11 11 0 0 1 22 0 v12 Z" fill="#8b5cf6" stroke="#5b21b6"/>
    <circle cx="104" cy="78" r="6.5" fill="#fca5a5" stroke="#991b1b"/>
    <path d="M94 102 v-9 a10 10 0 0 1 20 0 v9 Z" fill="#ef4444" stroke="#991b1b"/>
  </g>
  <!-- shield of rights above them -->
  <path d="M86 26 l14 5 v10 c0 8 -6 13 -14 16 c-8 -3 -14 -8 -14 -16 v-10 Z" fill="#ffffff" stroke="#0e7490" stroke-width="3" stroke-linejoin="round"/>
  <path d="M79 42 l5 5 l10 -11" stroke="#0e7490" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
