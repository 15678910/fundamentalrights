  <path d="M60 96 C60 96 22 72 22 48 C22 36 31 28 42 28 C50 28 57 33 60 38 C63 33 70 28 78 28 C89 28 98 36 98 48 C98 72 60 96 60 96 Z" fill="#fce7f3"/>
