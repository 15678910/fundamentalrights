<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="혼인·가족·보건">
  <title>혼인·가족·보건</title>
  <rect width="120" height="120" rx="26" fill="#fde7f1"/>
