  <circle cx="31" cy="55" r="1.5" fill="#1f2937"/>
  <circle cx="37" cy="55" r="1.5" fill="#1f2937"/>
  <!-- Adult left smile -->
  <path d="M30 60 Q34 63 38 60" stroke="#1f2937" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Adult right body -->
  <rect x="76" y="70" width="20" height="30" rx="8" fill="#be185d"/>
  <!-- Adult right head -->
  <circle cx="86" cy="57" r="10" fill="#fcd9b6"/>
  <!-- Adult right hair short -->
  <path d="M76 52 Q76 44 86 44 Q96 44 96 52" fill="#1f2937"/>
  <!-- Adult right eyes -->
  <circle cx="83" cy="55" r="1.5" fill="#1f2937"/>
  <circle cx="89" cy="55" r="1.5" fill="#1f2937"/>
  <!-- Adult right smile -->
  <path d="M82 60 Q86 63 90 60" stroke="#1f2937" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Child body center -->
  <rect x="50" y="78" width="20" height="22" rx="7" fill="#f9a8d4"/>
  <!-- Child head -->
  <circle cx="60" cy="67" r="9" fill="#fcd9b6"/>
  <!-- Child eyes -->
  <circle cx="57" cy="66" r="1.5" fill="#1f2937"/>
  <circle cx="63" cy="66" r="1.5" fill="#1f2937"/>
