  <path d="M56 71 Q60 75 64 71" stroke="#1f2937" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Child hair tufts -->
  <rect x="54" y="58" width="5" height="6" rx="2.5" fill="#f59e0b" transform="rotate(-15 57 61)"/>
  <rect x="61" y="58" width="5" height="6" rx="2.5" fill="#f59e0b" transform="rotate(15 63 61)"/>

  <!-- Heart floating above -->
  <path d="M52 32 C52 29 56 27 58 30 C60 27 64 29 64 32 C64 36 58 40 58 40 C58 40 52 36 52 32 Z" fill="#db2777"/>
  <path d="M62 28 C62 25 66 23 68 26 C70 23 74 25 74 28 C74 32 68 36 68 36 C68 36 62 32 62 28 Z" fill="#db2777" opacity="0.6"/>
