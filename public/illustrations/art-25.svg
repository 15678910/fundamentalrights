<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="공무담임권">
  <title>공무담임권</title>
  <rect width="120" height="120" rx="26" fill="#e4f7ec"/>
  <!-- Podium base -->
  <rect x="34" y="84" width="52" height="22" rx="8" fill="#16a34a"/>
  <!-- Podium face panel -->
  <rect x="40" y="75" width="40" height="16" rx="6" fill="#14532d"/>
  <!-- Podium highlight -->
  <rect x="46" y="80" width="28" height="4" rx="2" fill="#16a34a" opacity="0.55"/>
  <!-- Figure body -->
  <rect x="50" y="55" width="20" height="24" rx="9" fill="#16a34a"/>
  <!-- Figure head -->
  <circle cx="60" cy="45" r="14" fill="#fcd9b6"/>
  <!-- Eyes -->
  <circle cx="55" cy="43" r="2.5" fill="#1f2937"/>
  <circle cx="65" cy="43" r="2.5" fill="#1f2937"/>
  <!-- Eye shine -->
  <circle cx="56" cy="42" r="0.9" fill="#ffffff"/>
  <circle cx="66" cy="42" r="0.9" fill="#ffffff"/>
  <!-- Smile -->
  <path d="M54 50 Q60 56 66 50" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Cheeks -->
  <circle cx="50" cy="48" r="3.5" fill="#f59e0b" opacity="0.35"/>
  <circle cx="70" cy="48" r="3.5" fill="#f59e0b" opacity="0.35"/>
  <!-- Left arm raised (speaking gesture) -->
  <path d="M50 63 Q36 58 30 50" stroke="#fcd9b6" stroke-width="7.5" stroke-linecap="round" fill="none"/>
  <circle cx="29" cy="48" r="5" fill="#fcd9b6"/>
  <!-- Right arm down on podium -->
  <path d="M70 63 Q82 66 86 72" stroke="#fcd9b6" stroke-width="7.5" stroke-linecap="round" fill="none"/>
  <circle cx="87" cy="74" r="5" fill="#fcd9b6"/>
  <!-- Badge / name tag on body -->
  <rect x="54" y="60" width="12" height="9" rx="3" fill="#f59e0b"/>
  <rect x="56" y="63" width="8" height="2" rx="1" fill="#ffffff"/>
  <rect x="56" y="66" width="5" height="2" rx="1" fill="#ffffff"/>
  <!-- Hair -->
  <ellipse cx="60" cy="32" rx="12" ry="5" fill="#1f2937"/>
  <ellipse cx="49" cy="36" rx="5" ry="4" fill="#1f2937"/>
  <ellipse cx="71" cy="36" rx="5" ry="4" fill="#1f2937"/>
</svg>
