<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI·개인정보">
  <title>AI·개인정보</title>
  <rect width="120" height="120" rx="26" fill="#e5edff"/>
  <!-- Robot head body -->
  <rect x="28" y="34" width="64" height="56" rx="14" fill="#2563eb"/>
  <!-- Robot head top/antenna area -->
  <rect x="36" y="22" width="48" height="16" rx="8" fill="#1d4ed8"/>
  <!-- Antenna -->
  <rect x="58" y="12" width="4" height="12" rx="2" fill="#1d4ed8"/>
  <circle cx="60" cy="10" r="5" fill="#f59e0b"/>
  <!-- Eyes (friendly, round) -->
  <circle cx="44" cy="56" r="11" fill="#bfdbfe"/>
  <circle cx="76" cy="56" r="11" fill="#bfdbfe"/>
  <circle cx="44" cy="56" r="7" fill="#ffffff"/>
  <circle cx="76" cy="56" r="7" fill="#ffffff"/>
  <circle cx="46" cy="54" r="4" fill="#1d4ed8"/>
  <circle cx="78" cy="54" r="4" fill="#1d4ed8"/>
  <circle cx="47" cy="53" r="1.5" fill="#ffffff"/>
  <circle cx="79" cy="53" r="1.5" fill="#ffffff"/>
  <!-- Mouth (friendly smile arc) -->
  <path d="M44 74 Q60 82 76 74" stroke="#bfdbfe" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Ear panels -->
  <rect x="18" y="48" width="12" height="20" rx="6" fill="#1d4ed8"/>
  <rect x="90" y="48" width="12" height="20" rx="6" fill="#1d4ed8"/>
  <circle cx="24" cy="58" r="4" fill="#93c5fd"/>
  <circle cx="96" cy="58" r="4" fill="#93c5fd"/>
  <!-- Small lock badge bottom right -->
  <circle cx="86" cy="86" r="14" fill="#f59e0b"/>
  <rect x="80" y="87" width="12" height="10" rx="3.5" fill="#ffffff"/>
  <path d="M82 87 Q82 81 86 81 Q90 81 90 87" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <circle cx="86" cy="92" r="2" fill="#f59e0b"/>
  <!-- Top panel dots (thinking) -->
  <circle cx="50" cy="28" r="2.5" fill="#93c5fd"/>
  <circle cx="60" cy="28" r="2.5" fill="#93c5fd"/>
  <circle cx="70" cy="28" r="2.5" fill="#93c5fd"/>
</svg>
