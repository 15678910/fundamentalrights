<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="기본법, 많을수록 좋을까">
  <title>기본법, 많을수록 좋을까</title>
  <rect width="120" height="120" rx="26" fill="#fef3c7"/>
  <!-- growing stack of law books -->
  <g stroke="#92400e" stroke-width="2.5" stroke-linejoin="round">
    <rect x="16" y="88" width="52" height="12" rx="3" fill="#f59e0b"/>
    <rect x="20" y="76" width="48" height="12" rx="3" fill="#fbbf24"/>
    <rect x="24" y="64" width="44" height="12" rx="3" fill="#f59e0b"/>
    <rect x="28" y="52" width="40" height="12" rx="3" fill="#fbbf24"/>
    <rect x="32" y="40" width="36" height="12" rx="3" fill="#f59e0b"/>
  </g>
  <g fill="#78350f" font-family="'Pretendard','Malgun Gothic',sans-serif" font-size="8" font-weight="700">
    <text x="42" y="97">기본법</text>
    <text x="44" y="85">기본법</text>
    <text x="46" y="73">기본법</text>
  </g>
  <!-- one more book hovering with question -->
  <g transform="rotate(-8 52 24)">
    <rect x="34" y="18" width="36" height="12" rx="3" fill="#dc2626" stroke="#7f1d1d" stroke-width="2.5"/>
    <text x="52" y="27" font-family="'Pretendard','Malgun Gothic',sans-serif" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">+1?</text>
  </g>
  <!-- balance scale on the right: 의제화 vs 규범력 -->
  <g stroke="#0e7490" stroke-width="3" stroke-linecap="round">
    <path d="M94 44 v46"/>
    <path d="M78 52 h32"/>
    <path d="M78 52 l-4 10 h8 Z" fill="#0e7490"/>
    <path d="M110 52 l-4 10 h8 Z" fill="#0e7490"/>
    <path d="M86 92 h16"/>
  </g>
  <!-- question mark -->
  <circle cx="94" cy="34" r="11" fill="#ffffff" stroke="#0e7490" stroke-width="3"/>
  <text x="94" y="40" font-family="sans-serif" font-weight="800" font-size="15" fill="#0e7490" text-anchor="middle">?</text>
</svg>
