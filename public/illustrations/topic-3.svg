<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="삼권분립">
  <title>삼권분립</title>
  <rect width="120" height="120" rx="26" fill="#efe7fd"/>
  <!-- Three pillars -->
  <!-- Left pillar (입법) -->
  <rect x="16" y="50" width="24" height="48" rx="5" fill="#7c3aed"/>
  <rect x="13" y="46" width="30" height="8" rx="4" fill="#6d28d9"/>
  <rect x="16" y="42" width="24" height="6" rx="3" fill="#7c3aed"/>
  <!-- Center pillar (사법) -->
  <rect x="48" y="38" width="24" height="60" rx="5" fill="#7c3aed"/>
  <rect x="45" y="34" width="30" height="8" rx="4" fill="#6d28d9"/>
  <rect x="48" y="28" width="24" height="9" rx="3" fill="#7c3aed"/>
  <!-- Right pillar (행정) -->
  <rect x="80" y="50" width="24" height="48" rx="5" fill="#7c3aed"/>
  <rect x="77" y="46" width="30" height="8" rx="4" fill="#6d28d9"/>
  <rect x="80" y="42" width="24" height="6" rx="3" fill="#7c3aed"/>
  <!-- Ground -->
  <rect x="12" y="96" width="96" height="8" rx="4" fill="#6d28d9"/>
  <!-- Balance scale - beam -->
  <circle cx="60" cy="22" r="4" fill="#f59e0b"/>
  <rect x="32" y="20" width="56" height="4" rx="2" fill="#f59e0b"/>
  <!-- Scale left pan -->
  <path d="M38 24 Q32 30 26 30" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M38 24 Q44 30 50 30" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <rect x="22" y="30" width="32" height="5" rx="2.5" fill="#f59e0b" opacity="0.7"/>
  <!-- Scale right pan -->
  <path d="M82 24 Q76 30 70 30" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M82 24 Q88 30 94 30" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <rect x="66" y="30" width="32" height="5" rx="2.5" fill="#f59e0b" opacity="0.7"/>
  <!-- Pillar cap gems -->
  <circle cx="28" cy="43" r="3.5" fill="#c4b5fd"/>
  <circle cx="60" cy="29" r="3.5" fill="#c4b5fd"/>
  <circle cx="92" cy="43" r="3.5" fill="#c4b5fd"/>
</svg>
