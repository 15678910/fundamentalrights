<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="제10조 - 인간의 존엄과 행복추구권">
  <title>제10조 - 인간의 존엄과 행복추구권</title>
  <rect width="120" height="120" rx="26" fill="#efe7fd"/>
  <!-- Body -->
  <rect x="46" y="76" width="28" height="28" rx="12" fill="#7c3aed"/>
  <!-- Head -->
  <circle cx="60" cy="62" r="18" fill="#fcd9b6"/>
  <!-- Hair -->
  <ellipse cx="60" cy="45" rx="15" ry="7.5" fill="#1f2937"/>
  <ellipse cx="47" cy="50" rx="6" ry="5.5" fill="#1f2937"/>
  <ellipse cx="73" cy="50" rx="6" ry="5.5" fill="#1f2937"/>
  <!-- Eyes (happy, squinting) -->
  <path d="M51 59 Q54 56 57 59" stroke="#1f2937" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <path d="M63 59 Q66 56 69 59" stroke="#1f2937" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <!-- Big smile -->
  <path d="M51 67 Q60 76 69 67" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Cheeks -->
  <circle cx="46" cy="64" r="4.5" fill="#f59e0b" opacity="0.35"/>
  <circle cx="74" cy="64" r="4.5" fill="#f59e0b" opacity="0.35"/>
  <!-- Arms raised in joy -->
  <path d="M46 82 Q34 72 26 60" stroke="#fcd9b6" stroke-width="8" stroke-linecap="round" fill="none"/>
  <circle cx="24" cy="57" r="6" fill="#fcd9b6"/>
