  <circle cx="96" cy="57" r="6" fill="#fcd9b6"/>
  <!-- Small heart left -->
  <path d="M26 42 C26 42 20 36 20 31 C20 27 23 25 26 28 C29 25 32 27 32 31 C32 36 26 42 26 42Z" fill="#f59e0b"/>
  <!-- Main heart floating above head -->
  <path d="M60 34 C60 34 50 25 50 19 C50 14 55 11 60 16 C65 11 70 14 70 19 C70 25 60 34 60 34Z" fill="#7c3aed"/>
  <path d="M60 30 C60 30 53 23 53 19 C53 16.5 56.5 14.5 60 18 C63.5 14.5 67 16.5 67 19 C67 23 60 30 60 30Z" fill="#c4b5fd"/>
  <!-- Small heart right -->
  <path d="M94 42 C94 42 88 36 88 31 C88 27 91 25 94 28 C97 25 100 27 100 31 C100 36 94 42 94 42Z" fill="#f59e0b"/>
  <!-- Legs -->
  <rect x="48" y="100" width="9" height="12" rx="4.5" fill="#7c3aed"/>
  <rect x="63" y="100" width="9" height="12" rx="4.5" fill="#7c3aed"/>
</svg>
