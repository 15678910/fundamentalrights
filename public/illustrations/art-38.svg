<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="납세의 의무">
  <title>납세의 의무</title>
  <rect width="120" height="120" rx="26" fill="#eef1f5"/>
  <!-- Public building base -->
  <rect x="24" y="68" width="72" height="36" rx="4" fill="#64748b"/>
  <!-- Building door -->
  <rect x="50" y="82" width="20" height="22" rx="4" fill="#475569"/>
  <circle cx="67" cy="94" r="2" fill="#94a3b8"/>
  <!-- Building windows row 1 -->
  <rect x="28" y="74" width="14" height="10" rx="3" fill="#94a3b8"/>
  <rect x="78" y="74" width="14" height="10" rx="3" fill="#94a3b8"/>
  <!-- Window cross bars -->
  <rect x="34" y="74" width="2" height="10" rx="1" fill="#64748b"/>
  <rect x="28" y="78" width="14" height="2" rx="1" fill="#64748b"/>
  <rect x="84" y="74" width="2" height="10" rx="1" fill="#64748b"/>
  <rect x="78" y="78" width="14" height="2" rx="1" fill="#64748b"/>
  <!-- Building columns -->
  <rect x="30" y="60" width="8" height="12" rx="2" fill="#94a3b8"/>
  <rect x="46" y="60" width="8" height="12" rx="2" fill="#94a3b8"/>
  <rect x="66" y="60" width="8" height="12" rx="2" fill="#94a3b8"/>
  <rect x="82" y="60" width="8" height="12" rx="2" fill="#94a3b8"/>
  <!-- Pediment / triangular roof -->
  <polygon points="18,64 60,36 102,64" fill="#475569"/>
  <!-- Pediment highlight line -->
  <polygon points="24,64 60,42 96,64" fill="none" stroke="#64748b" stroke-width="2"/>
  <!-- Entablature / horizontal beam -->
  <rect x="18" y="60" width="84" height="8" rx="3" fill="#334155"/>

  <!-- Coins falling into building -->
  <!-- Coin 1 (top, slightly left) -->
  <circle cx="50" cy="22" r="8" fill="#f59e0b"/>
  <circle cx="50" cy="22" r="5" fill="#fbbf24"/>
  <!-- Coin 2 (middle) -->
  <circle cx="65" cy="34" r="7" fill="#f59e0b"/>
  <circle cx="65" cy="34" r="4.5" fill="#fbbf24"/>
  <!-- Coin 3 (lower right) -->
  <circle cx="55" cy="46" r="6" fill="#f59e0b"/>
  <circle cx="55" cy="46" r="3.5" fill="#fbbf24"/>
  <!-- Coin arrow trail dots -->
  <circle cx="52" cy="30" r="2" fill="#f59e0b" opacity="0.5"/>
  <circle cx="60" cy="42" r="2" fill="#f59e0b" opacity="0.5"/>
</svg>
