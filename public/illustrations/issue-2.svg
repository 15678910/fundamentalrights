<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="딥페이크·디지털성범죄">
  <title>딥페이크·디지털성범죄</title>
  <rect width="120" height="120" rx="26" fill="#efe7fd"/>
  <!-- Screen/monitor frame -->
  <rect x="16" y="28" width="88" height="64" rx="10" fill="#7c3aed"/>
  <rect x="22" y="34" width="76" height="52" rx="7" fill="#ede9fe"/>
  <!-- Monitor stand -->
  <rect x="48" y="92" width="24" height="6" rx="3" fill="#6d28d9"/>
  <rect x="40" y="96" width="40" height="6" rx="3" fill="#6d28d9"/>
  <!-- Photo frame inside screen (deepfake image) -->
  <rect x="28" y="40" width="40" height="40" rx="5" fill="#c4b5fd"/>
  <!-- Simplified face in photo (neutral/blurred) -->
  <circle cx="48" cy="54" r="10" fill="#fcd9b6"/>
  <ellipse cx="48" cy="46" rx="8" ry="4" fill="#a78bfa"/>
  <!-- face lines (blurred suggestion) -->
  <rect x="42" y="50" width="4" height="2" rx="1" fill="#7c3aed" opacity="0.5"/>
  <rect x="50" y="50" width="4" height="2" rx="1" fill="#7c3aed" opacity="0.5"/>
  <path d="M43 58 Q48 62 53 58" stroke="#7c3aed" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/>
  <!-- Wavy lines on photo (distortion) -->
  <path d="M28 72 Q38 68 48 72 Q58 76 68 72" stroke="#a78bfa" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Shield overlay (protection) -->
  <path d="M72 36 C72 36 86 38 90 48 C94 58 88 74 80 80 C72 74 66 58 70 48 C72 41 72 36 72 36Z" fill="#7c3aed"/>
  <path d="M72 42 C72 42 83 44 86 52 C89 60 84 72 78 77 C72 72 67 60 70 52 C72 46 72 42 72 42Z" fill="#ffffff"/>
  <!-- Lock icon on shield -->
  <rect x="75" y="56" width="10" height="9" rx="3" fill="#7c3aed"/>
  <path d="M77 56 Q77 50 80 50 Q83 50 83 56" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <circle cx="80" cy="61" r="1.8" fill="#ffffff"/>
  <!-- Checkmark glow on shield -->
  <circle cx="80" cy="40" r="5" fill="#f59e0b"/>
  <path d="M77 40 L79 42.5 L83 37.5" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
