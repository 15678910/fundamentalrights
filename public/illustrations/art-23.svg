<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="재산권">
  <title>재산권</title>
  <rect width="120" height="120" rx="26" fill="#e0f5fa"/>
  <!-- Hand / arm holding items (palm up) -->
  <!-- Arm -->
  <path d="M30 108 Q28 90 36 80" stroke="#fcd9b6" stroke-width="14" stroke-linecap="round" fill="none"/>
  <!-- Palm -->
  <ellipse cx="44" cy="76" rx="18" ry="12" fill="#fcd9b6"/>
  <!-- Fingers -->
  <rect x="28" y="62" width="8" height="18" rx="4" fill="#fcd9b6"/>
  <rect x="37" y="58" width="8" height="20" rx="4" fill="#fcd9b6"/>
  <rect x="46" y="58" width="8" height="20" rx="4" fill="#fcd9b6"/>
  <rect x="55" y="60" width="7" height="18" rx="3.5" fill="#fcd9b6"/>
  <!-- Coin (gold) sitting in hand -->
  <circle cx="40" cy="54" r="16" fill="#f59e0b"/>
  <circle cx="40" cy="54" r="12" fill="#ffffff" opacity="0.25"/>
  <!-- Coin edge highlight -->
  <circle cx="40" cy="54" r="16" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
  <!-- Won / currency symbol (neutral circle with lines) -->
  <circle cx="40" cy="54" r="7" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
  <line x1="35" y1="54" x2="45" y2="54" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <line x1="35" y1="51" x2="45" y2="51" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Small house (right side) -->
  <!-- House body -->
  <rect x="68" y="68" width="34" height="28" rx="6" fill="#0891b2"/>
  <!-- Roof -->
  <path d="M62 72 L85 48 L108 72Z" fill="#1f2937"/>
  <!-- Door -->
  <rect x="79" y="80" width="8" height="16" rx="3" fill="#ffffff" opacity="0.9"/>
  <!-- Window -->
  <rect x="69" y="74" width="8" height="8" rx="2.5" fill="#ffffff" opacity="0.8"/>
  <!-- Key (bottom right corner) -->
  <circle cx="100" cy="48" r="8" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
  <rect x="100" y="50" width="16" height="5" rx="2.5" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="110" y="55" width="4" height="4" rx="1" fill="#ffffff"/>
  <rect x="104" y="55" width="4" height="6" rx="1" fill="#ffffff"/>
  <!-- Key hole in circle -->
  <circle cx="100" cy="46" r="2.5" fill="#ffffff"/>
  <rect x="98.5" y="46" width="3" height="5" rx="1.5" fill="#ffffff"/>
</svg>
