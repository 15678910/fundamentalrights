<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="정보공개 청구">
  <title>정보공개 청구</title>
  <rect width="120" height="120" rx="26" fill="#e0f2fe"/>
  <!-- government building -->
  <g stroke="#0369a1" stroke-width="3" stroke-linejoin="round">
    <rect x="20" y="46" width="52" height="40" fill="#ffffff"/>
    <path d="M14 46 l32 -18 l32 18 Z" fill="#bae6fd"/>
    <rect x="28" y="56" width="8" height="30" fill="#bae6fd" stroke-width="2.5"/>
    <rect x="42" y="56" width="8" height="30" fill="#bae6fd" stroke-width="2.5"/>
    <rect x="56" y="56" width="8" height="30" fill="#bae6fd" stroke-width="2.5"/>
  </g>
  <path d="M12 90 h96" stroke="#0369a1" stroke-width="3" stroke-linecap="round"/>
  <!-- opening drawer with documents flying out -->
  <rect x="66" y="66" width="30" height="16" rx="3" fill="#f59e0b" stroke="#b45309" stroke-width="2.5"/>
  <circle cx="81" cy="74" r="2.5" fill="#78350f"/>
  <!-- document handed out -->
  <g transform="rotate(10 96 42)">
    <rect x="82" y="26" width="26" height="32" rx="4" fill="#ffffff" stroke="#0e7490" stroke-width="3"/>
    <g stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round">
      <path d="M88 36 h14"/><path d="M88 43 h14"/><path d="M88 50 h9"/>
    </g>
  </g>
  <!-- citizen hand reaching for it -->
  <path d="M108 74 q-2 -12 -8 -16" fill="none" stroke="#fcd9b6" stroke-width="9" stroke-linecap="round"/>
  <!-- unlocked padlock -->
  <g transform="translate(24 96)">
    <rect x="0" y="6" width="18" height="14" rx="4" fill="#16a34a"/>
    <path d="M4 6 v-3 a5 5 0 0 1 10 -1" fill="none" stroke="#16a34a" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="9" cy="13" r="2.5" fill="#ffffff"/>
  </g>
  <!-- speech: question -->
  <g transform="translate(88 92)">
    <rect x="0" y="0" width="22" height="16" rx="6" fill="#ffffff" stroke="#0369a1" stroke-width="2.5"/>
    <text x="11" y="12" font-family="sans-serif" font-weight="700" font-size="11" fill="#0369a1" text-anchor="middle">?</text>
  </g>
</svg>
