<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="교권 침해와 학부모 갑질">
  <title>교권 침해와 학부모 갑질</title>
  <rect width="120" height="120" rx="26" fill="#e0f5fa"/>
  <!-- Teacher figure body -->
  <rect x="42" y="52" width="18" height="22" rx="9" fill="#0e7490"/>
  <!-- Teacher head -->
  <circle cx="51" cy="44" r="11" fill="#fcd9b6"/>
  <!-- Teacher hair -->
  <ellipse cx="51" cy="34" rx="10" ry="5.5" fill="#1f2937"/>
  <!-- Teacher arms holding shield - left arm -->
  <rect x="30" y="57" width="13" height="6" rx="3" fill="#0e7490" transform="rotate(-10 36 60)"/>
  <!-- Teacher arms holding shield - right arm -->
  <rect x="59" y="55" width="13" height="6" rx="3" fill="#0e7490" transform="rotate(10 65 58)"/>
  <!-- Shield body - main shape -->
  <path d="M51 28 L67 35 L67 50 C67 60 51 68 51 68 C51 68 35 60 35 50 L35 35 Z" fill="#0e7490"/>
  <!-- Shield inner highlight -->
  <path d="M51 33 L62 38.5 L62 50 C62 57 51 63 51 63 C51 63 40 57 40 50 L40 38.5 Z" fill="#0891b2"/>
  <!-- Shield checkmark / star of protection -->
  <path d="M45 49 L49 53 L57 44" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Warm glow dots around shield - representing dignity/hope -->
  <circle cx="29" cy="32" r="3.5" fill="#f59e0b"/>
  <circle cx="73" cy="30" r="2.5" fill="#f59e0b"/>
  <circle cx="76" cy="43" r="2" fill="#f59e0b" opacity="0.7"/>
  <circle cx="26" cy="44" r="2" fill="#f59e0b" opacity="0.7"/>
  <!-- Small student figure to the right (the reason teaching matters) -->
  <circle cx="93" cy="74" r="8" fill="#fcd9b6"/>
  <ellipse cx="93" cy="67" rx="7" ry="4" fill="#1f2937"/>
  <rect x="87" y="81" width="13" height="15" rx="6.5" fill="#f59e0b"/>
  <!-- Book the student holds -->
  <rect x="75" y="88" width="14" height="10" rx="3" fill="#ffffff"/>
  <rect x="75" y="88" width="7" height="10" rx="3" fill="#e0f9ff"/>
  <rect x="81.5" y="88" width="1.5" height="10" fill="#0e7490" opacity="0.4"/>
  <!-- Connection line between teacher and student (dotted) -->
  <line x1="61" y1="74" x2="82" y2="82" stroke="#0891b2" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.6"/>
</svg>
