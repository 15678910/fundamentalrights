<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="노인 무임승차와 세대 형평">
  <title>노인 무임승차와 세대 형평</title>
  <rect width="120" height="120" rx="26" fill="#fef3c7"/>
  <!-- subway car -->
  <rect x="18" y="34" width="84" height="44" rx="12" fill="#ffffff" stroke="#b45309" stroke-width="3"/>
  <rect x="26" y="42" width="18" height="14" rx="3" fill="#fde68a"/>
  <rect x="51" y="42" width="18" height="14" rx="3" fill="#fde68a"/>
  <rect x="76" y="42" width="18" height="14" rx="3" fill="#fde68a"/>
  <line x1="18" y1="64" x2="102" y2="64" stroke="#b45309" stroke-width="2.5"/>
  <circle cx="38" cy="84" r="7" fill="#78350f"/>
  <circle cx="82" cy="84" r="7" fill="#78350f"/>
  <!-- rail -->
  <path d="M14 98 h92" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
  <!-- elderly figure with cane at door -->
  <circle cx="60" cy="18" r="7" fill="#fcd9b6"/>
  <path d="M60 25 v14" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
  <path d="M68 26 v14" stroke="#92400e" stroke-width="3" stroke-linecap="round"/>
  <!-- free ticket -->
  <g transform="rotate(-10 96 22)">
    <rect x="84" y="14" width="26" height="16" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
    <circle cx="97" cy="22" r="4" fill="none" stroke="#16a34a" stroke-width="2"/>
    <path d="M95.5 22 l1.5 1.5 l3 -3.5" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round"/>
  </g>
</svg>
