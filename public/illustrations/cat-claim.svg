<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="청구권 - 손과 문서">
  <title>청구권 - 손과 문서</title>
  <rect width="120" height="120" rx="26" fill="#fbf1da"/>
  <!-- Document -->
  <rect x="54" y="22" width="46" height="58" rx="8" fill="#ffffff"/>
  <!-- Document fold corner -->
  <path d="M88 22 L100 34 L88 34Z" fill="#fde68a"/>
  <path d="M88 22 L100 22 L100 34Z" fill="#f59e0b" opacity="0.4"/>
  <!-- Document lines -->
  <rect x="62" y="38" width="28" height="3.5" rx="1.7" fill="#ca8a04" opacity="0.3"/>
  <rect x="62" y="47" width="24" height="3.5" rx="1.7" fill="#ca8a04" opacity="0.3"/>
  <rect x="62" y="56" width="26" height="3.5" rx="1.7" fill="#ca8a04" opacity="0.3"/>
  <rect x="62" y="65" width="20" height="3.5" rx="1.7" fill="#ca8a04" opacity="0.3"/>
  <!-- Stamp / seal on document -->
  <circle cx="77" cy="60" r="11" fill="#ca8a04" opacity="0.15"/>
  <circle cx="77" cy="60" r="8" fill="none" stroke="#ca8a04" stroke-width="2" stroke-dasharray="3 2"/>
  <circle cx="77" cy="60" r="3" fill="#ca8a04"/>
  <!-- Raised hand (palm facing out) -->
  <!-- Palm -->
  <rect x="20" y="68" width="36" height="30" rx="10" fill="#fcd9b6"/>
  <!-- Fingers (4 fingers together) -->
  <rect x="22" y="48" width="8" height="26" rx="4" fill="#fcd9b6"/>
  <rect x="32" y="44" width="8" height="30" rx="4" fill="#fcd9b6"/>
  <rect x="42" y="46" width="8" height="28" rx="4" fill="#fcd9b6"/>
  <rect x="48" y="52" width="8" height="22" rx="4" fill="#fcd9b6"/>
  <!-- Thumb -->
  <ellipse cx="18" cy="72" rx="7" ry="5" fill="#fcd9b6" transform="rotate(-20 18 72)"/>
  <!-- Knuckle lines -->
  <path d="M26 68 Q26 66 26 64" stroke="#f59e0b" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
  <path d="M36 66 Q36 64 36 62" stroke="#f59e0b" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
  <path d="M46 67 Q46 65 46 63" stroke="#f59e0b" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
  <!-- Accent star -->
  <polygon points="92,18 94,24 100,24 95.5,28 97.5,34 92,30 86.5,34 88.5,28 84,24 90,24" fill="#f59e0b" opacity="0.7"/>
