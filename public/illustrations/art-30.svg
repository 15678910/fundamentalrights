<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="범죄피해자구조">
  <title>범죄피해자구조</title>
  <rect width="120" height="120" rx="26" fill="#fbf1da"/>
  <!-- Two cupped supporting hands beneath (large, warm) -->
  <!-- Left hand / arm -->
  <path d="M18 90 Q22 72 36 68 Q44 66 52 70" stroke="#fcd9b6" stroke-width="12" stroke-linecap="round" fill="none"/>
  <!-- Left palm cupped upward -->
  <path d="M30 82 Q42 96 60 96 Q78 96 90 82" stroke="#fcd9b6" stroke-width="12" stroke-linecap="round" fill="none"/>
  <!-- Right hand / arm -->
  <path d="M102 90 Q98 72 84 68 Q76 66 68 70" stroke="#fcd9b6" stroke-width="12" stroke-linecap="round" fill="none"/>
  <!-- Thumb suggestions on hands -->
  <circle cx="26" cy="80" r="7" fill="#fcd9b6"/>
  <circle cx="94" cy="80" r="7" fill="#fcd9b6"/>
  <!-- Small seated figure being cradled -->
  <!-- Body -->
  <rect x="48" y="58" width="24" height="26" rx="12" fill="#ca8a04"/>
  <!-- Head -->
  <circle cx="60" cy="48" r="14" fill="#fcd9b6"/>
  <!-- Eyes (gentle, slightly downcast but hopeful) -->
  <path d="M54 46 Q56 44 58 46" stroke="#1f2937" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M62 46 Q64 44 66 46" stroke="#1f2937" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <!-- Soft smile -->
  <path d="M55 52 Q60 57 65 52" stroke="#1f2937" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <!-- Cheeks -->
  <circle cx="51" cy="50" r="3" fill="#f59e0b" opacity="0.35"/>
  <circle cx="69" cy="50" r="3" fill="#f59e0b" opacity="0.35"/>
  <!-- Small arms hugging knees (seated, comforted pose) -->
  <path d="M48 68 Q42 74 44 82" stroke="#fcd9b6" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M72 68 Q78 74 76 82" stroke="#fcd9b6" stroke-width="7" stroke-linecap="round" fill="none"/>
  <!-- Knees / legs -->
  <ellipse cx="52" cy="84" rx="6" ry="5" fill="#ca8a04"/>
  <ellipse cx="68" cy="84" rx="6" ry="5" fill="#ca8a04"/>
  <!-- Warm heart glow above head -->
  <path d="M60 32 Q56 26 50 28 Q44 30 46 38 Q48 46 60 52 Q72 46 74 38 Q76 30 70 28 Q64 26 60 32 Z" fill="#f59e0b" opacity="0.55"/>
  <!-- Hair -->
  <ellipse cx="60" cy="35" rx="11" ry="5" fill="#1f2937"/>
  <ellipse cx="50" cy="38" rx="5" ry="4" fill="#1f2937"/>
  <ellipse cx="70" cy="38" rx="5" ry="4" fill="#1f2937"/>
</svg>
