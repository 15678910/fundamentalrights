<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="반민주적 정당, 금지해야 할까">
  <title>반민주적 정당, 금지해야 할까</title>
  <rect width="120" height="120" rx="26" fill="#fdecec"/>
  <!-- shield of democracy (left) protecting ballot box -->
  <path d="M38 24 q14 6 22 4 q0 30 -22 40 q-22 -10 -22 -40 q8 2 22 -4 Z" fill="#2563eb" opacity="0.92"/>
  <rect x="28" y="42" width="20" height="14" rx="2" fill="#ffffff"/>
  <rect x="34" y="38" width="8" height="3" rx="1.5" fill="#ffffff"/>
  <path d="M31 48 l4 4 l8 -9" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- party flag (right) inside dashed prohibition circle with ? -->
  <line x1="84" y1="40" x2="84" y2="86" stroke="#6b7280" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M84 40 h22 l-6 8 l6 8 h-22 Z" fill="#6b7280"/>
  <circle cx="90" cy="62" r="26" fill="none" stroke="#dc2626" stroke-width="3.5" stroke-dasharray="7 6"/>
  <text x="90" y="106" text-anchor="middle" font-size="17" font-weight="bold" fill="#dc2626" font-family="sans-serif">?</text>
  <!-- gavel between: 헌재 심판 -->
  <g transform="rotate(-30 58 88)">
    <rect x="50" y="84" width="18" height="9" rx="3" fill="#7c5a2e"/>
    <rect x="56" y="92" width="5" height="16" rx="2" fill="#7c5a2e"/>
  </g>
  <ellipse cx="60" cy="110" rx="40" ry="5" fill="#dc2626" opacity="0.1"/>
</svg>
