<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="파업할 권리와 시민의 불편">
  <title>파업할 권리와 시민의 불편</title>
  <rect width="120" height="120" rx="26" fill="#ffedd5"/>
  <!-- stopped gear -->
  <g transform="translate(78 42)">
    <circle r="17" fill="#ffffff" stroke="#c2410c" stroke-width="3.5"/>
    <circle r="6" fill="none" stroke="#c2410c" stroke-width="3"/>
    <g stroke="#c2410c" stroke-width="4" stroke-linecap="round">
      <path d="M0 -17 v-7"/><path d="M0 17 v7"/><path d="M-17 0 h-7"/><path d="M17 0 h7"/>
      <path d="M-12 -12 l-5 -5"/><path d="M12 12 l5 5"/><path d="M12 -12 l5 -5"/><path d="M-12 12 l-5 5"/>
    </g>
  </g>
  <!-- raised fist -->
  <path d="M32 96 v-26" stroke="#fcd9b6" stroke-width="12" stroke-linecap="round"/>
  <rect x="22" y="46" width="21" height="24" rx="8" fill="#fcd9b6"/>
  <g stroke="#e3b58c" stroke-width="2" stroke-linecap="round">
    <path d="M27 50 v10"/><path d="M32.5 50 v10"/><path d="M38 50 v10"/>
  </g>
  <!-- clock: waiting citizens -->
  <circle cx="84" cy="88" r="13" fill="#ffffff" stroke="#0e7490" stroke-width="3"/>
  <path d="M84 88 v-7 M84 88 l5 4" stroke="#0e7490" stroke-width="2.5" stroke-linecap="round"/>
  <!-- speech line -->
  <path d="M22 32 q10 -10 24 -6" fill="none" stroke="#c2410c" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 7"/>
</svg>
