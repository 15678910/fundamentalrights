<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="가짜뉴스와 표현의 자유">
  <title>가짜뉴스와 표현의 자유</title>
  <rect width="120" height="120" rx="26" fill="#f3e8ff"/>
  <!-- newspaper -->
  <rect x="22" y="28" width="58" height="66" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
  <rect x="29" y="36" width="44" height="10" rx="2" fill="#ddd6fe"/>
  <g stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round">
    <path d="M29 54 h26"/><path d="M29 61 h26"/><path d="M29 68 h20"/>
  </g>
  <rect x="59" y="52" width="14" height="18" rx="2" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
  <g stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round">
    <path d="M29 78 h44"/><path d="M29 85 h34"/>
  </g>
  <!-- magnifier with check/cross -->
  <circle cx="84" cy="72" r="19" fill="#faf5ff" stroke="#7c3aed" stroke-width="4"/>
  <path d="M97 86 l12 12" stroke="#7c3aed" stroke-width="6" stroke-linecap="round"/>
  <path d="M75 72 l6 6 l12 -13" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- floating false snippet -->
  <g transform="rotate(8 96 30)">
    <rect x="84" y="20" width="24" height="18" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="2.5"/>
    <path d="M91 25 l10 8 M101 25 l-10 8" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
