<svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="여러 사람이 둥글게 서 있고 가운데에 공동 곳간이 있는 그림">
  <title>말 없는 그림 — 공동 곳간</title>
  <rect width="600" height="300" rx="18" fill="#fef9ec"/>
  <ellipse cx="300" cy="215" rx="215" ry="46" fill="#fde68a" opacity="0.55"/>

  <!-- common chest in the center -->
  <g>
    <rect x="255" y="178" width="90" height="52" rx="8" fill="#b45309"/>
    <rect x="255" y="168" width="90" height="18" rx="8" fill="#92400e"/>
    <rect x="292" y="176" width="16" height="14" rx="3" fill="#fcd34d"/>
    <!-- coins spilling -->
    <circle cx="248" cy="226" r="8" fill="#fcd34d" stroke="#b45309" stroke-width="2"/>
    <circle cx="262" cy="233" r="8" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
    <circle cx="352" cy="229" r="8" fill="#fcd34d" stroke="#b45309" stroke-width="2"/>
    <!-- bread -->
    <ellipse cx="330" cy="160" rx="26" ry="13" fill="#f59e0b"/>
    <path d="M312 158 q18 -8 36 0" fill="none" stroke="#fff7ed" stroke-width="3" stroke-linecap="round"/>
    <!-- heart above chest -->
    <path d="M300 132 l-9 -9 q-5 -5 -1 -10 q5 -5 10 1 q5 -6 10 -1 q4 5 -1 10 Z" fill="#ef4444"/>
  </g>

  <!-- people in a circle: varied ages/bodies, flat pastel style -->
  <!-- child (small) left -->
  <g transform="translate(96 150)">
    <circle cx="0" cy="0" r="17" fill="#fcd9b6"/>
    <path d="M-14 -8 a17 17 0 0 1 28 0 v-4 a17 17 0 0 0 -28 0 Z" fill="#7c2d12"/>
    <circle cx="-6" cy="-2" r="2.2" fill="#1f2937"/><circle cx="6" cy="-2" r="2.2" fill="#1f2937"/>
    <path d="M-5 7 q5 5 10 0" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <rect x="-14" y="17" width="28" height="36" rx="12" fill="#60a5fa"/>
    <path d="M14 26 q16 -4 26 6" fill="none" stroke="#fcd9b6" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- elderly person with cane, left-top -->
  <g transform="translate(180 92)">
    <circle cx="0" cy="0" r="19" fill="#fcd9b6"/>
    <path d="M-16 -7 a19 19 0 0 1 32 0 q-6 -8 -16 -8 q-10 0 -16 8 Z" fill="#e5e7eb"/>
    <circle cx="-7" cy="-2" r="2.4" fill="#1f2937"/><circle cx="7" cy="-2" r="2.4" fill="#1f2937"/>
    <path d="M-6 8 q6 5 12 0" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <rect x="-16" y="19" width="32" height="44" rx="13" fill="#a78bfa"/>
    <path d="M24 30 v34" stroke="#92400e" stroke-width="5" stroke-linecap="round"/>
    <path d="M16 34 q10 -8 8 -4" fill="none" stroke="#fcd9b6" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- adult center-top -->
  <g transform="translate(300 72)">
    <circle cx="0" cy="0" r="19" fill="#f9c9a3"/>
    <path d="M-17 -5 a19 19 0 0 1 34 0 v-6 a19 19 0 0 0 -34 0 Z" fill="#1f2937"/>
    <circle cx="-7" cy="-1" r="2.4" fill="#1f2937"/><circle cx="7" cy="-1" r="2.4" fill="#1f2937"/>
    <path d="M-6 9 q6 5 12 0" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <rect x="-17" y="19" width="34" height="46" rx="13" fill="#34d399"/>
    <path d="M-17 32 q-14 8 -10 22" fill="none" stroke="#f9c9a3" stroke-width="8" stroke-linecap="round"/>
    <path d="M17 32 q14 8 10 22" fill="none" stroke="#f9c9a3" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- wheelchair user right-top -->
  <g transform="translate(424 108)">
    <circle cx="0" cy="-12" r="17" fill="#fcd9b6"/>
    <path d="M-14 -20 a17 17 0 0 1 28 0 v-5 a17 17 0 0 0 -28 0 Z" fill="#374151"/>
    <circle cx="-6" cy="-14" r="2.2" fill="#1f2937"/><circle cx="6" cy="-14" r="2.2" fill="#1f2937"/>
    <path d="M-5 -6 q5 5 10 0" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <rect x="-13" y="5" width="26" height="26" rx="10" fill="#fb923c"/>
    <circle cx="0" cy="44" r="18" fill="none" stroke="#0f172a" stroke-width="4"/>
    <circle cx="0" cy="44" r="3.5" fill="#0f172a"/>
    <path d="M-13 12 q-14 6 -22 2" fill="none" stroke="#fcd9b6" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- parent with baby, right -->
  <g transform="translate(492 168)">
    <circle cx="0" cy="0" r="18" fill="#f9c9a3"/>
    <path d="M-15 -6 a18 18 0 0 1 30 0 q-4 -9 -15 -9 q-11 0 -15 9 Z" fill="#78350f"/>
    <circle cx="-6" cy="-1" r="2.3" fill="#1f2937"/><circle cx="6" cy="-1" r="2.3" fill="#1f2937"/>
    <path d="M-5 8 q5 5 10 0" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <rect x="-15" y="18" width="30" height="42" rx="12" fill="#f472b6"/>
    <circle cx="-20" cy="34" r="10" fill="#fcd9b6"/>
    <path d="M-27 30 a10 10 0 0 1 14 -3 v-3 a10 10 0 0 0 -14 3 Z" fill="#fde68a"/>
    <circle cx="-23" cy="34" r="1.6" fill="#1f2937"/><circle cx="-17" cy="34" r="1.6" fill="#1f2937"/>
  </g>

  <!-- worker with cap, bottom-left -->
  <g transform="translate(178 232)">
    <circle cx="0" cy="0" r="18" fill="#fcd9b6"/>
    <path d="M-16 -5 a18 18 0 0 1 32 0 Z" fill="#0e7490"/>
    <rect x="-19" y="-8" width="38" height="5" rx="2.5" fill="#0e7490"/>
    <circle cx="-6" cy="0" r="2.3" fill="#1f2937"/><circle cx="6" cy="0" r="2.3" fill="#1f2937"/>
    <path d="M-5 9 q5 5 10 0" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <rect x="-15" y="18" width="30" height="34" rx="12" fill="#facc15"/>
    <path d="M15 26 q16 -2 28 -12" fill="none" stroke="#fcd9b6" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- young person bottom-right -->
  <g transform="translate(414 236)">
    <circle cx="0" cy="0" r="18" fill="#f9c9a3"/>
    <path d="M-15 -7 a18 18 0 0 1 30 0 q-7 -7 -15 -7 q-8 0 -15 7 Z" fill="#b45309"/>
    <circle cx="-6" cy="-1" r="2.3" fill="#1f2937"/><circle cx="6" cy="-1" r="2.3" fill="#1f2937"/>
    <path d="M-5 8 q5 5 10 0" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <rect x="-15" y="18" width="30" height="34" rx="12" fill="#22d3ee"/>
    <path d="M-15 26 q-16 -2 -26 -12" fill="none" stroke="#f9c9a3" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
