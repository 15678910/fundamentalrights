<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="국방의 의무">
  <title>국방의 의무</title>
  <rect width="120" height="120" rx="26" fill="#eef1f5"/>
  <!-- Shield outer large -->
  <path d="M60 14 L96 28 L96 70 C96 90 60 108 60 108 C60 108 24 90 24 70 L24 28 Z" fill="#64748b"/>
  <!-- Shield inner -->
  <path d="M60 22 L90 34 L90 70 C90 86 60 101 60 101 C60 101 30 86 30 70 L30 34 Z" fill="#475569"/>
  <!-- Shield accent rim top -->
  <path d="M60 22 L90 34" stroke="#94a3b8" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M60 22 L30 34" stroke="#94a3b8" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Figure left (protected) - small -->
  <circle cx="46" cy="66" r="8" fill="#fcd9b6"/>
  <rect x="39" y="74" width="14" height="18" rx="6" fill="#94a3b8"/>
  <!-- Figure left eyes -->
  <circle cx="43" cy="64" r="1.5" fill="#1f2937"/>
  <circle cx="49" cy="64" r="1.5" fill="#1f2937"/>
  <!-- Figure left smile -->
  <path d="M43 69 Q46 72 49 69" stroke="#1f2937" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Figure right (protected) - small -->
  <circle cx="74" cy="66" r="8" fill="#fcd9b6"/>
  <rect x="67" y="74" width="14" height="18" rx="6" fill="#94a3b8"/>
  <!-- Figure right eyes -->
  <circle cx="71" cy="64" r="1.5" fill="#1f2937"/>
  <circle cx="77" cy="64" r="1.5" fill="#1f2937"/>
  <!-- Figure right smile -->
  <path d="M71 69 Q74 72 77 69" stroke="#1f2937" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Shield center star emblem -->
  <polygon points="60,32 62.5,39.5 70.5,39.5 64,44 66.5,51.5 60,47 53.5,51.5 56,44 49.5,39.5 57.5,39.5" fill="#f59e0b"/>

  <!-- Protective arc over figures -->
  <path d="M34 78 Q60 56 86 78" stroke="#64748b" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.4"/>
  <path d="M34 78 Q60 56 86 78" stroke="#cbd5e1" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="4 3"/>

  <!-- Decorative shield rivets -->
  <circle cx="32" cy="35" r="3" fill="#94a3b8"/>
  <circle cx="88" cy="35" r="3" fill="#94a3b8"/>
  <circle cx="26" cy="68" r="3" fill="#94a3b8"/>
  <circle cx="94" cy="68" r="3" fill="#94a3b8"/>
</svg>
