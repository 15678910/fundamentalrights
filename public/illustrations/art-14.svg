<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="제14조 - 거주·이전의 자유">
  <title>제14조 - 거주·이전의 자유</title>
  <rect width="120" height="120" rx="26" fill="#e0f5fa"/>
  <!-- Origin house (left, smaller) -->
  <!-- House body -->
  <rect x="14" y="62" width="32" height="30" rx="6" fill="#0891b2" opacity="0.6"/>
  <!-- Roof -->
  <polygon points="10,64 30,44 50,64" fill="#0e7490" opacity="0.7"/>
  <!-- Door -->
  <rect x="21" y="76" width="10" height="16" rx="4" fill="#e0f5fa"/>
  <!-- Window -->
  <rect x="32" y="67" width="10" height="9" rx="3" fill="#bae6fd"/>
  <!-- Destination house (right, larger, brighter) -->
  <rect x="74" y="56" width="38" height="36" rx="7" fill="#0891b2"/>
  <!-- Roof -->
  <polygon points="68,58 93,32 118,58" fill="#0e7490"/>
  <!-- Door -->
  <rect x="84" y="72" width="12" height="20" rx="5" fill="#e0f5fa"/>
  <!-- Door knob -->
  <circle cx="94" cy="83" r="2" fill="#0891b2"/>
  <!-- Window left -->
  <rect x="76" y="62" width="10" height="9" rx="3" fill="#bae6fd"/>
  <!-- Window right -->
  <rect x="100" y="62" width="10" height="9" rx="3" fill="#bae6fd"/>
  <!-- Curved arrow (path of movement) -->
  <path d="M48 74 Q60 54 72 66" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" fill="none" stroke-dasharray="6 3"/>
  <!-- Arrow tip -->
  <polygon points="72,66 64,60 68,72" fill="#f59e0b"/>
  <!-- Footprints on ground -->
