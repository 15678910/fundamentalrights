  <ellipse cx="56" cy="100" rx="4" ry="2.5" fill="#0891b2" opacity="0.4" transform="rotate(10 56 100)"/>
  <ellipse cx="62" cy="96" rx="4" ry="2.5" fill="#0891b2" opacity="0.4" transform="rotate(-15 62 96)"/>
  <ellipse cx="68" cy="100" rx="4" ry="2.5" fill="#0891b2" opacity="0.4" transform="rotate(10 68 100)"/>
  <!-- Ground line -->
