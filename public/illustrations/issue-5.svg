<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="촉법소년">
  <title>촉법소년</title>
  <rect width="120" height="120" rx="26" fill="#eef1f5"/>
  <!-- Balance beam pole -->
  <rect x="57" y="28" width="6" height="62" rx="3" fill="#64748b"/>
  <!-- Base -->
  <rect x="40" y="88" width="40" height="8" rx="4" fill="#475569"/>
  <rect x="50" y="96" width="20" height="6" rx="3" fill="#334155"/>
  <!-- Balance top pivot -->
  <circle cx="60" cy="28" r="7" fill="#94a3b8"/>
  <!-- Balance beam (slightly tilted - right slightly heavier = justice weighing carefully) -->
  <rect x="18" y="26" width="84" height="5" rx="2.5" fill="#94a3b8" transform="rotate(-3 60 28)"/>
  <!-- Left pan strings -->
  <line x1="26" y1="29" x2="22" y2="44" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="36" y1="27" x2="40" y2="44" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <!-- Right pan strings -->
  <line x1="84" y1="27" x2="80" y2="42" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="94" y1="25" x2="98" y2="42" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <!-- Left pan -->
  <rect x="18" y="44" width="26" height="6" rx="3" fill="#64748b"/>
  <!-- Right pan -->
  <rect x="76" y="42" width="26" height="6" rx="3" fill="#64748b"/>
  <!-- Law book on left pan (society/law side) -->
  <rect x="22" y="34" width="18" height="12" rx="3" fill="#475569"/>
  <rect x="22" y="34" width="5" height="12" rx="2" fill="#64748b"/>
  <rect x="25" y="38" width="11" height="1.5" rx="0.75" fill="#94a3b8"/>
  <rect x="25" y="41" width="8" height="1.5" rx="0.75" fill="#94a3b8"/>
  <!-- Young figure on right pan (smaller, rounded) -->
  <circle cx="89" cy="33" r="7" fill="#fcd9b6"/>
  <rect x="84" y="39" width="10" height="10" rx="5" fill="#64748b"/>
  <!-- Hair on young figure -->
  <ellipse cx="89" cy="27" rx="6" ry="3.5" fill="#1f2937"/>
  <!-- Friendly face dots -->
  <circle cx="86" cy="33" r="1.2" fill="#1f2937"/>
  <circle cx="92" cy="33" r="1.2" fill="#1f2937"/>
  <path d="M85 37 Q89 40 93 37" stroke="#1f2937" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <!-- Leaf/sprout (growth, hope) -->
  <path d="M60 18 Q54 10 48 12 Q52 18 60 18Z" fill="#94a3b8"/>
  <path d="M60 18 Q66 10 72 12 Q68 18 60 18Z" fill="#64748b"/>
  <rect x="58.5" y="10" width="3" height="10" rx="1.5" fill="#64748b"/>
</svg>
