<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="분야별·산업별 기본법">
  <title>분야별·산업별 기본법</title>
  <rect width="120" height="120" rx="26" fill="#eef2ff"/>
  <!-- map: field tiles mosaic -->
  <g stroke="#4f46e5" stroke-width="2" stroke-linejoin="round">
    <rect x="14" y="16" width="30" height="24" rx="5" fill="#c7d2fe"/>
    <rect x="48" y="16" width="26" height="24" rx="5" fill="#bbf7d0"/>
    <rect x="78" y="16" width="28" height="24" rx="5" fill="#fde68a"/>
    <rect x="14" y="44" width="24" height="26" rx="5" fill="#fbcfe8"/>
    <rect x="42" y="44" width="34" height="26" rx="5" fill="#bae6fd"/>
    <rect x="80" y="44" width="26" height="26" rx="5" fill="#fed7aa"/>
    <rect x="14" y="74" width="32" height="24" rx="5" fill="#ddd6fe"/>
    <rect x="50" y="74" width="26" height="24" rx="5" fill="#a7f3d0"/>
    <rect x="80" y="74" width="26" height="24" rx="5" fill="#fecaca"/>
  </g>
  <!-- field glyphs -->
  <g font-family="'Pretendard','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle">
    <text x="29" y="33">📚</text>
    <text x="61" y="33">🌳</text>
    <text x="92" y="33">🏭</text>
    <text x="26" y="61">⚕️</text>
    <text x="59" y="61">⚖️</text>
    <text x="93" y="61">🚆</text>
    <text x="30" y="91">🤖</text>
    <text x="63" y="91">🌾</text>
    <text x="93" y="91">🏠</text>
  </g>
  <!-- magnifier over center tile -->
  <circle cx="63" cy="58" r="13" fill="none" stroke="#1e293b" stroke-width="3.5"/>
  <path d="M72 68 l9 9" stroke="#1e293b" stroke-width="4.5" stroke-linecap="round"/>
  <!-- count badge -->
  <g>
    <rect x="86" y="98" width="24" height="15" rx="7.5" fill="#4f46e5"/>
    <text x="98" y="109" font-family="'Pretendard','Malgun Gothic',sans-serif" font-size="9.5" font-weight="800" fill="#ffffff" text-anchor="middle">84</text>
  </g>
</svg>
