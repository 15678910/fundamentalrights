<svg viewBox="0 0 600 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="법률 제·개정 — 네모가 법률안 문서를 들고 있는 모습과 국회 돔">
  <title>법률 제·개정</title>
  <rect width="600" height="260" fill="#f3efff"/>
  <rect y="205" width="600" height="55" fill="#e4dcf7"/>

  <!-- assembly building (top-left, dome visible above caption) -->
  <ellipse cx="140" cy="72" rx="70" ry="38" fill="#7c3aed" opacity="0.9"/>
  <rect x="60" y="92" width="160" height="60" fill="#ffffff" stroke="#7c3aed" stroke-width="4"/>
  <g fill="#ede9fe" stroke="#7c3aed" stroke-width="3">
    <rect x="74" y="102" width="14" height="50"/><rect x="102" y="102" width="14" height="50"/>
    <rect x="130" y="102" width="14" height="50"/><rect x="158" y="102" width="14" height="50"/>
    <rect x="186" y="102" width="14" height="50"/>
  </g>
  <circle cx="140" cy="32" r="6" fill="#f59e0b"/>

  <!-- bill document (right-center, above/right of caption) -->
  <g>
    <rect x="380" y="34" width="130" height="150" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="4"/>
    <text x="445" y="66" text-anchor="middle" font-size="20" font-weight="bold" fill="#7c3aed" font-family="sans-serif">법률안</text>
    <g stroke="#c9c1e8" stroke-width="4" stroke-linecap="round">
      <path d="M396 86 h98"/><path d="M396 106 h98"/><path d="M396 126 h70"/>
    </g>
    <circle cx="478" cy="152" r="16" fill="none" stroke="#ef4444" stroke-width="4"/>
    <text x="478" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#ef4444" font-family="sans-serif">가결</text>
  </g>

  <!-- 네모 holding the bill (far right, red arm touching the document) -->
  <g transform="translate(330,-26) scale(1.15)">
    <rect x="166" y="56" width="54" height="54" rx="10" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/>
    <path d="M174 56 q6 -12 12 -4 q6 -12 12 -4 q6 -10 12 -2" fill="none" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <g stroke="#e11d2a" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M180 110 q-4 10 2 16"/><path d="M206 110 q4 10 -2 16"/>
    </g>
    <rect x="172" y="126" width="14" height="7" rx="3" fill="#e11d2a" transform="rotate(-12 179 129)"/>
    <rect x="200" y="126" width="14" height="7" rx="3" fill="#e11d2a" transform="rotate(12 207 129)"/>
    <!-- left arm reaches the document -->
    <path d="M166 84 q-16 0 -22 10" fill="none" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <!-- right arm raised (voting) -->
    <path d="M220 76 q14 -8 16 -20" fill="none" stroke="#e11d2a" stroke-width="3" stroke-linecap="round"/>
    <g fill="none" stroke="#1f2937" stroke-width="2"><circle cx="184" cy="80" r="7"/><circle cx="202" cy="80" r="7"/><path d="M191 80 h4"/></g>
    <circle cx="184" cy="80" r="3" fill="#1f2937"/><circle cx="202" cy="80" r="3" fill="#1f2937"/>
    <path d="M185 94 Q193 101 201 94" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <circle cx="178" cy="92" r="3.5" fill="#e11d2a" opacity="0.3"/>
    <circle cx="208" cy="92" r="3.5" fill="#e11d2a" opacity="0.3"/>
  </g>

  <!-- confetti -->
  <rect x="330" y="26" width="12" height="7" rx="2" fill="#e11d2a" transform="rotate(-18 336 29)"/>
  <circle cx="560" cy="26" r="4" fill="#f59e0b"/>
</svg>
