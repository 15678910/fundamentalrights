<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="국회">
  <title>국회</title>
  <rect width="120" height="120" rx="26" fill="#fbf1da"/>
  <!-- Building body -->
  <rect x="18" y="60" width="84" height="40" rx="6" fill="#ca8a04"/>
  <!-- Dome -->
  <ellipse cx="60" cy="58" rx="32" ry="22" fill="#d97706"/>
  <ellipse cx="60" cy="52" rx="26" ry="16" fill="#ca8a04"/>
  <ellipse cx="60" cy="48" rx="18" ry="10" fill="#b45309"/>
  <!-- Dome highlight -->
  <ellipse cx="56" cy="44" rx="10" ry="6" fill="#fbbf24" opacity="0.3"/>
  <!-- Flag/top of dome -->
  <rect x="58" y="34" width="3" height="12" rx="1.5" fill="#92400e"/>
  <rect x="61" y="34" width="10" height="7" rx="2" fill="#f59e0b"/>
  <!-- Columns -->
  <rect x="26" y="62" width="7" height="36" rx="3.5" fill="#fbbf24"/>
  <rect x="39" y="62" width="7" height="36" rx="3.5" fill="#fbbf24"/>
  <rect x="74" y="62" width="7" height="36" rx="3.5" fill="#fbbf24"/>
  <rect x="87" y="62" width="7" height="36" rx="3.5" fill="#fbbf24"/>
  <!-- Center door -->
  <rect x="52" y="80" width="16" height="20" rx="4" fill="#92400e"/>
  <!-- Document scroll on right -->
  <rect x="86" y="22" width="22" height="28" rx="5" fill="#ffffff"/>
  <rect x="86" y="22" width="22" height="6" rx="3" fill="#f59e0b"/>
  <rect x="90" y="32" width="14" height="2.5" rx="1.25" fill="#fde68a"/>
  <rect x="90" y="37" width="10" height="2.5" rx="1.25" fill="#fde68a"/>
  <rect x="90" y="42" width="12" height="2.5" rx="1.25" fill="#fde68a"/>
  <!-- Ribbon on document -->
  <circle cx="97" cy="22" r="4" fill="#ca8a04"/>
  <!-- Ground -->
  <rect x="14" y="98" width="92" height="6" rx="3" fill="#b45309"/>
  <!-- Steps -->
  <rect x="20" y="96" width="80" height="4" rx="2" fill="#d97706"/>
</svg>
