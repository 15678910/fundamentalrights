<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="노키즈존">
  <title>노키즈존</title>
  <rect width="120" height="120" rx="26" fill="#e4f7ec"/>
  <!-- Door frame -->
  <rect x="32" y="28" width="56" height="76" rx="8" fill="#15803d"/>
  <!-- Door panel -->
  <rect x="38" y="34" width="44" height="64" rx="6" fill="#dcfce7"/>
  <!-- Door knob -->
  <circle cx="74" cy="68" r="4" fill="#16a34a"/>
  <!-- Door window -->
  <rect x="46" y="40" width="28" height="20" rx="4" fill="#bbf7d0"/>
  <!-- Adult figure -->
  <circle cx="44" cy="84" r="8.5" fill="#fcd9b6"/>
  <rect x="38" y="92" width="12" height="16" rx="6" fill="#16a34a"/>
  <!-- Adult hair -->
  <ellipse cx="44" cy="76" rx="7" ry="4" fill="#1f2937"/>
  <!-- Adult face -->
  <circle cx="41" cy="84" r="1.3" fill="#1f2937"/>
  <circle cx="47" cy="84" r="1.3" fill="#1f2937"/>
  <path d="M40 88 Q44 91 48 88" stroke="#1f2937" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  <!-- Child figure (smaller, rounder) -->
  <circle cx="76" cy="88" r="7" fill="#fcd9b6"/>
  <rect x="71" y="94" width="10" height="13" rx="5" fill="#f59e0b"/>
  <!-- Child hair -->
  <ellipse cx="76" cy="82" rx="6" ry="3.5" fill="#1f2937"/>
  <!-- Child face (happy) -->
  <circle cx="73.5" cy="88" r="1.2" fill="#1f2937"/>
  <circle cx="78.5" cy="88" r="1.2" fill="#1f2937"/>
  <path d="M73 91 Q76 93.5 79 91" stroke="#1f2937" stroke-width="1.3" stroke-linecap="round" fill="none"/>
  <!-- Warm cheeks on child -->
  <circle cx="71" cy="89" r="3" fill="#f59e0b" opacity="0.35"/>
  <circle cx="81" cy="89" r="3" fill="#f59e0b" opacity="0.35"/>
  <!-- Holding hands -->
  <path d="M52 100 Q60 103 68 100" stroke="#fcd9b6" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- Heart above them -->
  <path d="M60 74 C60 74 54 68 54 64 C54 61 56.5 59.5 60 62.5 C63.5 59.5 66 61 66 64 C66 68 60 74 60 74Z" fill="#16a34a"/>
  <!-- Welcome star -->
  <polygon points="60,12 62.4,19 70,19 64,23.5 66.4,31 60,26.5 53.6,31 56,23.5 50,19 57.6,19" fill="#f59e0b"/>
</svg>
