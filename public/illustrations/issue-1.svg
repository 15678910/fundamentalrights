<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="학생인권과 교권">
  <title>학생인권과 교권</title>
  <rect width="120" height="120" rx="26" fill="#e0f5fa"/>
  <!-- School building -->
  <rect x="18" y="52" width="84" height="52" rx="8" fill="#0891b2"/>
  <!-- Roof -->
  <polygon points="14,52 60,26 106,52" fill="#0e7490"/>
  <!-- Windows -->
  <rect x="26" y="62" width="18" height="14" rx="4" fill="#e0f9ff"/>
  <rect x="51" y="62" width="18" height="14" rx="4" fill="#e0f9ff"/>
  <rect x="76" y="62" width="18" height="14" rx="4" fill="#e0f9ff"/>
  <!-- Door -->
  <rect x="48" y="84" width="24" height="20" rx="5" fill="#0e7490"/>
  <circle cx="68" cy="94" r="2" fill="#67e8f9"/>
  <!-- Flag on roof -->
  <rect x="58" y="16" width="3" height="14" rx="1.5" fill="#0e7490"/>
  <rect x="61" y="16" width="10" height="7" rx="2" fill="#f59e0b"/>
  <!-- Person left (teacher - taller) -->
  <circle cx="30" cy="34" r="9" fill="#fcd9b6"/>
  <rect x="24" y="42" width="12" height="14" rx="6" fill="#0891b2"/>
  <!-- Hair teacher -->
  <ellipse cx="30" cy="26" rx="8" ry="4.5" fill="#1f2937"/>
  <!-- Person right (student - shorter) -->
  <circle cx="90" cy="38" r="7.5" fill="#fcd9b6"/>
  <rect x="85" y="45" width="11" height="12" rx="5.5" fill="#f59e0b"/>
  <!-- Hair student -->
  <ellipse cx="90" cy="31" rx="7" ry="4" fill="#1f2937"/>
  <!-- Heart between them - warmth -->
  <path d="M60 36 C60 36 55 31 55 27 C55 24 57.5 22.5 60 25 C62.5 22.5 65 24 65 27 C65 31 60 36 60 36Z" fill="#f59e0b"/>
  <!-- Book -->
  <rect x="48" y="36" width="24" height="16" rx="3" fill="#ffffff"/>
  <rect x="48" y="36" width="12" height="16" rx="3" fill="#e0f9ff"/>
  <rect x="59" y="36" width="1.5" height="16" fill="#0891b2" opacity="0.5"/>
</svg>
