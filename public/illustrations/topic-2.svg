<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="선거">
  <title>선거</title>
  <rect width="120" height="120" rx="26" fill="#e4f7ec"/>
  <!-- Ballot box body -->
  <rect x="22" y="54" width="76" height="50" rx="10" fill="#16a34a"/>
  <!-- Ballot box lid -->
  <rect x="18" y="46" width="84" height="14" rx="7" fill="#15803d"/>
  <!-- Slot on lid -->
  <rect x="46" y="51" width="28" height="5" rx="2.5" fill="#dcfce7"/>
  <!-- Ballot paper going in -->
  <rect x="44" y="30" width="32" height="24" rx="5" fill="#ffffff"/>
  <!-- Check mark on ballot -->
  <path d="M52 44 L58 50 L70 36" stroke="#16a34a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Lines on ballot (form fields) -->
  <rect x="50" y="34" width="18" height="2.5" rx="1.25" fill="#d1fae5"/>
  <rect x="50" y="39" width="14" height="2.5" rx="1.25" fill="#d1fae5"/>
  <!-- Hand pushing ballot -->
  <path d="M56 32 Q58 24 60 20" stroke="#fcd9b6" stroke-width="5" stroke-linecap="round" fill="none"/>
  <circle cx="60" cy="18" r="6" fill="#fcd9b6"/>
  <!-- Stars of participation -->
  <circle cx="28" cy="36" r="5" fill="#f59e0b"/>
  <circle cx="92" cy="36" r="5" fill="#f59e0b"/>
  <polygon points="28,30 29.5,34.5 34,34.5 30.5,37 32,41.5 28,39 24,41.5 25.5,37 22,34.5 26.5,34.5" fill="#f59e0b" opacity="0.0"/>
  <!-- Decorative dots -->
  <circle cx="36" cy="74" r="4" fill="#dcfce7"/>
  <circle cx="60" cy="80" r="4" fill="#dcfce7"/>
  <circle cx="84" cy="74" r="4" fill="#dcfce7"/>
  <!-- Percent/vote symbols -->
  <circle cx="36" cy="74" r="4" fill="#15803d" opacity="0.3"/>
  <circle cx="84" cy="74" r="4" fill="#15803d" opacity="0.3"/>
</svg>
