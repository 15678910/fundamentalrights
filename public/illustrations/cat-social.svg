<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="사회권 - 집과 하트">
  <title>사회권 - 집과 하트</title>
  <rect width="120" height="120" rx="26" fill="#fde7f1"/>
  <!-- Large sheltering hand shape (cupped) -->
  <path d="M18 90 Q18 76 30 72 Q40 68 60 66 Q80 68 90 72 Q102 76 102 90" stroke="#db2777" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- Hand palm fill (subtle) -->
  <path d="M18 90 Q18 76 30 72 Q40 68 60 66 Q80 68 90 72 Q102 76 102 90 L102 102 Q102 108 96 108 L24 108 Q18 108 18 102Z" fill="#db2777" opacity="0.12"/>
  <!-- House body -->
  <rect x="36" y="66" width="48" height="38" rx="6" fill="#ffffff"/>
  <!-- House roof -->
  <polygon points="30,68 60,40 90,68" fill="#db2777"/>
  <!-- Chimney -->
  <rect x="72" y="44" width="8" height="16" rx="3" fill="#9d174d"/>
  <!-- Door -->
  <rect x="51" y="82" width="18" height="22" rx="6" fill="#db2777" opacity="0.8"/>
  <!-- Door knob -->
  <circle cx="66" cy="94" r="2.5" fill="#ffffff"/>
  <!-- Windows -->
  <rect x="40" y="72" width="14" height="12" rx="4" fill="#fbcfe8"/>
  <rect x="66" y="72" width="14" height="12" rx="4" fill="#fbcfe8"/>
  <!-- Window cross lines -->
  <line x1="47" y1="72" x2="47" y2="84" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="40" y1="78" x2="54" y2="78" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="73" y1="72" x2="73" y2="84" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="66" y1="78" x2="80" y2="78" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Heart floating above roof peak -->
  <path d="M60 30 C60 30 50 21 50 15 C50 10 55 7 60 12 C65 7 70 10 70 15 C70 21 60 30 60 30Z" fill="#f59e0b"/>
  <!-- Smoke puffs -->
  <circle cx="76" cy="40" r="4" fill="#fce7f3"/>
  <circle cx="80" cy="34" r="3.5" fill="#fce7f3"/>
  <circle cx="83" cy="28" r="3" fill="#fce7f3" opacity="0.6"/>
</svg>
